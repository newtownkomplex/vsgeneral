<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>DOT MONSTER QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#eee6c8;font-family:monospace}main{width:min(620px,100vw);min-height:100vh;margin:auto;background:#181c25;padding:10px;border:4px solid #303644}.scene{height:280px;position:relative;border:4px solid #e8dfb9;background:#52694d}.name,.ehp{position:absolute;top:8px;background:#111620;border:3px solid #e8dfb9;padding:5px;z-index:3}.name{left:8px}.ehp{right:8px}.sprite{position:absolute;width:192px;height:192px;left:50%;top:54%;transform:translate(-50%,-50%)}canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:6px;bottom:6px;width:125px;z-index:4}.stat{display:flex;justify-content:space-between;background:#111620dd;border:2px solid #aaa486;padding:4px;font-size:11px;margin:2px}.box{margin-top:8px;background:#10151e;border:4px solid #e8dfb9;padding:10px;min-height:70px}.cmds,.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}button{background:#252c39;color:#eee6c8;border:3px solid #687081;padding:11px;font:700 13px monospace}button:disabled{opacity:.35}.panel{display:none}.panel.open{display:block}.overlay{position:fixed;inset:0;background:#080a0ee8;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(520px,100%);background:#181d27;border:5px solid #e8dfb9;padding:16px}.modal button{width:100%;margin-top:6px}.enemy-hit{animation:eh .28s steps(3,end)}.screen-hit{animation:sh .28s steps(3,end)}@keyframes eh{0%,100%{transform:translate(-50%,-50%);filter:none}25%{transform:translate(calc(-50% - 7px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 7px),-50%);filter:brightness(.5)}75%{transform:translate(calc(-50% - 3px),-50%);filter:brightness(1.8)}}@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.5)}75%{transform:translate(-3px,1px);filter:brightness(1.7)}</style><main id="screen"><h3>DOT MONSTER QUEST</h3><section class="scene" id="scene"><div class="name" id="en"></div><div class="ehp" id="hp"></div><div class="sprite" id="spr"><canvas id="cv" width="32" height="32"></canvas></div><div class="stats" id="stats"></div></section><div class="box" id="msg"></div><div class="cmds"><button onclick="attack()">▶ こうげき</button><button onclick="magic()">▶ まほう</button><button onclick="skill()">▶ スキル</button><button onclick="item()">▶ アイテム</button></div><div class="panel" id="panel"></div></main><div class="overlay" id="ov"><div class="modal" id="modal"></div></div><script>const $=x=>document.getElementById(x),names=['ミズゴロ','コゲツムリ','ハネガサ','モリノワ','イワツブテラ','ヨルネコ','ツノカゲ','アワムシ','カゼノメ','ヌマグマ','ホシクイ','クロカブリ','シロツチ','ミミズバコ','カゲボウシ','アカネグモ','ソラノクチ','ネムリバナ','ガラクタマ','オオトビラ'],mn=['ルミナ','ヴェイル','グレイズ','ノクス','リフレア','ゼノン','ミストラ','オルタ','フロストル','エクリア'],sn=['裂光打','影縫い','轟き返し','空断ち','反転構え','連環撃','硬化突き','瞬歩撃','崩し刃','星砕き'];let s={n:1,e:null,eh:0,turn:1,st:{hp:30,max:30,speed:5,defence:2,critical:5,magicattack:3},magic:[],skill:null,pot:3,guard:0};function make(){let b=s.n%5===0,n=s.n;return{name:names[n-1],hp:10+n*2+(b?n*5:0),atk:2+Math.floor(n*.65)+(b?3:0),def:1+Math.floor(n/6)+(b?2:0),crit:4+n+(b?5:0),boss:b,magic:{name:mn[(n-1)%10],power:5+Math.floor(n/2)+(b?4:0),desc:'魔力で '+(5+Math.floor(n/2)+(b?4:0))+' ダメージ。'},skill:{name:sn[(n-1)%10],power:4+n+(b?5:0),desc:'特殊攻撃。威力 '+(4+n+(b?5:0))+'。'},r:{hp:1+(b?3:0),speed:b?1:0,defence:b?1:0,critical:b?1:0,magicattack:b?1:0}}}function setup(){s.e=make();s.eh=s.e.hp;s.turn=1;s.guard=0;s.msg=(s.e.boss?'★ 強敵 ★ ':'')+s.e.name+' が あらわれた！';render()}function render(){if(!s.e)return;$('en').textContent=s.e.name;$('hp').textContent='HP '+s.eh+' / '+s.e.hp;$('msg').textContent=s.msg;$('stats').innerHTML=[['HP',s.st.hp+'/'+s.st.max],['SPEED',s.st.speed],['DEFENCE',s.st.defence],['CRITICAL',s.st.critical+'%'],['MAGIC ATK',s.st.magicattack]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');document.querySelectorAll('.cmds button').forEach(x=>x.disabled=!s.turn||s.eh<=0);draw()}function draw(){let c=$('cv'),x=c.getContext('2d');x.clearRect(0,0,32,32);for(let y=0;y<32;y++)for(let i=0;i<32;i++){if(i>5&&i<27&&y>5&&y<27){x.fillStyle=(i+y)%7===0?'#17201b':'#d9e6ad';x.fillRect(i,y,1,1)}}}function flash(enemy){let el=enemy?$('spr'):$('screen');el.classList.remove(enemy?'enemy-hit':'screen-hit');void el.offsetWidth;el.classList.add(enemy?'enemy-hit':'screen-hit');setTimeout(()=>el.classList.remove(enemy?'enemy-hit':'screen-hit'),280)}function hit(d){s.eh=Math.max(0,s.eh-d);flash(1)}function attack(){if(!s.turn)return;let d=Math.max(1,5+Math.floor(Math.random()*4)+Math.floor(s.st.speed/3)-s.e.def);if(Math.random()*100<s.st.critical)d*=2;hit(d);s.msg='こうげき！ '+d+' ダメージ！';after()}function magic(){if(!s.magic.length){s.msg='覚えている魔法は ない。';render();return}panel('まほうを選ぶ',s.magic.map((m,i)=>({name:m.name,desc:m.desc,fn:()=>confirmMagic(i)})))}function confirmMagic(i){let m=s.magic[i];panel('もう一度選択すると発動', [{name:m.name,desc:m.desc,fn:()=>{close();hit(Math.max(1,m.power+s.st.magicattack-Math.floor(s.e.def/2)));s.msg=m.name+'を 発動！';after()}}])}function skill(){if(!s.skill){s.msg='覚えているスキルは ない。';render();return}panel('スキルを選ぶ',[{name:s.skill.name,desc:s.skill.desc,fn:()=>{close();hit(Math.max(1,s.skill.power+Math.floor(s.st.speed/3)-s.e.def));s.msg=s.skill.name+'！';after()}}])}function item(){panel('アイテム',[{name:'回復薬',desc:'HPを8回復 / 残り '+s.pot,fn:()=>{if(!s.pot)return;s.pot--;s.st.hp=Math.min(s.st.max,s.st.hp+8);close();s.msg='回復薬を 使った！';after()}},{name:'守勢',desc:'次の被ダメージ半減',fn:()=>{s.guard=1;close();s.msg='守りを固めた。';after()}}])}function panel(t,a){$('panel').className='panel open';$('panel').innerHTML='<div class="box"><b>'+t+'</b><div class="choices">'+a.map((q,i)=>'<button data-i="'+i+'">'+q.name+'<small>'+q.desc+'</small></button>').join('')+'</div></div>';document.querySelectorAll('.choice')};document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>a[+b.dataset.i].fn())}function close(){$('panel').className='panel';$('panel').innerHTML=''}function after(){render();if(s.eh<=0)return setTimeout(reward,280);s.turn=0;render();setTimeout(enemy,420)}function enemy(){let d=Math.max(1,s.e.atk+Math.floor(Math.random()*3)-s.st.defence);if(s.guard)d=Math.ceil(d/2);s.guard=0;if(Math.random()*100<s.e.crit)d*=2;s.st.hp=Math.max(0,s.st.hp-d);flash(0);s.msg=s.e.name+'の攻撃！ '+d+' ダメージ！';if(s.st.hp<=0)return lose();s.turn=1;render()}function reward(){let r=s.e.r;Object.keys(r).forEach(k=>s.st[k]+=r[k]);s.st.max+=r.hp;s.st.hp=Math.min(s.st.max,s.st.hp+4);let m=s.e.magic,k=s.e.skill;$('ov').classList.remove('hidden');$('modal').innerHTML='<h2>'+s.e.name+'を たおした！</h2><p>ステータス上昇：HP +'+r.hp+' / SPEED +'+r.speed+' / DEFENCE +'+r.defence+' / CRITICAL +'+r.critical+' / MAGIC ATK +'+r.magicattack+'</p><p>魔法「'+m.name+'」かスキル「'+k.name+'」を選択。</p><button id="m">魔法「'+m.name+'」</button><button id="k">スキル「'+k.name+'」</button>';$('m').onclick=()=>getM(m);$('k').onclick=()=>getK(k)}function getM(m){if(s.magic.length<4){s.magic.push(m);next('魔法「'+m.name+'」を覚えた！')}else replace('魔法',m)}function getK(k){if(!s.skill){s.skill=k;next('スキル「'+k.name+'」を覚えた！')}else replace('スキル',k)}function replace(t,n){$('modal').innerHTML='<h2>'+t+'がいっぱいだ！</h2><p>新しいものに入れ替えますか？</p><button id="yes">新しい「'+n.name+'」にする</button><button id="no">今のものを残す</button>';$('yes').onclick=()=>{if(t==='魔法')s.magic=[...s.magic.slice(0,3),n];else s.skill=n;next('新しい'+t+'を選んだ！')};$('no').onclick=()=>next('今の'+t+'を残した！')}function next(msg){$('ov').classList.add('hidden');s.msg=msg;s.n++;if(s.n>20)return finish();setup()}function finish(){ $('modal').innerHTML='<h1>QUEST COMPLETE!</h1><p>20戦突破！</p><button onclick="location.reload()">もう一度</button>';$('ov').classList.remove('hidden')}function lose(){$('modal').innerHTML='<h1>GAME OVER</h1><button onclick="location.reload()">もう一度</button>';$('ov').classList.remove('hidden')}setup();</script></html>
