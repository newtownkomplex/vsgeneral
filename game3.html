<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>DOT MONSTER QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#eee6c8;font-family:monospace}#app{width:min(620px,100%);min-height:100vh;margin:auto;background:#181c25;padding:10px;border:4px solid #303644}.title{text-align:center;padding:28px 10px}.title h1{font-size:26px;letter-spacing:3px}.menu{display:grid;gap:10px;margin-top:25px}button{background:#252c39;color:#eee6c8;border:3px solid #687081;padding:12px;font:700 13px monospace;min-height:46px}.balance{border:4px solid #e8dfb9;background:#10151e;padding:15px;margin:20px 0}.bar{margin:15px 0}.bar label{display:flex;justify-content:space-between}.track{height:20px;background:#252c39;border:2px solid #687081;margin-top:5px}.fill{height:100%;background:#d9c36a}.note{font-size:11px;line-height:1.7;color:#aaa895}.scene{height:280px;position:relative;border:4px solid #e8dfb9;background:#52694d}.name,.ehp{position:absolute;top:8px;background:#111620;border:3px solid #e8dfb9;padding:5px;z-index:3;font-size:12px}.name{left:8px}.ehp{right:8px}.sprite{position:absolute;width:192px;height:192px;left:50%;top:54%;transform:translate(-50%,-50%)}canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:5px;bottom:5px;width:130px;z-index:4}.stat{display:flex;justify-content:space-between;background:#111620e8;border:2px solid #aaa486;padding:4px;font-size:10px;margin:2px}.box{margin-top:8px;background:#10151e;border:4px solid #e8dfb9;padding:10px;min-height:70px;line-height:1.6}.cmds,.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.panel{display:none}.panel.open{display:block}.panel small{display:block;color:#aaa895;font-size:9px;margin-top:4px}.overlay{position:fixed;inset:0;background:#080a0ee8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{width:min(520px,100%);background:#181d27;border:5px solid #e8dfb9;padding:16px}.modal button{width:100%;margin-top:6px}.hidden{display:none!important}.enemy-hit{animation:eh .28s steps(3,end)}.screen-hit{animation:sh .28s steps(3,end)}@keyframes eh{0%,100%{transform:translate(-50%,-50%);filter:none}25%{transform:translate(calc(-50% - 7px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 7px),-50%);filter:brightness(.5)}75%{transform:translate(calc(-50% - 3px),-50%);filter:brightness(1.8)}}@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.5)}75%{transform:translate(-3px,1px);filter:brightness(1.7)}}</style></head><body><main id="app"></main><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>(()=>{const root=document.getElementById('app'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');const names=['ミズゴロ','コゲツムリ','ハネガサ','モリノワ','イワツブテラ','ヨルネコ','ツノカゲ','アワムシ','カゼノメ','ヌマグマ','ホシクイ','クロカブリ','シロツチ','ミミズバコ','カゲボウシ','アカネグモ','ソラノクチ','ネムリバナ','ガラクタマ','オオトビラ'];const mnames=['ルミナ','ヴェイル','グレイズ','ノクス','リフレア','ゼノン','ミストラ','オルタ','フロストル','エクリア'];const snames=['裂光打','影縫い','轟き返し','空断ち','反転構え','連環撃','硬化突き','瞬歩撃','崩し刃','星砕き'];let S={battle:1,enemy:null,ehp:0,turn:false,st:{hp:30,max:30,speed:5,defence:2,critical:5,attack:0,magicattack:0},magic:[],skill:null,potions:3,guard:false};const el=(id)=>document.getElementById(id);function showStart(){root.innerHTML='<section class="title"><h1>DOT MONSTER QUEST</h1><p>20体のモンスターを突破せよ。<br>すべてドットで描かれた世界。</p><div class="menu"><button id="begin">▶ ぼうけんを はじめる</button></div></section>';el('begin').addEventListener('click',showBalance)}function showBalance(){root.innerHTML='<section class="title"><h1>ABILITY SET</h1><p>攻撃と魔力のバランスを決めよう。</p><div class="balance"><div class="bar"><label><span>ATTACK</span><b id="attackValue"></b></label><div class="track"><div class="fill" id="attackFill"></div></div></div><div class="bar"><label><span>MAGIC ATTACK</span><b id="magicValue"></b></label><div class="track"><div class="fill" id="magicFill"></div></div></div></div><p class="note">シャッフルするたび、攻撃と魔力の配分が変化します。<br>気に入った配分で「確定」を押してください。</p><div class="menu"><button id="shuffle">▶ バランスを シャッフル</button><button id="confirm">▶ このバランスで バトルスタート</button></div></section>';el('shuffle').addEventListener('click',shuffle);el('confirm').addEventListener('click',start);shuffle()}function shuffle(){const total=11,a=Math.floor(Math.random()*(total+1));S.st.attack=a;S.st.magicattack=total-a;el('attackValue').textContent=a;el('magicValue').textContent=total-a;el('attackFill').style.width=a/total*100+'%';el('magicFill').style.width=(total-a)/total*100+'%'}function makeEnemy(){const n=S.battle,boss=n%5===0;return{name:names[n-1],boss,hp:10+n*2+(boss?n*5:0),atk:2+Math.floor(n*.65)+(boss?3:0),def:1+Math.floor(n/6)+(boss?2:0),crit:4+n+(boss?5:0),magic:{name:mnames[(n-1)%10],power:5+Math.floor(n/2)+(boss?4:0)},skill:{name:snames[(n-1)%10],power:4+n+(boss?5:0)},reward:{hp:1+(boss?3:0),speed:boss?1:0,defence:boss?1:0,critical:boss?1:0,magicattack:boss?1:0}}}function battle(){S.enemy=makeEnemy();S.ehp=S.enemy.hp;S.turn=true;S.guard=false;root.innerHTML='<h3>DOT MONSTER QUEST　戦 '+S.battle+' / 20</h3><section class="scene" id="scene"><div class="name" id="enemyName"></div><div class="ehp" id="enemyHP"></div><div class="sprite" id="sprite"><canvas id="canvas" width="32" height="32"></canvas></div><div class="stats" id="stats"></div></section><div class="box" id="message"></div><div class="cmds"><button id="attack">▶ こうげき</button><button id="magic">▶ まほう</button><button id="skill">▶ スキル</button><button id="item">▶ アイテム</button></div><div class="panel" id="panel"></div>';el('attack').onclick=attack;el('magic').onclick=magic;el('skill').onclick=skill;el('item').onclick=item;S.message=(S.enemy.boss?'★ 強敵 ★ ':'')+S.enemy.name+' が あらわれた！';render()}function render(){el('enemyName').textContent=S.enemy.name;el('enemyHP').textContent='HP '+S.ehp+' / '+S.enemy.hp;el('message').textContent=S.message;el('stats').innerHTML=[['HP',S.st.hp+'/'+S.st.max],['SPEED',S.st.speed],['DEFENCE',S.st.defence],['CRITICAL',S.st.critical+'%'],['MAGIC ATK',S.st.magicattack],['ATTACK',S.st.attack]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');document.querySelectorAll('.cmds button').forEach(b=>b.disabled=!S.turn||S.ehp<=0);draw()}function draw(){const c=el('canvas'),x=c.getContext('2d');x.clearRect(0,0,32,32);for(let y=6;y<27;y++)for(let i=6;i<27;i++){x.fillStyle=(i+y)%7===0?'#17201b':'#d9e6ad';x.fillRect(i,y,1,1)}}function effect(enemy){const node=el(enemy?'sprite':'scene');node.classList.remove(enemy?'enemy-hit':'screen-hit');void node.offsetWidth;node.classList.add(enemy?'enemy-hit':'screen-hit');setTimeout(()=>node.classList.remove(enemy?'enemy-hit':'screen-hit'),280)}function damage(n){S.ehp=Math.max(0,S.ehp-n);effect(true)}function attack(){if(!S.turn)return;const d=Math.max(1,S.st.attack+Math.floor(Math.random()*4)-S.enemy.def)*(Math.random()*100<S.st.critical?2:1);damage(d);S.message=(d>15?'会心の一撃！ ':'こうげき！ ')+d+' ダメージ！';afterPlayer()}function magic(){if(!S.magic.length){S.message='覚えている魔法は ない。';render();return}openPanel('まほうを選ぶ',S.magic.map((m,i)=>({name:m.name,desc:'威力 '+m.power+' + 魔力',fn:()=>openPanel('もう一度選択すると発動',[{name:m.name,desc:'魔力 '+S.st.magicattack+' を加算',fn:()=>{closePanel();damage(Math.max(1,m.power+S.st.magicattack-Math.floor(S.enemy.def/2)));S.message=m.name+'を 発動！';afterPlayer()}}])})));}function skill(){if(!S.skill){S.message='覚えているスキルは ない。';render();return}openPanel('スキルを選ぶ',[{name:S.skill.name,desc:'威力 '+S.skill.power,fn:()=>{closePanel();damage(Math.max(1,S.skill.power+Math.floor(S.st.speed/3)-S.enemy.def));S.message=S.skill.name+'！';afterPlayer()}}])}function item(){openPanel('アイテム',[{name:'回復薬',desc:'HPを8回復 / 残り '+S.potions,fn:()=>{if(!S.potions){S.message='回復薬が ない。';closePanel();render();return}S.potions--;S.st.hp=Math.min(S.st.max,S.st.hp+8);closePanel();S.message='回復薬を 使った！';afterPlayer()}},{name:'守勢',desc:'次の被ダメージ半減',fn:()=>{S.guard=true;closePanel();S.message='守りを固めた。';afterPlayer()}}])}function openPanel(title,items){const p=el('panel');p.className='panel open';p.innerHTML='<div class="box"><b>'+title+'</b><div class="choices">'+items.map((q,i)=>'<button class="choice" data-i="'+i+'">'+q.name+'<small>'+q.desc+'</small></button>').join('')+'</div></div>';p.querySelectorAll('.choice').forEach((b)=>b.onclick=()=>items[Number(b.dataset.i)].fn())}function closePanel(){const p=el('panel');p.className='panel';p.innerHTML=''}function afterPlayer(){render();if(S.ehp<=0){S.turn=false;return setTimeout(reward,300)}S.turn=false;render();setTimeout(enemyTurn,420)}function enemyTurn(){let d=Math.max(1,S.enemy.atk+Math.floor(Math.random()*3)-S.st.defence);if(S.guard)d=Math.ceil(d/2);S.guard=false;if(Math.random()*100<S.enemy.crit)d*=2;S.st.hp=Math.max(0,S.st.hp-d);effect(false);S.message=S.enemy.name+'の攻撃！ '+d+' ダメージ！';if(S.st.hp<=0)return gameOver();S.turn=true;render()}function reward(){const r=S.enemy.reward;S.st.max+=r.hp;S.st.hp=Math.min(S.st.max,S.st.hp+4);S.st.speed+=r.speed;S.st.defence+=r.defence;S.st.critical+=r.critical;S.st.magicattack+=r.magicattack;overlay.classList.remove('hidden');modal.innerHTML='<h2>'+S.enemy.name+'を たおした！</h2><p>ステータス上昇：HP +'+r.hp+' / SPEED +'+r.speed+' / DEFENCE +'+r.defence+' / CRITICAL +'+r.critical+' / MAGIC ATK +'+r.magicattack+'</p><p>魔法かスキルを1つ選択。</p><button id="rewardMagic">魔法「'+S.enemy.magic.name+'」</button><button id="rewardSkill">スキル「'+S.enemy.skill.name+'」</button>';el('rewardMagic').onclick=()=>gainMagic(S.enemy.magic);el('rewardSkill').onclick=()=>gainSkill(S.enemy.skill)}function gainMagic(m){if(S.magic.length<4){S.magic.push(m);nextBattle()}else replaceMagic(m)}function replaceMagic(m){modal.innerHTML='<h2>魔法がいっぱいだ！</h2><p>新しい魔法を残す？</p><button id="yes">新しい「'+m.name+'」を残す</button><button id="no">今の魔法を残す</button>';el('yes').onclick=()=>{S.magic=[...S.magic.slice(0,3),m];nextBattle()};el('no').onclick=nextBattle}function gainSkill(k){if(!S.skill){S.skill=k;nextBattle()}else{modal.innerHTML='<h2>スキルがいっぱいだ！</h2><p>新しいスキルを残す？</p><button id="yes">新しい「'+k.name+'」を残す</button><button id="no">今のスキルを残す</button>';el('yes').onclick=()=>{S.skill=k;nextBattle()};el('no').onclick=nextBattle}}function nextBattle(){overlay.classList.add('hidden');S.battle++;if(S.battle>20)return complete();battle()}function complete(){overlay.classList.remove('hidden');modal.innerHTML='<h1>QUEST COMPLETE!</h1><p>20戦突破！</p><button id="restart">もう一度</button>';el('restart').onclick=()=>location.reload()}function gameOver(){overlay.classList.remove('hidden');modal.innerHTML='<h1>GAME OVER</h1><button id="restart">もう一度</button>';el('restart').onclick=()=>location.reload()}showStart()})();</script></body></html>
