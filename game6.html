<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#07060b;color:#eee9d8;font-family:monospace}#g{width:min(720px,100%);min-height:100vh;margin:auto;background:#0d0b14;border:4px solid #eee9d8;padding:10px}button,input{width:100%;min-height:46px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8;padding:9px;font:700 13px monospace}input{margin:8px 0}.title{text-align:center;padding:40px 12px}.menu,.cmd,.choices{display:grid;gap:7px;margin-top:12px}.cmd,.choices{grid-template-columns:1fr 1fr}.box{border:3px solid #eee9d8;background:#09080e;padding:12px;margin:10px 0}.bar{margin:12px 0}.bar label{display:flex;justify-content:space-between}.track{height:18px;border:2px solid #eee9d8;background:#211a29}.fill{height:100%;background:#8555c5}.scene{height:340px;position:relative;overflow:hidden;border:3px solid #eee9d8;background:#171020}.enemyname,.ehp{position:absolute;top:7px;background:#09080e;border:3px solid #eee9d8;padding:5px;z-index:3}.enemyname{left:7px}.ehp{right:7px}.sprite{position:absolute;left:38%;top:54%;width:250px;height:250px;transform:translate(-50%,-50%)}canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:6px;bottom:6px;width:145px}.stat{display:flex;justify-content:space-between;background:#09080eee;border:2px solid #9990a4;padding:4px;margin:2px;font-size:10px}.panel{display:none}.panel.on{display:block}.panel small{display:block;color:#aaa3b8;font-size:9px;margin-top:3px}.ov{position:fixed;inset:0;background:#030207ee;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{width:min(540px,100%);background:#0d0b14;border:4px solid #eee9d8;padding:16px;max-height:90vh;overflow:auto}.hidden{display:none}.hit{animation:h .28s steps(3,end)}.shake{animation:s .28s steps(3,end)}@keyframes h{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 8px),-50%);filter:brightness(.4)}75%{transform:translate(calc(-50% - 3px),-50%);filter:brightness(1.8)}}@keyframes s{0%,100%{transform:none}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.4)}75%{transform:translate(-3px,1px);filter:brightness(1.8)}}</style><main id="g"></main><div id="ov" class="ov hidden"><div id="modal" class="modal"></div></div><script>"use strict";(()=>{const G=document.getElementById('g'),OV=document.getElementById('ov'),MOD=document.getElementById('modal'),$=id=>document.getElementById(id);const names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];const spells=[['影炎流',2,5,0,'闇の炎を放つ。'],['白燐',3,6,1,'光属性。闇属性へ1.5倍。'],['月鉛の棘',4,7,0,'重い棘を撃つ。'],['虚無の眼',5,8,0,'虚無の視線。'],['黒雨',6,9,0,'黒い雨を落とす。'],['黎明針',7,10,1,'光属性。闇属性へ1.5倍。'],['冥灯',8,11,0,'冥い灯火。'],['白骸光',9,12,1,'光属性。闇属性へ1.5倍。'],['夜葬',10,13,0,'夜を凝縮する。'],['灰界',12,15,1,'光属性。闇属性へ1.5倍。']];const skills=[['裂骨打','double',1,5,'攻撃力で2連攻撃。'],['影縫い','guard',1.5,6,'次の敵攻撃を無効化し1.5倍攻撃。'],['喉断ち','power',1.7,7,'攻撃力×1.7。'],['連環裂','doublePower',1.25,8,'攻撃力×1.25を2連撃。'],['空葬','guard',1.5,9,'次の敵攻撃を無効化し1.5倍攻撃。'],['反転構え','power',2,10,'攻撃力×2。'],['硬化突き','power',1.8,11,'攻撃力×1.8。'],['瞬歩殺','double',1,12,'攻撃力で2連攻撃。'],['崩し刃','power',2.2,13,'攻撃力×2.2。'],['星砕き','guard',1.5,14,'次の敵攻撃を無効化し1.5倍攻撃。']];let S={name:'',stage:1,enemy:null,ehp:0,turn:false,guard:false,mp:0,maxmp:20,potions:3,magic:[],skill:null,st:{hp:30,max:30,speed:5,defence:2,critical:5,attack:0,magicattack:0}};function intro(){G.innerHTML='<section class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="menu"><button id="b">▶ ぼうけんを はじめる</button><button id="r">▶ これまでの記録</button></div></section>';$('b').onclick=balance;$('r').onclick=records}function balance(){G.innerHTML='<section class="title"><h1>ABILITY SET</h1><input id="pn" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力の初期値を決めよう。</p><div class="box"><div class="bar"><label>ATTACK <b id="av"></b></label><div class="track"><div id="af" class="fill"></div></div></div><div class="bar"><label>MAGIC ATTACK <b id="mv"></b></label><div class="track"><div id="mf" class="fill"></div></div></div></div><div class="menu"><button id="sh">▶ バランスをシャッフル</button><button id="go">▶ 確定してバトルスタート</button></div></section>';shuffle();$('sh').onclick=shuffle;$('go').onclick=()=>{let n=$('pn').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}S.name=n;battle()}}function shuffle(){let a=1+Math.floor(Math.random()*11);S.st.attack=a;S.st.magicattack=12-a;$('av').textContent=a;$('mv').textContent=12-a;$('af').style.width=a/12*100+'%';$('mf').style.width=(12-a)/12*100+'%'}function makeEnemy(){let n=S.stage,b=n%5===0;return{name:names[n-1],boss:b,shadow:b||n%3===0,hp:12+n*2+(b?n*5:0),atk:3+Math.floor(n*.7)+(b?4:0),def:1+Math.floor(n/5)+(b?2:0),crit:5+n+(b?5:0),type:n-1,spell:spells[(n-1)%10],skill:skills[(n-1)%10]}}function battle(){S.enemy=makeEnemy();S.ehp=S.enemy.hp;S.turn=true;S.guard=false;G.innerHTML='<h3>'+S.name+'　戦 '+S.stage+' / 20</h3><section class="scene" id="scene"><div class="enemyname" id="en"></div><div class="ehp" id="hp"></div><div class="sprite" id="spr"><canvas id="cv" width="32" height="32"></canvas></div><div class="stats" id="stats"></div></section><div class="box" id="msg"></div><div class="cmd"><button id="a">▶ こうげき</button><button id="m">▶ まほう</button><button id="s">▶ スキル</button><button id="i">▶ アイテム</button></div><div id="panel" class="panel"></div>';$('a').onclick=attack;$('m').onclick=magicMenu;$('s').onclick=skillMenu;$('i').onclick=item;S.msg=(S.enemy.boss?'★ 強敵 ★ ':'')+S.enemy.name+' が あらわれた！';render()}function render(){$('en').textContent=S.enemy.name;$('hp').textContent='HP '+S.ehp+' / '+S.enemy.hp;$('msg').textContent=S.msg;$('stats').innerHTML=[['HP',S.st.hp+'/'+S.st.max],['SPEED',S.st.speed],['DEFENCE',S.st.defence],['CRITICAL',S.st.critical+'%'],['MAGIC ATK',S.st.magicattack],['ATTACK',S.st.attack],['MP',S.mp+'/'+S.maxmp]].map(v=>'<div class="stat"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join('');document.querySelectorAll('.cmd button').forEach(b=>b.disabled=!S.turn||S.ehp<=0);draw()}function draw(){let c=$('cv').getContext('2d'),B='#050509',W='#eee9d8',D='#4b4650',P='#7540a4',R='#b54a4a',Y='#d1a34b',C='#c8c2d0';c.clearRect(0,0,32,32);let t=S.enemy.type;function q(x,y,w,h,z){c.fillStyle=z;c.fillRect(x,y,w,h)}q(7,7,18,17,B);q(10,9,12,14,D);q(12,11,3,3,t%4===0?R:W);q(18,11,3,3,t%4===0?R:W);if(t%5===0)q(13,3,6,5,Y);if(t%4===1)q(4,12,5,8,P);if(t%4===2)q(23,12,5,8,P);if(t%3===0)q(12,18,8,3,R);if(t%3===1){q(5,8,5,3,C);q(22,8,5,3,C)}if(t%3===2){q(10,23,4,5,B);q(18,23,4,5,B)}}function fx(enemy){let e=$(enemy?'spr':'scene');e.classList.remove(enemy?'hit':'shake');void e.offsetWidth;e.classList.add(enemy?'hit':'shake');setTimeout(()=>e.classList.remove(enemy?'hit':'shake'),280)}function hit(d){S.ehp=Math.max(0,S.ehp-d);fx(1)}function end(){render();if(S.ehp<=0){S.turn=false;setTimeout(reward,280);return}S.turn=false;setTimeout(enemyTurn,420)}function attack(){if(!S.turn)return;let d=Math.max(1,S.st.attack+Math.floor(Math.random()*3)-S.enemy.def);if(Math.random()*100<S.st.critical)d*=2;hit(d);S.msg='こうげき！ '+d+' ダメージ！';end()}function magicMenu(){if(!S.magic.length){S.msg='魔法を覚えていない。';render();return}panel('魔法を選択',S.magic.map(m=>({n:m.name,d:'MP '+m.cost+' / 威力 '+m.power+(m.light?' / 光':'')+'｜'+m.desc,fn:()=>{panel('もう一度選択すると発動',[{n:m.name,d:'MP '+m.cost+' 消費',fn:()=>cast(m)}])}})))}function cast(m){if(S.mp<m.cost){S.msg='MPが足りない。';close();render();return}S.mp-=m.cost;let d=S.st.magicattack*m.power;if(m.light&&S.enemy.shadow)d=Math.floor(d*1.5);hit(d);S.msg=m.name+'！ '+d+' ダメージ！';close();end()}function skillMenu(){if(!S.skill){S.msg='スキルを覚えていない。';render();return}let k=S.skill;panel('スキルを選択',[{n:k.name,d:'MP '+k.cost+' / '+k.desc,fn:()=>{panel('もう一度選択すると発動',[{n:k.name,d:'MP '+k.cost+' 消費',fn:()=>useSkill(k)}])}}])}function useSkill(k){if(S.mp<k.cost){S.msg='MPが足りない。';close();render();return}S.mp-=k.cost;let d;if(k.type==='double'){let a=Math.max(1,S.st.attack-S.enemy.def);hit(a);if(S.ehp>0)hit(a);d=a*2}else if(k.type==='doublePower'){let a=Math.max(1,Math.floor(S.st.attack*k.mult)-S.enemy.def);hit(a);if(S.ehp>0)hit(a);d=a*2}else{d=Math.max(1,Math.floor(S.st.attack*k.mult)-S.enemy.def);hit(d);if(k.type==='guard')S.guard=true}S.msg=k.name+'！ '+d+' ダメージ！';close();end()}function item(){panel('アイテム',[{n:'回復薬',d:'HPを10回復 / 残り '+S.potions,fn:()=>{if(!S.potions){S.msg='回復薬がない。';close();render();return}S.potions--;S.st.hp=Math.min(S.st.max,S.st.hp+10);S.msg='回復薬を使った！';close();end()}},{n:'魔力水',d:'MPを10回復',fn:()=>{S.mp=Math.min(S.maxmp,S.mp+10);S.msg='魔力水を飲んだ！';close();end()}}])}function panel(t,a){let p=$('panel');p.className='panel on';p.innerHTML='<div class="box"><b>'+t+'</b><div class="choices">'+a.map((x,i)=>'<button data-i="'+i+'">'+x.n+'<small>'+x.d+'</small></button>').join('')+'</div></div>';p.querySelectorAll('button').forEach(b=>b.onclick=()=>a[+b.dataset.i].fn())}function close(){$('panel').className='panel';$('panel').innerHTML=''}function enemyTurn(){let d=Math.max(1,S.enemy.atk+Math.floor(Math.random()*3)-S.st.defence);if(S.guard){d=0;S.guard=false}S.st.hp=Math.max(0,S.st.hp-d);fx(0);S.msg=d?' '+S.enemy.name+'の攻撃！ '+d+' ダメージ！':' '+S.enemy.name+'の攻撃をかわした！';if(S.st.hp<=0)return finish(false);S.turn=true;render()}function reward(){let n=S.stage;S.st.hp=S.st.max;S.st.speed+=n;S.st.defence+=n;S.st.critical+=n;S.st.attack+=n;S.st.magicattack+=n;S.mp=Math.min(S.maxmp,S.mp+5);let sp=S.enemy.spell,sk=S.enemy.skill;OV.classList.remove('hidden');MOD.innerHTML='<h2>'+S.enemy.name+'をたおした！</h2><p>全HP回復。</p><p>全ステータス +'+n+'（戦 '+n+' クリア）</p><p>獲得するものを選択。</p><button id="gm">魔法「'+sp[0]+'」<small>MP '+sp[2]+' / 威力 '+sp[1]+'</small></button><button id="gs">スキル「'+sk[0]+'」<small>MP '+sk[3]+' / '+sk[4]+'</small></button>';MOD.querySelector('#gm').onclick=()=>gainMagic(sp);MOD.querySelector('#gs').onclick=()=>gainSkill(sk)}function gainMagic(x){let m={name:x[0],power:x[1],cost:x[2],light:!!x[3],desc:x[4]};if(S.magic.length<4){S.magic.push(m);next()}else replace('魔法',m)}function gainSkill(x){let k={name:x[0],type:x[1],mult:x[2],cost:x[3],desc:x[4]};if(!S.skill){S.skill=k;next()}else replace('スキル',k)}function replace(type,n){MOD.innerHTML='<h2>'+type+'がいっぱいだ！</h2><button id="y">新しい「'+n.name+'」を残す</button><button id="no">今のものを残す</button>';$('y').onclick=()=>{if(type==='魔法')S.magic=[...S.magic.slice(0,3),n];else S.skill=n;next()};$('no').onclick=next}function next(){OV.classList.add('hidden');S.stage++;if(S.stage>20)return finish(true);battle()}function finish(clear){OV.classList.remove('hidden');let title=clear?'QUEST COMPLETE!':'GAME OVER';MOD.innerHTML='<h1>'+title+'</h1><p>'+S.name+' / 到達戦 '+(clear?20:S.stage)+'</p><p>記録に残しますか？</p><button id="save">記録する</button><button id="discard">残さない</button>';$('save').onclick=()=>{saveRecord(clear);MOD.innerHTML='<h2>記録しました</h2><button onclick="location.reload()">起動画面へ</button>'};$('discard').onclick=()=>location.reload()}function saveRecord(clear){let a=JSON.parse(localStorage.getItem('vmq_records')||'[]');a.unshift({name:S.name,clear,stage:clear?20:S.stage,magic:S.magic.map(x=>x.name),skill:S.skill?S.skill.name:null,stats:{...S.st}});localStorage.setItem('vmq_records',JSON.stringify(a.slice(0,30)))}function records(){let a=JSON.parse(localStorage.getItem('vmq_records')||'[]');G.innerHTML='<section class="title"><h1>RECORDS</h1><div class="box">'+(a.length?a.map((r,i)=>'<div class="box"><b>#'+(i+1)+' '+r.name+'</b><p>'+(r.clear?'CLEAR':'失格')+' / 到達戦 '+r.stage+'</p><p>魔法：'+(r.magic.join(' / ')||'なし')+'</p><p>スキル：'+(r.skill||'なし')+'</p><p>HP '+r.stats.hp+' / SPD '+r.stats.speed+' / DEF '+r.stats.defence+' / CRT '+r.stats.critical+' / ATK '+r.stats.attack+' / MATK '+r.stats.magicattack+'</p></div>').join(''):'記録はまだありません。')+'</div><button id="back">▶ 戻る</button></section>';$('back').onclick=intro}intro()})();</script></html>
