<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID MONSTER QUEST</title><style>html,body{margin:0;min-height:100%;background:#08070d;color:#eee9d8;font-family:monospace}#app{max-width:720px;min-height:100vh;margin:auto;padding:24px;box-sizing:border-box;background:#0d0b14;border:4px solid #eee9d8}h1{font-size:28px;text-align:center;margin:70px 0 20px}p{text-align:center}button{display:block;width:100%;margin:12px 0;padding:16px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8;font:700 16px monospace;cursor:pointer}button:active{transform:translateY(2px)}.box{border:3px solid #eee9d8;padding:16px;margin:20px 0}input{width:100%;box-sizing:border-box;padding:14px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8;font:16px monospace}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{border:2px solid #888;padding:8px;display:flex;justify-content:space-between}.enemy{height:260px;border:3px solid #eee9d8;background:#171020;display:flex;align-items:center;justify-content:center;font-size:42px}.menu{margin-top:30px}.error{color:#ff8888}</style></head><body><main id="app"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="menu"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div></main><script>(function(){'use strict';var app=document.getElementById('app');var state={name:'',stage:1,attack:6,magic:6,hp:30,maxhp:30,speed:5,defence:2,critical:5,mp:20,maxmp:20,spells:[],skill:null,enemy:null};var enemies=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var spells=[['影炎流',2,false],['白燐',3,true],['月鉛の棘',4,false],['虚無の眼',5,false],['黒雨',6,false],['黎明針',7,true],['冥灯',8,false],['白骸光',9,true],['夜葬',10,false],['灰界',12,true]];var skills=[['裂骨打','2連攻撃',5],['影縫い','次の敵攻撃を無効化し1.5倍攻撃',6],['喉断ち','攻撃力×1.7',7],['連環裂','攻撃力×1.25を2連撃',8],['空葬','次の敵攻撃を無効化し1.5倍攻撃',9],['反転構え','攻撃力×2',10],['硬化突き','攻撃力×1.8',11],['瞬歩殺','2連攻撃',12],['崩し刃','攻撃力×2.2',13],['星砕き','次の敵攻撃を無効化し1.5倍攻撃',14]];function title(){app.innerHTML='<h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="menu"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div>';document.getElementById('start').onclick=setup;document.getElementById('records').onclick=records}function setup(){app.innerHTML='<h1>ABILITY SET</h1><div class="box"><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力の合計12</p><div id="values"></div><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定してバトルスタート</button></div>';shuffle();document.getElementById('shuffle').onclick=shuffle;document.getElementById('go').onclick=function(){var n=document.getElementById('name').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}state.name=n;state.stage=1;state.hp=state.maxhp=30;state.speed=5;state.defence=2;state.critical=5;state.mp=state.maxmp=20;state.spells=[];state.skill=null;battle()}}function shuffle(){state.attack=1+Math.floor(Math.random()*11);state.magic=12-state.attack;var v=document.getElementById('values');if(v)v.innerHTML='<div class="stats"><div class="stat"><span>ATTACK</span><b>'+state.attack+'</b></div><div class="stat"><span>MAGIC ATTACK</span><b>'+state.magic+'</b></div></div>'}function battle(){var n=state.stage,boss=n%5===0;state.enemy={name:enemies[n-1],boss:boss,shadow:n%2===0,hp:12+n*3+(boss?n*5:0),max:12+n*3+(boss?n*5:0),atk:2+Math.floor(n*.7)+(boss?4:0),def:Math.floor(n/5)+(boss?3:0)};drawBattle()}function drawBattle(){var e=state.enemy;app.innerHTML='<h2>戦闘 '+state.stage+' / 20</h2><div class="enemy">'+(e.boss?'☠':'◈')+'</div><div class="box"><b>'+e.name+'</b><br>敵HP '+e.hp+' / '+e.max+'</div><div class="stats"><div class="stat">HP <b>'+state.hp+'/'+state.maxhp+'</b></div><div class="stat">SPEED <b>'+state.speed+'</b></div><div class="stat">DEFENCE <b>'+state.defence+'</b></div><div class="stat">CRITICAL <b>'+state.critical+'%</b></div><div class="stat">MAGIC ATK <b>'+state.magic+'</b></div><div class="stat">ATTACK <b>'+state.attack+'</b></div><div class="stat">MP <b>'+state.mp+'/'+state.maxmp+'</b></div></div><div class="box"><p>'+ (e.boss?'★ 強敵 ★ ':'')+e.name+' が あらわれた！</p><button id="attack">▶ こうげき</button><button id="spell">▶ まほう</button><button id="skill">▶ スキル</button><button id="item">▶ アイテム</button></div>';document.getElementById('attack').onclick=attack;document.getElementById('spell').onclick=spellMenu;document.getElementById('skill').onclick=skillMenu;document.getElementById('item').onclick=item}function attack(){var d=Math.max(1,state.attack-state.enemy.def);if(Math.random()*100<state.critical)d*=2;state.enemy.hp=Math.max(0,state.enemy.hp-d);if(state.enemy.hp<=0){clearStage()}else{state.hp=Math.max(0,state.hp-Math.max(1,state.enemy.atk-state.defence));if(state.hp<=0)finish(false);else drawBattle()}}function spellMenu(){if(!state.spells.length){state.spells.push(makeSpell(0))}app.innerHTML='<h2>まほう</h2>'+state.spells.map(function(s,i){return '<button data-i="'+i+'">'+s.name+'　MP '+s.cost+'　威力 '+s.power+(s.light?'　光属性':'')+'</button>'}).join('')+'<button id="back">▶ 戻る</button>';app.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var s=state.spells[+b.dataset.i];if(state.mp<s.cost)return alert('MPが足りない');state.mp-=s.cost;var d=state.magic*s.power;if(s.light&&state.enemy.shadow)d=Math.floor(d*1.5);state.enemy.hp=Math.max(0,state.enemy.hp-d);if(state.enemy.hp<=0)clearStage();else{state.hp=Math.max(0,state.hp-Math.max(1,state.enemy.atk-state.defence));if(state.hp<=0)finish(false);else drawBattle()}}});document.getElementById('back').onclick=drawBattle}function makeSpell(i){var s=spells[i%spells.length];return{name:s[0],power:s[1]+Math.floor((state.stage-1)/3),light:s[2],cost:2+Math.floor(state.stage/4)}}function skillMenu(){if(!state.skill)state.skill=makeSkill((state.stage-1)%skills.length);var k=state.skill;app.innerHTML='<h2>'+k.name+'</h2><div class="box">MP '+k.cost+'<br>'+k.desc+'</div><button id="use">▶ もう一度選択して発動</button><button id="back">▶ 戻る</button>';document.getElementById('use').onclick=function(){if(state.mp<k.cost)return alert('MPが足りない');state.mp-=k.cost;var d;if(k.kind==='double'){d=Math.max(1,state.attack-state.enemy.def)*2}else if(k.kind==='guard'){d=Math.floor(state.attack*1.5);state.guard=true}else d=Math.floor(state.attack*k.mult);state.enemy.hp=Math.max(0,state.enemy.hp-d);if(state.enemy.hp<=0)clearStage();else{if(!state.guard)state.hp=Math.max(0,state.hp-Math.max(1,state.enemy.atk-state.defence));state.guard=false;if(state.hp<=0)finish(false);else drawBattle()}};document.getElementById('back').onclick=drawBattle}function makeSkill(i){var s=skills[i];var k={name:s[0],desc:s[1],cost:s[2]};if(s[1].indexOf('2連')>=0)k.kind='double';else if(s[1].indexOf('無効')>=0)k.kind='guard';else{k.kind='power';k.mult=parseFloat(s[1].match(/[0-9.]+/)[0])}return k}function item(){if(state.hp<state.maxhp)state.hp=Math.min(state.maxhp,state.hp+10);else state.mp=Math.min(state.maxmp,state.mp+10);drawBattle()}function clearStage(){state.hp=state.maxhp;state.mp=state.maxmp;var n=state.stage;state.maxhp+=n;state.hp=state.maxhp;state.speed+=n;state.defence+=n;state.critical+=n;state.attack+=n;state.magic+=n;state.maxmp+=n;state.mp=state.maxmp;var m=makeSpell(n-1);if(state.spells.length<4)state.spells.push(m);else if(confirm('新しい魔法を残しますか？'))state.spells[n%4]=m;var k=makeSkill((n-1)%skills.length);if(!state.skill)state.skill=k;else if(confirm('新しいスキル「'+k.name+'」に入れ替えますか？'))state.skill=k;if(n>=20)finish(true);else{state.stage++;battle()}}function finish(clear){var rec={name:state.name,clear:clear,stage:state.stage,spells:state.spells.map(function(x){return x.name}),skill:state.skill?state.skill.name:'なし',stats:{hp:state.hp,speed:state.speed,defence:state.defence,critical:state.critical,attack:state.attack,magic:state.magic}};if(confirm((clear?'20戦クリア！':'失格…')+' 記録に残しますか？')){var r=JSON.parse(localStorage.getItem('vmq')||'[]');r.push(rec);localStorage.setItem('vmq',JSON.stringify(r))}title()}function records(){var r=JSON.parse(localStorage.getItem('vmq')||'[]');app.innerHTML='<h2>これまでの記録</h2>'+(r.length?r.map(function(x){return '<div class="box"><b>'+x.name+'</b>　'+(x.clear?'CLEAR':'失格')+'<br>到達：'+x.stage+'戦<br>魔法：'+x.spells.join(' / ')+'<br>スキル：'+x.skill+'<br>HP '+x.stats.hp+' / SPEED '+x.stats.speed+' / DEFENCE '+x.stats.defence+' / CRITICAL '+x.stats.critical+' / ATTACK '+x.stats.attack+' / MAGIC ATK '+x.stats.magic+'</div>'}).join(''):'<p>まだ記録はありません。</p>')+'<button id="back">▶ 戻る</button>';document.getElementById('back').onclick=title}title()})();</script></body></html>
