<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08070d;color:#eee9d8;font-family:monospace}body{min-height:100vh}#app{width:min(720px,100%);min-height:100vh;margin:auto;padding:10px;background:#0d0b14;border:4px solid #eee9d8}h1,h2,h3{margin:8px 0}button,input{width:100%;min-height:48px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8;padding:10px;font:700 13px monospace}button:disabled{opacity:.4}.title{text-align:center;padding:45px 12px}.menu,.grid{display:grid;gap:8px;margin-top:14px}.grid{grid-template-columns:1fr 1fr}.box{border:3px solid #eee9d8;background:#09080e;padding:12px;margin:10px 0}.bar{margin:12px 0}.bar label{display:flex;justify-content:space-between}.track{height:18px;border:2px solid #eee9d8;background:#211a29}.fill{height:100%;background:#8555c5}.scene{height:340px;position:relative;overflow:hidden;border:3px solid #eee9d8;background:#171020}.enemyname,.ehp{position:absolute;top:7px;background:#09080e;border:3px solid #eee9d8;padding:5px;z-index:3}.enemyname{left:7px}.ehp{right:7px}.sprite{position:absolute;left:38%;top:54%;width:250px;height:250px;transform:translate(-50%,-50%)}canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:6px;bottom:6px;width:150px}.stat{display:flex;justify-content:space-between;background:#09080e;border:2px solid #9990a4;padding:4px;margin:2px;font-size:10px}.panel{display:none}.panel.on{display:block}.panel small{display:block;color:#aaa3b8;font-size:9px;margin-top:3px}.ov{position:fixed;inset:0;background:#030207ee;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#0d0b14;border:4px solid #eee9d8;padding:16px}.hidden{display:none}.hit{animation:hit .28s steps(3,end)}.shake{animation:shake .28s steps(3,end)}@keyframes hit{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 8px),-50%);filter:brightness(.4)}75%{transform:translate(calc(-50% - 3px),-50%);filter:brightness(1.8)}}@keyframes shake{0%,100%{transform:none}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.4)}75%{transform:translate(-3px,1px);filter:brightness(1.8)}}</style></head><body><main id="app"></main><div id="overlay" class="ov hidden"><div id="modal" class="modal"></div></div><script>"use strict";(()=>{const app=document.getElementById('app'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');const $=id=>document.getElementById(id);const N=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];const MS=[['影炎流',2,5,0,'闇の炎'],['白燐',3,6,1,'光属性。闇に1.5倍'],['月鉛の棘',4,7,0,'重い棘'],['虚無の眼',5,8,0,'虚無の視線'],['黒雨',6,9,0,'黒い雨'],['黎明針',7,10,1,'光属性。闇に1.5倍'],['冥灯',8,11,0,'冥い灯火'],['白骸光',9,12,1,'光属性。闇に1.5倍'],['夜葬',10,13,0,'夜を凝縮'],['灰界',12,15,1,'光属性。闇に1.5倍']];const SK=[['裂骨打','double',1,5,'攻撃力で2連攻撃'],['影縫い','guard',1.5,6,'次の敵攻撃を無効化し1.5倍攻撃'],['喉断ち','power',1.7,7,'攻撃力×1.7'],['連環裂','doublePower',1.25,8,'攻撃力×1.25を2連撃'],['空葬','guard',1.5,9,'次の敵攻撃を無効化し1.5倍攻撃'],['反転構え','power',2,10,'攻撃力×2'],['硬化突き','power',1.8,11,'攻撃力×1.8'],['瞬歩殺','double',1,12,'攻撃力で2連攻撃'],['崩し刃','power',2.2,13,'攻撃力×2.2'],['星砕き','guard',1.5,14,'次の敵攻撃を無効化し1.5倍攻撃']];let S;function fresh(){S={name:'',stage:1,enemy:null,ehp:0,turn:false,guard:false,mp:0,maxmp:20,potions:3,magic:[],skill:null,st:{hp:30,max:30,speed:5,defence:2,critical:5,attack:0,magicattack:0}}}function intro(){app.innerHTML='<section class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="menu"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div></section>';$("start").onclick=balance;$("records").onclick=records}function balance(){app.innerHTML='<section class="title"><h2>ABILITY SET</h2><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力の初期値を決めよう。</p><div class="box"><div class="bar"><label>ATTACK <b id="av"></b></label><div class="track"><div id="af" class="fill"></div></div></div><div class="bar"><label>MAGIC ATTACK <b id="mv"></b></label><div class="track"><div id="mf" class="fill"></div></div></div></div><div class="menu"><button id="shuffle">▶ バランスを シャッフル</button><button id="confirm">▶ 確定して バトルスタート</button></div></section>';shuffle();$("shuffle").onclick=shuffle;$("confirm").onclick=()=>{const n=$("name").value.trim();if(!n){alert('プレイヤー名を入力してください。');return}S.name=n;battle()}}function shuffle(){const a=1+Math.floor(Math.random()*11);S.st.attack=a;S.st.magicattack=12-a;$("av").textContent=a;$("mv").textContent=12-a;$("af").style.width=a/12*100+'%';$("mf").style.width=(12-a)/12*100+'%'}function enemyData(){const n=S.stage,b=n%5===0,base=MS[(n-1)%10],sk=SK[(n-1)%10];return{name:N[n-1],boss:b,shadow:b||n%3===0,hp:12+n*2+(b?n*5:0),atk:3+Math.floor(n*.7)+(b?4:0),def:1+Math.floor(n/5)+(b?2:0),spell:{name:base[0],power:base[1]+Math.floor((n-1)/3),cost:base[2],light:!!base[3],desc:base[4]},skill:{name:sk[0],type:sk[1],mult:sk[2],cost:sk[3],desc:sk[4]},type:n-1}}function battle(){S.enemy=enemyData();S.ehp=S.enemy.hp;S.turn=true;app.innerHTML='<h3>'+S.name+'　戦 '+S.stage+' / 20</h3><section class="scene" id="scene"><div class="enemyname" id="enemyName"></div><div class="ehp" id="enemyHp"></div><div class="sprite" id="sprite"><canvas id="canvas" width="32" height="32"></canvas></div><div class="stats" id="stats"></div></section><div class="box" id="message"></div><div class="grid"><button id="attack">▶ こうげき</button><button id="magic">▶ まほう</button><button id="skill">▶ スキル</button><button id="item">▶ アイテム</button></div><div id="panel" class="panel"></div>';$("attack").onclick=attack;$("magic").onclick=magicMenu;$("skill").onclick=skillMenu;$("item").onclick=item;S.message=(S.enemy.boss?'★ 強敵 ★ ':'')+S.enemy.name+' が あらわれた！';render()}function render(){if(!S.enemy)return;$("enemyName").textContent=S.enemy.name;$("enemyHp").textContent='HP '+S.ehp+' / '+S.enemy.hp;$("message").textContent=S.message;$("stats").innerHTML=[['HP',S.st.hp+'/'+S.st.max],['SPEED',S.st.speed],['DEFENCE',S.st.defence],['CRITICAL',S.st.critical+'%'],['MAGIC ATK',S.st.magicattack],['ATTACK',S.st.attack],['MP',S.mp+'/'+S.maxmp]].map(v=>'<div class="stat"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join('');document.querySelectorAll('.grid button').forEach(b=>b.disabled=!S.turn||S.ehp<=0);draw()}function draw(){const c=$("canvas").getContext('2d');c.clearRect(0,0,32,32);const t=S.enemy.type,B='#050509',W='#eee9d8',D='#4b4650',P='#7540a4',R='#b54a4a',Y='#d1a34b',C='#c8c2d0';const q=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};q(7,7,18,17,B);q(10,9,12,14,D);q(12,11,3,3,t%4===0?R:W);q(18,11,3,3,t%4===0?R:W);if(t%5===0)q(13,3,6,5,Y);if(t%4===1)q(4,12,5,8,P);if(t%4===2)q(23,12,5,8,P);if(t%3===0)q(12,18,8,3,R);if(t%3===1){q(5,8,5,3,C);q(22,8,5,3,C)}if(t%3===2){q(10,23,4,5,B);q(18,23,4,5,B)}}function fx(enemy){const e=$(enemy?'sprite':'scene');e.classList.remove(enemy?'hit':'shake');void e.offsetWidth;e.classList.add(enemy?'hit':'shake');setTimeout(()=>e.classList.remove(enemy?'hit':'shake'),280)}function damage(d){S.ehp=Math.max(0,S.ehp-d);fx(true)}function finishTurn(){render();if(S.ehp<=0){S.turn=false;setTimeout(reward,280);return}S.turn=false;setTimeout(enemyTurn,420)}function attack(){if(!S.turn)return;let d=Math.max(1,S.st.attack+Math.floor(Math.random()*3)-S.enemy.def);if(Math.random()*100<S.st.critical)d*=2;damage(d);S.message='こうげき！ '+d+' ダメージ！';finishTurn()}function magicMenu(){if(!S.magic.length){S.message='魔法を覚えていない。';render();return}panel('魔法を選択',S.magic.map(m=>({name:m.name,desc:'MP '+m.cost+' / 威力 '+m.power+(m.light?' / 光':'')+'｜'+m.desc,fn:()=>panel('もう一度選択すると発動',[{name:m.name,desc:'MP '+m.cost+' 消費',fn:()=>cast(m)}])})))}function cast(m){if(S.mp<m.cost){S.message='MPが足りない。';closePanel();render();return}S.mp-=m.cost;let d=S.st.magicattack*m.power;if(m.light&&S.enemy.shadow)d=Math.floor(d*1.5);damage(d);S.message=m.name+'！ '+d+' ダメージ！';closePanel();finishTurn()}function skillMenu(){if(!S.skill){S.message='スキルを覚えていない。';render();return}const k=S.skill;panel('スキルを選択',[{name:k.name,desc:'MP '+k.cost+'｜'+k.desc,fn:()=>panel('もう一度選択すると発動',[{name:k.name,desc:'MP '+k.cost+' 消費',fn:()=>useSkill(k)}])}])}function useSkill(k){if(S.mp<k.cost){S.message='MPが足りない。';closePanel();render();return}S.mp-=k.cost;let d=0;if(k.type==='double'){const a=Math.max(1,S.st.attack-S.enemy.def);damage(a);if(S.ehp>0)damage(a);d=a*2}else if(k.type==='doublePower'){const a=Math.max(1,Math.floor(S.st.attack*k.mult)-S.enemy.def);damage(a);if(S.ehp>0)damage(a);d=a*2}else{d=Math.max(1,Math.floor(S.st.attack*k.mult)-S.enemy.def);damage(d);if(k.type==='guard')S.guard=true}S.message=k.name+'！ '+d+' ダメージ！';closePanel();finishTurn()}function item(){panel('アイテム',[{name:'回復薬',desc:'HPを10回復 / 残り '+S.potions,fn:()=>{if(!S.potions){S.message='回復薬がない。';closePanel();render();return}S.potions--;S.st.hp=Math.min(S.st.max,S.st.hp+10);S.message='回復薬を使った！';closePanel();finishTurn()}},{name:'魔力水',desc:'MPを10回復',fn:()=>{S.mp=Math.min(S.maxmp,S.mp+10);S.message='魔力水を飲んだ！';closePanel();finishTurn()}}])}function panel(title,items){const p=$("panel");p.className='panel on';p.innerHTML='<div class="box"><b>'+title+'</b><div class="grid">'+items.map((x,i)=>'<button data-i="'+i+'">'+x.name+'<small>'+x.desc+'</small></button>').join('')+'</div></div>';p.querySelectorAll('button').forEach(b=>b.onclick=()=>items[+b.dataset.i].fn())}function closePanel(){$("panel").className='panel';$("panel").innerHTML=''}function enemyTurn(){let d=Math.max(1,S.enemy.atk+Math.floor(Math.random()*3)-S.st.defence);if(S.guard){d=0;S.guard=false}S.st.hp=Math.max(0,S.st.hp-d);fx(false);S.message=d?S.enemy.name+'の攻撃！ '+d+' ダメージ！':S.enemy.name+'の攻撃をかわした！';if(S.st.hp<=0){finish(false);return}S.turn=true;render()}function reward(){const n=S.stage;S.st.hp=S.st.max;S.st.speed+=n;S.st.defence+=n;S.st.critical+=n;S.st.attack+=n;S.st.magicattack+=n;S.mp=Math.min(S.maxmp,S.mp+5);const sp=S.enemy.spell,sk=S.enemy.skill;openReward(sp,sk)}function openReward(sp,sk){overlay.classList.remove('hidden');modal.innerHTML='<h2>'+S.enemy.name+'を たおした！</h2><p>HP全回復。全ステータス +'+S.stage+'</p><p>獲得：魔法「'+sp.name+'」 / スキル「'+sk.name+'」</p><button id="getMagic">魔法を残す</button><button id="getSkill">スキルを残す</button>';$("getMagic").onclick=()=>chooseMagic(sp,sk);$("getSkill").onclick=()=>chooseSkill(sp,sk)}function chooseMagic(sp,sk){if(S.magic.length<4){S.magic.push(sp);nextStage('魔法「'+sp.name+'」を習得！')}else{modal.innerHTML='<h3>魔法がいっぱい</h3><p>残す魔法を選んでください。</p>'+S.magic.map((m,i)=>'<button data-i="'+i+'">'+m.name+'を残す</button>').join('')+'<button id="newMagic">新しい「'+sp.name+'」を残す</button>';modal.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.magic[+b.dataset.i]=sp;nextStage('魔法を入れ替えた！')});$("newMagic").onclick=()=>nextStage('魔法を入れ替えずに新しい魔法を選んだ！')}}function chooseSkill(sp,sk){if(!S.skill){S.skill=sk;nextStage('スキル「'+sk.name+'」を習得！')}else{modal.innerHTML='<h3>スキルがいっぱい</h3><p>どちらを残しますか？</p><button id="oldSkill">現在の「'+S.skill.name+'」を残す</button><button id="newSkill">新しい「'+sk.name+'」を残す</button>';$("oldSkill").onclick=()=>nextStage('現在のスキルを残した！');$("newSkill").onclick=()=>{S.skill=sk;nextStage('新しいスキルに入れ替えた！')}}}function nextStage(msg){overlay.classList.add('hidden');S.message=msg;S.stage++;if(S.stage>20){finish(true);return}battle()}function finish(clear){S.turn=false;overlay.classList.remove('hidden');const key='voidMonsterRecords';let old=[];try{old=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}const snapshot={name:S.name,result:clear?'CLEAR':'失格',stage:clear?20:S.stage,magic:S.magic.map(m=>m.name),skill:S.skill?S.skill.name:'なし',stats:{...S.st}};modal.innerHTML='<h1>'+(clear?'QUEST COMPLETE!':'GAME OVER')+'</h1><p>'+(clear?'20戦突破！':'戦闘不能。到達戦：'+S.stage)+'</p><p>この挑戦を記録に残しますか？</p><button id="save">記録する</button><button id="discard">記録しない</button>';$("save").onclick=()=>{old.push(snapshot);localStorage.setItem(key,JSON.stringify(old));intro()};$("discard").onclick=()=>intro()}function records(){let r=[];try{r=JSON.parse(localStorage.getItem('voidMonsterRecords')||'[]')}catch(e){}if(!r.length){app.innerHTML='<section class="title"><h2>これまでの記録</h2><p>まだ記録はありません。</p><button id="back">▶ 戻る</button></section>';$("back").onclick=intro;return}app.innerHTML='<section><h2>これまでの記録</h2>'+r.slice().reverse().map((x,i)=>'<div class="box"><b>'+(i+1)+'｜'+x.name+'｜'+x.result+'</b><p>到達：'+x.stage+'戦</p><p>魔法：'+(x.magic.length?x.magic.join(' / '):'なし')+'</p><p>スキル：'+x.skill+'</p><p>HP '+x.stats.hp+'/'+x.stats.max+' / SPD '+x.stats.speed+' / DEF '+x.stats.defence+' / CRT '+x.stats.critical+'% / ATK '+x.stats.attack+' / MATK '+x.stats.magicattack+'</p></div>').join('')+'<button id="back">▶ 戻る</button></section>';$("back").onclick=intro}function boot(){fresh();intro()}boot()})();</script></body></html>
