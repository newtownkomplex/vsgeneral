<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#159b91"><title>一筆パズル 50</title><style>:root{--bg:#159b91;--w:#fff;--muted:rgba(255,255,255,.72);--cell:rgba(255,255,255,.18)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:#fff}button{font:inherit;cursor:pointer}.app{height:100dvh;max-width:560px;margin:auto;padding:18px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;min-height:52px}.title{font-size:21px;font-weight:800}.stage-label{font-size:13px;color:var(--muted);margin-top:3px}.header-btn{border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.12);color:#fff;border-radius:13px;padding:9px 12px;font-weight:700}.screen{display:none;flex:1;min-height:0}.screen.active{display:flex;flex-direction:column}#menu{justify-content:center;gap:20px}.menu-title{text-align:center;font-size:34px;font-weight:900;letter-spacing:.08em}.menu-sub{text-align:center;color:var(--muted);margin-top:-12px}.progress{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#fff}.stage-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;overflow:auto;padding:2px}.stage{aspect-ratio:1;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-weight:800}.stage.locked{opacity:.3}.stage.cleared{background:#fff;color:var(--bg)}.game-top{display:flex;justify-content:space-between;margin:10px 0 8px}.counter{color:var(--muted);font-size:14px}.board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{position:relative;width:min(88vw,470px);height:min(88vw,470px);max-width:58vh;max-height:58vh;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);touch-action:none;user-select:none;-webkit-user-select:none}.cell{margin:4px;border-radius:11px;background:var(--cell);border:1px solid rgba(255,255,255,.22);transition:.08s}.cell.visited{background:#fff;box-shadow:0 0 0 2px #fff,0 0 18px rgba(255,255,255,.75)}.cell.start{box-shadow:inset 0 0 0 3px #fff}.line-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.actions{display:flex;gap:10px;margin-top:8px}.actions button{flex:1;border:1px solid rgba(255,255,255,.65);border-radius:13px;padding:10px 14px;font-weight:700;background:rgba(255,255,255,.12);color:#fff}.actions .primary{background:#fff;color:var(--bg)}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:7px}.overlay{position:fixed;inset:0;background:rgba(6,73,70,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.overlay.show{display:flex}.modal{width:min(420px,100%);background:var(--bg);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:26px;text-align:center}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);margin:0 0 18px}@media(max-height:680px){.app{padding-top:9px}.board{max-width:50vh;max-height:50vh}.hint{display:none}}</style></head><body><div class="app"><header><div><div class="title">一筆パズル</div><div class="stage-label" id="stageLabel">ステージ選択</div></div><button type="button" class="header-btn" id="menuBtn" style="display:none">ステージ</button></header><section id="menu" class="screen active"><div class="menu-title">ONE LINE</div><div class="menu-sub">すべてのマスを、1回ずつつなげよう。</div><div class="progress"><i id="progressBar"></i></div><div id="stageGrid" class="stage-grid"></div></section><section id="game" class="screen"><div class="game-top"><b id="gameStage">STAGE 01</b><div class="counter" id="counter">0 / 25</div></div><div class="board-wrap"><div id="board" class="board"></div></div><div class="hint">指を置いて、そのまま隣のマスへなぞってください。</div><div class="actions"><button type="button" id="retryBtn">リトライ</button><button type="button" class="primary" id="nextBtn">次ステージ</button></div></section></div><div id="overlay" class="overlay"><div class="modal"><h2 id="resultTitle">クリア！</h2><p id="resultText">ステージをクリアしました。</p><div class="actions"><button type="button" id="modalRetry">リトライ</button><button type="button" class="primary" id="modalNext">次ステージ</button></div></div></div><script>
'use strict';
const SIZE=5,TOTAL=50,KEY='oneLinePuzzleCleared_v5';
const $=id=>document.getElementById(id);
let cleared=load(),stage=1,path=[],drawing=false,lastTouch=null;
const base=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)base.push(r*SIZE+(r%2?4-c:c));
const boards=Array.from({length:TOTAL},(_,n)=>{let p=base.slice();if(n%2)p.reverse();let k=(n*3)%25;return p.slice(k).concat(p.slice(0,k))});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.filter(n=>Number.isInteger(n)&&n>=1&&n<=TOTAL):[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify([...new Set(cleared)]))}
function unlocked(n){return n===1||cleared.includes(n-1)}
function show(s){$('menu').classList.toggle('active',s==='menu');$('game').classList.toggle('active',s==='game');$('stageLabel').textContent=s==='game'?`ステージ ${stage}`:'ステージ選択';$('menuBtn').style.display=s==='game'?'block':'none'}
function renderMenu(){const g=$('stageGrid');g.innerHTML='';for(let n=1;n<=TOTAL;n++){const b=document.createElement('button');b.type='button';b.className='stage';const ok=cleared.includes(n),u=unlocked(n);if(ok)b.classList.add('cleared');if(!u)b.classList.add('locked');b.textContent=ok?'✓':n;b.disabled=!u;b.addEventListener('click',()=>start(n));g.appendChild(b)}$('progressBar').style.width=(cleared.length/TOTAL*100)+'%'}
function start(n){if(!unlocked(n))return;stage=n;path=[];drawing=false;lastTouch=null;hide();show('game');build();counter()}
function build(){const b=$('board');b.innerHTML='';for(let i=0;i<25;i++){const d=document.createElement('div');d.className='cell';d.dataset.i=i;b.appendChild(d)}const s=boards[stage-1][0],startCell=b.querySelector(`[data-i="${s}"]`);if(startCell)startCell.classList.add('start');const svg=document.createElementNS('http://www.w3.org/2000/svg','http://www.w3.org/2000/svg');svg.classList.add('line-layer');svg.setAttribute('viewBox','0 0 100 100');svg.innerHTML='<polyline id="pathLine" class="path" points=""/>';b.appendChild(svg);$('gameStage').textContent=`STAGE ${String(stage).padStart(2,'0')}`}
function counter(){$('counter').textContent=`${path.length} / 25`}
function pos(x,y){const r=$('board').getBoundingClientRect(),c=Math.floor((x-r.left)/r.width*5),row=Math.floor((y-r.top)/r.height*5);return c<0||c>=5||row<0||row>=5?null:row*5+c}
function adjacent(a,b){return Math.abs(Math.floor(a/5)-Math.floor(b/5))+Math.abs(a%5-b%5)===1}
function draw(){const pts=path.map(i=>`${(i%5+.5)*20},${(Math.floor(i/5)+.5)*20}`).join(' ');$('pathLine').setAttribute('points',pts);document.querySelectorAll('.cell').forEach(c=>c.classList.remove('visited'));path.forEach(i=>document.querySelector(`[data-i="${i}"]`)?.classList.add('visited'))}
function enter(i){if(i===null)return;if(path.length===0){if(i!==boards[stage-1][0]){fail();return}path=[i];draw();counter();return}const last=path[path.length-1];if(i===last)return;if(path.includes(i)||!adjacent(last,i)){fail();return}path.push(i);draw();counter();if(path.length===25)complete()}
function fail(){drawing=false;setTimeout(()=>{alert('失敗！\n同じマスを通るか、離れたマスへ飛ぶことはできません。');reset()},10)}
function reset(){hide();path=[];drawing=false;lastTouch=null;draw();counter()}
function complete(){drawing=false;if(!cleared.includes(stage)){cleared.push(stage);save()}renderMenu();$('resultTitle').textContent=stage===TOTAL?'全50ステージクリア！':'クリア！';$('resultText').textContent=stage===TOTAL?'すべてのステージを制覇しました。':'次のステージへ進めます。';$('modalNext').textContent=stage===TOTAL?'ステージ選択':'次ステージ';$('overlay').classList.add('show')}
function hide(){$('overlay').classList.remove('show')}
function touchStart(e){e.preventDefault();const t=e.touches[0];lastTouch={x:t.clientX,y:t.clientY};drawing=true;enter(pos(t.clientX,t.clientY))}
function touchMove(e){e.preventDefault();if(!drawing)return;const t=e.touches[0],r=$('board').getBoundingClientRect(),dx=t.clientX-lastTouch.x,dy=t.clientY-lastTouch.y,dist=Math.max(Math.abs(dx),Math.abs(dy));if(dist>2){const steps=Math.max(1,Math.ceil(dist/(r.width/15)));for(let k=1;k<=steps;k++){const n=pos(lastTouch.x+dx*k/steps,lastTouch.y+dy*k/steps);if(n!==null)enter(n)}lastTouch={x:t.clientX,y:t.clientY}}}
function touchEnd(e){e.preventDefault();drawing=false;lastTouch=null}
const board=$('board');board.addEventListener('touchstart',touchStart,{passive:false});board.addEventListener('touchmove',touchMove,{passive:false});board.addEventListener('touchend',touchEnd,{passive:false});board.addEventListener('touchcancel',touchEnd,{passive:false});
$('retryBtn').addEventListener('click',reset);$('nextBtn').addEventListener('click',()=>stage<TOTAL?start(stage+1):show('menu'));$('menuBtn').addEventListener('click',()=>{renderMenu();show('menu')});$('modalRetry').addEventListener('click',reset);$('modalNext').addEventListener('click',()=>stage<TOTAL?start(stage+1):show('menu'));
renderMenu();show('menu');
</script></body></html>
