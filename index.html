<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#08070d;color:#eee9d8;font-family:monospace}#game{width:min(720px,100%);min-height:100vh;margin:auto;background:#0d0b14;border:4px solid #eee9d8;padding:10px}button{width:100%;min-height:48px;background:#0a0910;color:#eee9d8;border:3px solid #eee9d8;padding:10px;font:700 13px monospace;box-shadow:4px 4px #302039}.title{text-align:center;padding:55px 12px}.menu,.commands,.choices{display:grid;gap:7px;margin-top:15px}.commands,.choices{grid-template-columns:1fr 1fr}.balance,.box{border:3px solid #eee9d8;background:#09080e;padding:12px;margin:12px 0}.bar{margin:14px 0}.bar label{display:flex;justify-content:space-between}.track{height:18px;background:#211a29;border:2px solid #eee9d8}.fill{height:100%;background:#8555c5}.scene{height:350px;position:relative;overflow:hidden;border:3px solid #eee9d8;background:#171020}.name,.ehp{position:absolute;top:8px;background:#09080e;border:3px solid #eee9d8;padding:5px 8px;z-index:5}.name{left:8px}.ehp{right:8px}.sprite{position:absolute;width:270px;height:270px;left:42%;top:55%;transform:translate(-50%,-50%)}canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:7px;bottom:7px;width:142px;z-index:7}.stat{display:flex;justify-content:space-between;background:#09080eee;border:2px solid #9f96ad;padding:5px;font-size:10px;margin:2px}.panel{display:none}.panel.open{display:block}.panel small{display:block;color:#aaa3b8;font-size:9px;margin-top:4px}.overlay{position:fixed;inset:0;background:#030207ee;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{width:min(540px,100%);background:#0d0b14;border:4px solid #eee9d8;padding:18px}.hidden{display:none!important}.enemy-hit{animation:eh .28s steps(3,end)}.scene-hit{animation:sh .28s steps(3,end)}@keyframes eh{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 8px),-50%);filter:brightness(.35)}75%{transform:translate(calc(-50% - 4px),-50%);filter:brightness(1.8)}}@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.45)}75%{transform:translate(-3px,1px);filter:brightness(1.8)}}</style></head><body><main id="game"></main><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>"use strict";(()=>{const G=document.getElementById('game'),O=document.getElementById('overlay'),M=document.getElementById('modal'),el=id=>document.getElementById(id);const names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];const spells=[{name:'影炎流',power:2,light:false,desc:'影を炎へ変える闇属性魔法。'},{name:'白燐',power:3,light:true,desc:'光属性。闇属性に1.5倍。'},{name:'月鉛の棘',power:4,light:false,desc:'重い月光の棘。'},{name:'虚無の眼',power:5,light:false,desc:'虚無の視線で穿つ。'},{name:'黒雨',power:6,light:false,desc:'黒い雨。'},{name:'黎明針',power:7,light:true,desc:'光属性。闇属性に1.5倍。'},{name:'冥灯',power:8,light:false,desc:'冥い灯火。'},{name:'白骸光',power:9,light:true,desc:'光属性。闇属性に1.5倍。'},{name:'夜葬',power:10,light:false,desc:'夜を凝縮する。'},{name:'灰界',power:12,light:true,desc:'光属性の最上位魔法。'}];const skillDefs=[{name:'裂骨打',type:'double',cost:5,desc:'攻撃力依存の2連攻撃。'},{name:'影縫い',type:'guard',cost:6,desc:'次の敵攻撃を無効化し1.5倍。'},{name:'喉断ち',type:'power',mult:1.7,cost:7,desc:'攻撃力×1.7。'},{name:'連環裂',type:'doublePower',mult:1.25,cost:8,desc:'攻撃力×1.25を2連撃。'},{name:'空葬',type:'guard',cost:9,desc:'次の敵攻撃を無効化し1.5倍。'},{name:'反転構え',type:'power',mult:2,cost:10,desc:'攻撃力×2。'},{name:'硬化突き',type:'power',mult:1.8,cost:11,desc:'攻撃力×1.8。'},{name:'瞬歩殺',type:'double',cost:12,desc:'攻撃力依存の2連攻撃。'},{name:'崩し刃',type:'power',mult:2.2,cost:13,desc:'攻撃力×2.2。'},{name:'星砕き',type:'guard',cost:14,desc:'次の敵攻撃を無効化し1.5倍。'}];const S={battle:1,enemy:null,enemyHP:0,turn:false,stats:{hp:30,max:30,speed:5,defence:2,critical:5,attack:0,magicattack:0},magic:[],skill:null,potions:3,guard:false,player:'',mp:20,maxmp:20};function start(){G.innerHTML='<section class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="menu"><button id="begin">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div></section>';el('begin').onclick=balance;el('records').onclick=records}function balance(){G.innerHTML='<section class="title"><h1>ABILITY SET</h1><input id="pn" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランスを決めよう。</p><div class="balance"><div class="bar"><label>ATTACK <b id="av"></b></label><div class="track"><div id="af" class="fill"></div></div></div><div class="bar"><label>MAGIC ATTACK <b id="mv"></b></label><div class="track"><div id="mf" class="fill"></div></div></div></div><div class="menu"><button id="sh">▶ バランスを シャッフル</button><button id="go">▶ このバランスで バトルスタート</button></div></section>';el('sh').onclick=shuffle;el('go').onclick=()=>{let n=el('pn').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}S.player=n;battle()};shuffle()}function shuffle(){let a=1+Math.floor(Math.random()*11);S.stats.attack=a;S.stats.magicattack=12-a;el('av').textContent=a;el('mv').textContent=12-a;el('af').style.width=a/12*100+'%';el('mf').style.width=(12-a)/12*100+'%'}function make(){let n=S.battle,b=n%5===0,sp=spells[(n-1)%10];return{name:names[n-1],boss:b,shadow:n%2===0,maxHP:10+n*2+(b?n*5:0),atk:2+Math.floor(n*.65)+(b?3:0),def:1+Math.floor(n/6)+(b?2:0),magic:{...sp,power:sp.power+Math.floor((n-1)/3)},skill:skillDefs[(n-1)%10],reward:{hp:1,speed:1,defence:1,critical:1,attack:1,magicattack:1}}}function battle(){S.enemy=make();S.enemyHP=S.enemy.maxHP;S.turn=true;G.innerHTML='<h3>VOID MONSTER QUEST　戦 '+S.battle+' / 20</h3><section class="scene" id="scene"><div class="name" id="en"></div><div class="ehp" id="hp"></div><div class="sprite" id="spr"><canvas id="cv" width="32" height="32"></canvas></div><div class="stats" id="stats"></div></section><div class="box" id="msg"></div><div class="commands"><button id="a">▶ こうげき</button><button id="m">▶ まほう</button><button id="s">▶ スキル</button><button id="i">▶ アイテム</button></div><div id="panel" class="panel"></div>';el('a').onclick=attack;el('m').onclick=magicMenu;el('s').onclick=skillMenu;el('i').onclick=item;S.msg=(S.enemy.boss?'★ 強敵 ★ ':'')+S.enemy.name+' が あらわれた！';render()}function render(){el('en').textContent=S.enemy.name;el('hp').textContent='HP '+S.enemyHP+' / '+S.enemy.maxHP;el('msg').textContent=S.msg;el('stats').innerHTML=[['HP',S.stats.hp+'/'+S.stats.max],['SPEED',S.stats.speed],['DEFENCE',S.stats.defence],['CRITICAL',S.stats.critical+'%'],['MAGIC ATK',S.stats.magicattack],['ATTACK',S.stats.attack],['MP',S.mp+'/'+S.maxmp]].map(v=>'<div class="stat"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join('');document.querySelectorAll('.commands button').forEach(b=>b.disabled=!S.turn||S.enemyHP<=0);draw()}function draw(){let q=el('cv').getContext('2d');q.clearRect(0,0,32,32);let t=S.battle,D=['#eee9d8','#b46a28','#b54a4a','#7540a4','#d1a34b','#88838d','#4d526b','#6b4b72','#7a7158','#c8c2d0'];q.fillStyle='#050509';q.fillRect(8,6,16,20);q.fillStyle=D[(t-1)%10];q.fillRect(11,9,10,12);q.fillStyle='#eee9d8';q.fillRect(11,11,3,3);q.fillRect(18,11,3,3);if(t%5===0){q.fillStyle='#b54a4a';q.fillRect(13,16,6,2)}}function effect(enemy){let x=el(enemy?'spr':'scene');x.classList.remove(enemy?'enemy-hit':'scene-hit');void x.offsetWidth;x.classList.add(enemy?'enemy-hit':'scene-hit');setTimeout(()=>x.classList.remove(enemy?'enemy-hit':'scene-hit'),280)}function hit(d){S.enemyHP=Math.max(0,S.enemyHP-d);effect(true)}function endTurn(){render();if(S.enemyHP<=0){S.turn=false;setTimeout(reward,300);return}S.turn=false;setTimeout(enemyTurn,450)}function attack(){if(!S.turn)return;let d=Math.max(1,S.stats.attack-S.enemy.def);if(Math.random()*100<S.stats.critical)d*=2;hit(d);S.msg='こうげき！ '+d+' ダメージ！';endTurn()}function magicMenu(){if(!S.magic.length){S.msg='魔法を覚えていない。';render();return}panel('まほう',S.magic.map(m=>({name:m.name,desc:'MP '+m.cost+' / 威力 '+m.power+(m.light?' / 光属性':''),fn:()=>confirmUse('もう一度選択すると発動',()=>cast(m))})))}function cast(m){if(S.mp<m.cost){S.msg='MPが足りない。';closePanel();render();return}S.mp-=m.cost;let d=S.stats.magicattack*m.power;if(m.light&&S.enemy.shadow)d=Math.floor(d*1.5);hit(d);S.msg=m.name+'！ '+d+' ダメージ！';closePanel();endTurn()}function skillMenu(){if(!S.skill){S.msg='スキルを覚えていない。';render();return}let k=S.skill;panel('スキル',[{name:k.name,desc:'MP '+k.cost+' / '+k.desc,fn:()=>confirmUse('もう一度選択すると発動',()=>useSkill(k))}])}function useSkill(k){if(S.mp<k.cost){S.msg='MPが足りない。';closePanel();render();return}S.mp-=k.cost;let a=Math.max(1,S.stats.attack-S.enemy.def),d=0;if(k.type==='double'){hit(a);if(S.enemyHP>0)hit(a);d=a*2}else if(k.type==='guard'){d=Math.max(1,Math.floor(S.stats.attack*1.5)-S.enemy.def);hit(d);S.guard=true}else{d=Math.max(1,Math.floor(S.stats.attack*k.mult)-S.enemy.def);hit(d)}S.msg=k.name+'！ '+d+' ダメージ！';closePanel();endTurn()}function item(){panel('アイテム',[{name:'回復薬',desc:'HPを10回復 / 残り '+S.potions,fn:()=>{if(!S.potions){S.msg='回復薬がない。';closePanel();render();return}S.potions--;S.stats.hp=Math.min(S.stats.max,S.stats.hp+10);S.msg='回復薬を使った！';closePanel();endTurn()}},{name:'魔力水',desc:'MPを10回復',fn:()=>{S.mp=Math.min(S.maxmp,S.mp+10);S.msg='魔力水を飲んだ！';closePanel();endTurn()}}])}function confirmUse(t,fn){let p=el('panel');p.innerHTML='<div class="box"><b>'+t+'</b><button id="yes">▶ 発動</button><button id="no">▶ 戻る</button></div>';el('yes').onclick=fn;el('no').onclick=closePanel}function panel(t,a){let p=el('panel');p.className='panel open';p.innerHTML='<div class="box"><b>'+t+'</b><div class="choices">'+a.map((x,i)=>'<button data-i="'+i+'">'+x.name+'<small>'+x.desc+'</small></button>').join('')+'</div></div>';p.querySelectorAll('button').forEach(b=>b.onclick=()=>a[+b.dataset.i].fn())}function closePanel(){let p=el('panel');p.className='panel';p.innerHTML=''}function enemyTurn(){let d=Math.max(1,S.enemy.atk-S.stats.defence);if(S.guard){d=0;S.guard=false}S.stats.hp=Math.max(0,S.stats.hp-d);effect(false);S.msg=d?S.enemy.name+'の攻撃！ '+d+' ダメージ！':S.enemy.name+'の攻撃を無効化した！';if(S.stats.hp<=0){S.turn=false;return setTimeout(()=>finish(false),300)}S.turn=true;render()}function reward(){S.stats.hp=S.stats.max;Object.keys(S.enemy.reward).forEach(k=>S.stats[k]+=S.battle);S.mp=S.maxmp;let m={...S.enemy.magic,cost:2+Math.floor(S.battle/4)};let k=S.enemy.skill;if(S.magic.length<4)S.magic.push(m);else S.magic[S.battle%4]=m;if(!S.skill)S.skill=k;else if(confirm('新しいスキル「'+k.name+'」に入れ替えますか？'))S.skill=k;if(S.battle>=20)return finish(true);S.battle++;battle()}function finish(clear){let rec={name:S.player,clear,stage:clear?20:S.battle,magic:S.magic.map(x=>x.name),skill:S.skill?S.skill.name:'なし',stats:{...S.stats}};let old=JSON.parse(localStorage.getItem('vmqRecords')||'[]');if(confirm((clear?'20戦クリア！':'失格…')+' 記録に残しますか？')){old.push(rec);localStorage.setItem('vmqRecords',JSON.stringify(old))}start()}function records(){let r=JSON.parse(localStorage.getItem('vmqRecords')||'[]');G.innerHTML='<section class="title"><h2>これまでの記録</h2>'+(r.length?r.map(x=>'<div class="box"><b>'+x.name+'</b>　'+(x.clear?'CLEAR':'失格')+'<br>到達：'+x.stage+'戦<br>魔法：'+x.magic.join(' / ')+'<br>スキル：'+x.skill+'<br>HP '+x.stats.hp+' / SPEED '+x.stats.speed+' / DEFENCE '+x.stats.defence+' / CRITICAL '+x.stats.critical+' / ATTACK '+x.stats.attack+' / MAGIC ATK '+x.stats.magicattack+'</div>').join(''):'<p>まだ記録はありません。</p>')+'<button onclick="location.reload()">▶ 戻る</button></section>'}start()})()</script></body></html>
