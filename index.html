<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08070d;color:#eee9d8;font-family:monospace}body{min-height:100vh}#app{width:min(720px,100%);min-height:100vh;margin:auto;background:#0d0b14;border:4px solid #eee9d8;padding:12px}h1,h2,h3{letter-spacing:2px}.title{text-align:center;padding:45px 12px}.box,.scene{border:3px solid #eee9d8;background:#09080e;padding:12px;margin:10px 0}.scene{height:350px;position:relative;overflow:hidden;background:#171020}.buttons,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,input{width:100%;min-height:48px;padding:10px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8;font:700 14px monospace}input{margin:10px 0}.bar{margin:12px 0}.barhead{display:flex;justify-content:space-between}.track{height:18px;border:2px solid #eee9d8;background:#211a29}.fill{height:100%;background:#8555c5}.enemy{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:220px;height:220px}.enemy canvas{width:100%;height:100%;image-rendering:pixelated}.ename,.ehp{position:absolute;top:8px;padding:5px 8px;border:3px solid #eee9d8;background:#09080e;z-index:3}.ename{left:8px}.ehp{right:8px}.stats{position:absolute;right:8px;bottom:8px;width:150px;z-index:4}.stat{display:flex;justify-content:space-between;border:2px solid #9f96ad;background:#09080eee;padding:5px;font-size:11px;margin:2px}.panel{margin-top:8px}.small{font-size:11px;color:#aaa3b8;display:block;margin-top:4px}.hidden{display:none}.hitE{animation:hitE .28s steps(3,end)}.hitS{animation:hitS .28s steps(3,end)}@keyframes hitE{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 8px),-50%);filter:brightness(.4)}75%{transform:translate(calc(-50% - 4px),-50%)}}@keyframes hitS{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.4)}75%{transform:translate(-3px,1px)}}.record{font-size:11px;line-height:1.7}</style></head><body><main id="app"></main><script>(function(){'use strict';var A=document.getElementById('app');var names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var colors=['#eee9d8','#b46a28','#b54a4a','#7540a4','#d1a34b','#88838d','#4d526b','#6b4b72','#7a7158','#c8c2d0'];var magicBase=[['影炎流',2,0,'影を炎へ変える'],['白燐',3,1,'光属性。闇属性に1.5倍'],['月鉛の棘',4,0,'重い棘を撃つ'],['虚無の眼',5,0,'虚無の視線'],['黒雨',6,0,'黒い雨'],['黎明針',7,1,'光属性。闇属性に1.5倍'],['冥灯',8,0,'冥い灯火'],['白骸光',9,1,'光属性。闇属性に1.5倍'],['夜葬',10,0,'夜を凝縮'],['灰界',12,1,'光属性の最上位魔法']];var skillBase=[['裂骨打','2連攻撃',5],['影縫い','次の敵攻撃を無効化し1.5倍攻撃',6],['喉断ち','攻撃力×1.7',7],['連環裂','攻撃力×1.25を2連撃',8],['空葬','次の敵攻撃を無効化し1.5倍攻撃',9],['反転構え','攻撃力×2',10],['硬化突き','攻撃力×1.8',11],['瞬歩殺','2連攻撃',12],['崩し刃','攻撃力×2.2',13],['星砕き','次の敵攻撃を無効化し1.5倍攻撃',14]];var P={name:'',stage:1,attack:6,magicAttack:6,hp:30,maxhp:30,speed:5,defence:2,critical:5,mp:20,maxmp:20,magic:[],skill:null,potions:3,guard:false,enemy:null,enemyhp:0,turn:false,msg:''};function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]})}function title(){A.innerHTML='<section class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="buttons"><button id="start">▶ ぼうけんを はじめる</button><button id="rec">▶ これまでの記録</button></div></section>';document.getElementById('start').onclick=setup;document.getElementById('rec').onclick=records}function setup(){P.name='';A.innerHTML='<section class="title"><h2>ABILITY SET</h2><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランスをシャッフルして確定。</p><div class="box"><div class="bar"><div class="barhead"><b>ATTACK</b><b id="av"></b></div><div class="track"><div id="af" class="fill"></div></div></div><div class="bar"><div class="barhead"><b>MAGIC ATTACK</b><b id="mv"></b></div><div class="track"><div id="mf" class="fill"></div></div></div></div><div class="buttons"><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定して開始</button></div></section>';document.getElementById('shuffle').onclick=shuffle;document.getElementById('go').onclick=function(){var n=document.getElementById('name').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}P.name=n;P.stage=1;P.hp=P.maxhp=30;P.speed=5;P.defence=2;P.critical=5;P.magic=[];P.skill=null;P.mp=P.maxmp=20;P.potions=3;battle()};shuffle()}function shuffle(){P.attack=1+Math.floor(Math.random()*11);P.magicAttack=12-P.attack;document.getElementById('av').textContent=P.attack;document.getElementById('mv').textContent=P.magicAttack;document.getElementById('af').style.width=P.attack/12*100+'%';document.getElementById('mf').style.width=P.magicAttack/12*100+'%'}function enemy(){var n=P.stage,b=n%5===0;return{name:names[n-1],boss:b,shadow:n%2===0,maxhp:14+n*3+(b?n*5:0),atk:2+Math.floor(n*.7)+(b?4:0),def:Math.floor(n/5)+(b?3:0),color:colors[(n-1)%colors.length]}}function battle(){P.enemy=enemy();P.enemyhp=P.enemy.maxhp;P.turn=true;P.msg=(P.enemy.boss?'★ 強敵 ★ ':'')+P.enemy.name+' が あらわれた！';drawBattle()}function drawBattle(){A.innerHTML='<h3>VOID MONSTER QUEST　戦 '+P.stage+' / 20</h3><section class="scene" id="scene"><div class="ename">'+esc(P.enemy.name)+'</div><div class="ehp">HP '+P.enemyhp+' / '+P.enemy.maxhp+'</div><div class="enemy" id="enemy"><canvas id="cv" width="32" height="32"></canvas></div><div class="stats">'+stat('HP',P.hp+'/'+P.maxhp)+stat('SPEED',P.speed)+stat('DEFENCE',P.defence)+stat('CRITICAL',P.critical+'%')+stat('MAGIC ATK',P.magicAttack)+stat('ATTACK',P.attack)+stat('MP',P.mp+'/'+P.maxmp)+'</div></section><div class="box" id="msg">'+esc(P.msg)+'</div><div class="buttons"><button id="attack">▶ こうげき</button><button id="magic">▶ まほう</button><button id="skill">▶ スキル</button><button id="item">▶ アイテム</button></div><div id="panel" class="panel"></div>';drawSprite();document.getElementById('attack').onclick=attack;document.getElementById('magic').onclick=magicMenu;document.getElementById('skill').onclick=skillMenu;document.getElementById('item').onclick=item}function stat(a,b){return '<div class="stat"><span>'+a+'</span><b>'+b+'</b></div>'}function drawSprite(){var c=document.getElementById('cv'),q=c.getContext('2d'),col=P.enemy.color;q.clearRect(0,0,32,32);q.fillStyle='#050509';q.fillRect(7,5,18,22);q.fillStyle=col;q.fillRect(10,8,12,15);q.fillStyle='#eee9d8';q.fillRect(11,11,3,3);q.fillRect(18,11,3,3);if(P.enemy.boss){q.fillStyle='#b54a4a';q.fillRect(13,16,6,3)}else{q.fillStyle='#050509';q.fillRect(13,16,6,2)}for(var i=0;i<P.stage%4;i++){q.fillStyle=col;q.fillRect(5+i*6,24,3,3)}}function effect(enemy){var x=document.getElementById(enemy?'enemy':'scene');if(!x)return;x.classList.remove(enemy?'hitE':'hitS');void x.offsetWidth;x.classList.add(enemy?'hitE':'hitS');setTimeout(function(){x.classList.remove(enemy?'hitE':'hitS')},280)}function deal(d){P.enemyhp=Math.max(0,P.enemyhp-d);effect(true)}function afterAction(){if(P.enemyhp<=0){P.turn=false;setTimeout(clearStage,300);return}P.turn=false;setTimeout(enemyAttack,450)}function attack(){if(!P.turn)return;var d=Math.max(1,P.attack-P.enemy.def);if(Math.random()*100<P.critical)d*=2;deal(d);P.msg='こうげき！ '+d+' ダメージ！';drawBattle()}function magicMenu(){var p=document.getElementById('panel');if(!P.magic.length){P.msg='まだ魔法を覚えていない。';drawBattle();return}p.innerHTML='<div class="box"><b>魔法を選択</b><div class="grid">'+P.magic.map(function(m,i){return '<button data-i="'+i+'">'+esc(m.name)+'<span class="small">MP '+m.cost+' / 威力 '+m.power+(m.light?' / 光属性':'')+'<br>'+esc(m.desc)+'</span></button>'}).join('')+'</div></div>';p.querySelectorAll('button').forEach(function(b){b.onclick=function(){var m=P.magic[+b.dataset.i];confirmCast(m)}})}function confirmCast(m){var p=document.getElementById('panel');p.innerHTML='<div class="box"><b>'+esc(m.name)+'</b><span class="small">'+esc(m.desc)+' / MP '+m.cost+' / 威力 '+m.power+'</span><button id="fire">▶ もう一度選択して発動</button><button id="back">▶ 戻る</button></div>';document.getElementById('fire').onclick=function(){cast(m)};document.getElementById('back').onclick=function(){p.innerHTML=''}}function cast(m){if(P.mp<m.cost){P.msg='MPが足りない。';drawBattle();return}P.mp-=m.cost;var d=P.magicAttack*m.power;if(m.light&&P.enemy.shadow)d=Math.floor(d*1.5);deal(d);P.msg=m.name+'！ '+d+' ダメージ！';drawBattle();afterAction()}function skillMenu(){var p=document.getElementById('panel');if(!P.skill){P.msg='まだスキルを覚えていない。';drawBattle();return}var k=P.skill;p.innerHTML='<div class="box"><b>'+esc(k.name)+'</b><span class="small">MP '+k.cost+' / '+esc(k.desc)+'</span><button id="sf">▶ もう一度選択して発動</button><button id="sb">▶ 戻る</button></div>';document.getElementById('sf').onclick=function(){useSkill(k)};document.getElementById('sb').onclick=function(){p.innerHTML=''}}function useSkill(k){if(P.mp<k.cost){P.msg='MPが足りない。';drawBattle();return}P.mp-=k.cost;var d=0,a=Math.max(1,P.attack-P.enemy.def);if(k.kind==='double'){deal(a);if(P.enemyhp>0)deal(a);d=a*2}else if(k.kind==='guard'){d=Math.max(1,Math.floor(P.attack*1.5)-P.enemy.def);deal(d);P.guard=true}else{d=Math.max(1,Math.floor(P.attack*k.mult)-P.enemy.def);deal(d)}P.msg=k.name+'！ '+d+' ダメージ！';drawBattle();afterAction()}function item(){var p=document.getElementById('panel');p.innerHTML='<div class="box"><button id="heal">回復薬　HP+10　残り '+P.potions+'</button><button id="mp">魔力水　MP+10</button></div>';document.getElementById('heal').onclick=function(){if(P.potions<=0){P.msg='回復薬がない。';drawBattle();return}P.potions--;P.hp=Math.min(P.maxhp,P.hp+10);P.msg='回復薬を使った！';drawBattle();afterAction()};document.getElementById('mp').onclick=function(){P.mp=Math.min(P.maxmp,P.mp+10);P.msg='魔力水を飲んだ！';drawBattle();afterAction()}}function enemyAttack(){var d=Math.max(1,P.enemy.atk-P.defence);if(P.guard){d=0;P.guard=false}P.hp=Math.max(0,P.hp-d);effect(false);P.msg=d?P.enemy.name+'の攻撃！ '+d+' ダメージ！':P.enemy.name+'の攻撃を無効化した！';if(P.hp<=0){P.turn=false;drawBattle();setTimeout(function(){finish(false)},300);return}P.turn=true;drawBattle()}function clearStage(){P.hp=P.maxhp;P.mp=P.maxmp;var inc=P.stage;P.hp+=inc;P.maxhp+=inc;P.speed+=inc;P.defence+=inc;P.critical+=inc;P.attack+=inc;P.magicAttack+=inc;P.maxmp+=inc;P.mp=P.maxmp;var mb=magicBase[(P.stage-1)%10];var m={name:mb[0],power:mb[1]+Math.floor((P.stage-1)/3),light:!!mb[2],desc:mb[3],cost:2+Math.floor(P.stage/4)};var sb=skillBase[(P.stage-1)%10];var k;if(sb[1].indexOf('2連')>=0)k={name:sb[0],desc:sb[1],cost:sb[2],kind:'double'};else if(sb[1].indexOf('無効化')>=0)k={name:sb[0],desc:sb[1],cost:sb[2],kind:'guard'};else{k={name:sb[0],desc:sb[1],cost:sb[2],kind:'power',mult:parseFloat(sb[1].match(/[0-9.]+/)[0])}}if(P.magic.length<4)P.magic.push(m);else{var keep=confirm('新しい魔法「'+m.name+'」を残しますか？ OK=残す / キャンセル=現在の4つを維持');if(keep){var old=P.magic.map(function(x){return x.name}).join('\n');var idx=prompt('入れ替える番号を入力（1〜4）\n'+old);idx=parseInt(idx,10);if(idx>=1&&idx<=4)P.magic[idx-1]=m}}if(!P.skill)P.skill=k;else if(confirm('新しいスキル「'+k.name+'」を残しますか？ OK=入れ替える / キャンセル=維持'))P.skill=k;if(P.stage>=20){finish(true);return}P.stage++;battle()}function finish(clear){var rec={name:P.name,result:clear?'CLEAR':'失格',stage:clear?20:P.stage,magic:P.magic.map(function(x){return x.name}),skill:P.skill?P.skill.name:'なし',stats:{hp:P.hp,maxhp:P.maxhp,speed:P.speed,defence:P.defence,critical:P.critical,attack:P.attack,magicAttack:P.magicAttack}};var save=confirm((clear?'20戦クリア！':'失格…')+'\n記録に残しますか？');if(save){var rs=JSON.parse(localStorage.getItem('vmqRecords')||'[]');rs.push(rec);localStorage.setItem('vmqRecords',JSON.stringify(rs))}title()}function records(){var rs=JSON.parse(localStorage.getItem('vmqRecords')||'[]');A.innerHTML='<section class="title"><h2>これまでの記録</h2>'+(rs.length?rs.map(function(r){return '<div class="box record"><b>'+esc(r.name)+'</b> / '+r.result+'<br>到達：'+r.stage+'戦<br>魔法：'+esc(r.magic.join(' / '))+'<br>スキル：'+esc(r.skill)+'<br>HP '+r.stats.hp+'/'+r.stats.maxhp+' / SPEED '+r.stats.speed+' / DEFENCE '+r.stats.defence+' / CRITICAL '+r.stats.critical+' / ATTACK '+r.stats.attack+' / MAGIC ATK '+r.stats.magicAttack+'</div>'}).join(''):'<p>まだ記録はありません。</p>')+'<button id="back">▶ 戻る</button></section>';document.getElementById('back').onclick=title}title()})();</script></body></html>
