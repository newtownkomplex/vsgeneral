<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>🐟 Catch!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#9bdcf5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow:hidden;touch-action:none}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:520px;height:100dvh;overflow:hidden;background:linear-gradient(#83d6f4 0%,#bdebf8 72%,#7bc9df 100%);user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.hidden{display:none!important}
#startScreen h1{font-size:48px;margin:0 0 8px;letter-spacing:.04em}
#startScreen p{margin:0 0 28px;font-size:14px;color:#315c6c}
.startBtn,.resultBtn{border:0;border-radius:999px;background:#174d60;color:#fff;font-size:18px;font-weight:700;padding:14px 40px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.startBtn:active,.resultBtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
#game{position:absolute;inset:0}
#score{position:absolute;z-index:20;left:16px;top:14px;font-size:22px;font-weight:800;color:#173b47;text-shadow:0 1px #fff}
#timer{position:absolute;z-index:20;right:16px;top:14px;font-size:22px;font-weight:800;color:#173b47;text-shadow:0 1px #fff}
#playfield{position:absolute;inset:0;overflow:hidden}
.fish{position:absolute;z-index:5;font-size:34px;line-height:1;will-change:transform;filter:drop-shadow(0 2px 1px rgba(0,0,0,.12))}
#basket{position:absolute;z-index:15;bottom:20px;left:50%;width:112px;height:62px;transform:translateX(-50%);touch-action:none;cursor:grab}
#basket.dragging{cursor:grabbing}
.basketBody{position:absolute;left:5px;right:5px;bottom:0;height:46px;background:#b97938;border:4px solid #71421e;border-top:0;border-radius:6px 6px 25px 25px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.basketRim{position:absolute;left:0;right:0;top:8px;height:18px;border:5px solid #71421e;border-radius:50%;background:#d4934c}
#countdown{z-index:50;background:rgba(255,255,255,.18);backdrop-filter:blur(3px)}
#countdownText{font-size:76px;font-weight:900;color:#174d60;text-shadow:0 4px rgba(255,255,255,.6)}
#countdownSub{font-size:18px;font-weight:700;color:#174d60;margin-top:5px}
#resultScreen{background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
#resultScreen .fishResult{font-size:50px}
#resultScreen h2{margin:8px 0 2px;font-size:30px;color:#174d60}
#resultScreen .finalScore{font-size:64px;font-weight:900;color:#174d60;line-height:1.1}
#resultScreen .label{font-size:14px;color:#52717a;margin-bottom:24px}
.catchFlash{position:absolute;z-index:10;font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.3);pointer-events:none;animation:pop .35s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:scale(.7) translateY(0)}100%{opacity:0;transform:scale(1.2) translateY(-35px)}}
@media (prefers-reduced-motion:reduce){.catchFlash{animation:none;opacity:0}}
</style>
</head>
<body>
<main id="app">
<section id="startScreen" class="screen">
<h1>🐟</h1>
<p>降ってくる魚をカゴでキャッチ！<br>カゴをタップして、そのまま左右にドラッグ。</p>
<button id="startBtn" class="startBtn" type="button">スタート</button>
</section>

<section id="game" class="hidden" aria-label="魚キャッチゲーム">
<div id="score" aria-live="polite">🐟 0</div>
<div id="timer">15.0</div>
<div id="playfield"></div>
<div id="basket" role="button" tabindex="0" aria-label="カゴ。左右にドラッグして動かします。">
<div class="basketRim"></div><div class="basketBody"></div>
</div>
</section>

<section id="countdown" class="screen hidden" aria-live="assertive">
<div id="countdownText">3</div><div id="countdownSub">準備してね</div>
</section>

<section id="resultScreen" class="screen hidden">
<div class="fishResult">🐟</div>
<h2>TIME UP!</h2>
<div id="finalScore" class="finalScore">0</div>
<div class="label">匹キャッチ</div>
<button id="resultBtn" class="resultBtn" type="button">もう一度</button>
</section>
</main>
<script>
(() => {
'use strict';
const app=document.getElementById('app');
const startScreen=document.getElementById('startScreen');
const game=document.getElementById('game');
const countdown=document.getElementById('countdown');
const countdownText=document.getElementById('countdownText');
const countdownSub=document.getElementById('countdownSub');
const resultScreen=document.getElementById('resultScreen');
const startBtn=document.getElementById('startBtn');
const resultBtn=document.getElementById('resultBtn');
const playfield=document.getElementById('playfield');
const basket=document.getElementById('basket');
const scoreEl=document.getElementById('score');
const timerEl=document.getElementById('timer');
const finalScore=document.getElementById('finalScore');

let score=0, running=false, basketX=0, pointerId=null;
let fishId=0, fish=new Map(), spawnTimer=null, animationId=null, startTime=0;
const GAME_MS=15000;
const BASKET_W=112;
const FISH_SIZE=38;

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function fieldWidth(){return playfield.clientWidth;}
function fieldHeight(){return playfield.clientHeight;}
function setBasket(x){basketX=clamp(x,BASKET_W/2,fieldWidth()-BASKET_W/2);basket.style.left=basketX+'px';}
function resetBasket(){setBasket(fieldWidth()/2);}

function showScreen(el){[startScreen,game,countdown,resultScreen].forEach(x=>x.classList.add('hidden'));el.classList.remove('hidden');}

function clearFish(){fish.forEach(f=>f.el.remove());fish.clear();}

function createFish(){
if(!running)return;
const el=document.createElement('div');
el.className='fish';el.textContent='🐟';
const x=Math.random()*(Math.max(1,fieldWidth()-FISH_SIZE));
const y=-FISH_SIZE-5;
const speed=fieldHeight()/(2.5+Math.random()*1.7);
const item={id:++fishId,el,x,y,speed,created:performance.now()};
el.style.transform=`translate3d(${x}px,${y}px,0)`;
playfield.appendChild(el);fish.set(item.id,item);
const delay=200+Math.random()*300;
spawnTimer=setTimeout(createFish,delay);
}

function caught(item){
const basketLeft=basketX-BASKET_W/2;
const basketRight=basketX+BASKET_W/2;
const fishCenter=item.x+FISH_SIZE/2;
const basketTop=fieldHeight()-82;
return item.y+FISH_SIZE>=basketTop && item.y<=basketTop+48 && fishCenter>=basketLeft-8 && fishCenter<=basketRight+8;
}

function flashCatch(x,y){
const el=document.createElement('div');el.className='catchFlash';el.textContent='+1';el.style.left=x+'px';el.style.top=y+'px';playfield.appendChild(el);setTimeout(()=>el.remove(),380);
}

function updateScore(){scoreEl.textContent='🐟 '+score;}

function loop(now){
if(!running)return;
const dt=Math.min(40,now-(loop.last||now));loop.last=now;
const elapsed=now-startTime;
const remaining=Math.max(0,GAME_MS-elapsed);
timerEl.textContent=(remaining/1000).toFixed(1);
fish.forEach(item=>{
item.y+=item.speed*dt/1000;
item.el.style.transform=`translate3d(${item.x}px,${item.y}px,0)`;
if(caught(item)){
score++;updateScore();flashCatch(item.x,item.y);item.el.remove();fish.delete(item.id);
}else if(item.y>fieldHeight()+FISH_SIZE){item.el.remove();fish.delete(item.id);}
});
if(remaining<=0){stopGame();return;}
animationId=requestAnimationFrame(loop);
}
loop.last=0;

function stopGame(){
if(!running)return;
running=false;
clearTimeout(spawnTimer);spawnTimer=null;
if(animationId)cancelAnimationFrame(animationId);animationId=null;
clearFish();
timerEl.textContent='0.0';
finalScore.textContent=score;
showScreen(resultScreen);
}

function startGame(){
score=0;fishId=0;updateScore();timerEl.textContent='15.0';clearFish();clearTimeout(spawnTimer);resetBasket();
showScreen(countdown);countdownSub.textContent='準備してね';
let n=3;countdownText.textContent=n;
const timer=setInterval(()=>{
 n--;
 if(n>0){countdownText.textContent=n;}
 else{
  clearInterval(timer);countdownText.textContent='START!';countdownSub.textContent='🐟 キャッチ！';
  setTimeout(()=>{
   showScreen(game);running=true;startTime=performance.now();loop.last=startTime;createFish();animationId=requestAnimationFrame(loop);
  },550);
 }
},700);
}

function moveBasket(clientX){
const rect=app.getBoundingClientRect();setBasket(clientX-rect.left);}

basket.addEventListener('pointerdown',e=>{if(!running)return;pointerId=e.pointerId;basket.setPointerCapture(pointerId);basket.classList.add('dragging');moveBasket(e.clientX);e.preventDefault();});
basket.addEventListener('pointermove',e=>{if(pointerId!==e.pointerId)return;moveBasket(e.clientX);e.preventDefault();});
function endDrag(e){if(pointerId!==e.pointerId)return;pointerId=null;basket.classList.remove('dragging');}
basket.addEventListener('pointerup',endDrag);basket.addEventListener('pointercancel',endDrag);
basket.addEventListener('keydown',e=>{
if(!running)return;
if(e.key==='ArrowLeft'){setBasket(basketX-36);e.preventDefault();}
if(e.key==='ArrowRight'){setBasket(basketX+36);e.preventDefault();}
});

startBtn.addEventListener('click',startGame);
resultBtn.addEventListener('click',startGame);
window.addEventListener('resize',()=>{if(!basketX||basketX>fieldWidth())resetBasket();else setBasket(basketX);});
resetBasket();
})();
</script>
</body>
</html>
