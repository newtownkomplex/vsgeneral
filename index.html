<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08070d;color:#eee9d8;font-family:monospace}#app{width:min(720px,100%);min-height:100vh;margin:auto;padding:14px;background:#0d0b14;border:4px solid #eee9d8}h1{text-align:center;margin:60px 0 16px;font-size:28px}p{text-align:center}button,input{font:700 15px monospace}button{width:100%;margin:7px 0;padding:14px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8;cursor:pointer}input{width:100%;padding:13px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8}.box{border:3px solid #eee9d8;padding:12px;margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px}.stat{border:2px solid #777;padding:6px;display:flex;justify-content:space-between;font-size:11px}.battlefield{height:330px;border:3px solid #eee9d8;background:#171020;display:flex;align-items:center;justify-content:center;position:relative}.monster{width:250px;height:250px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}.enemy-info{position:absolute;top:7px;left:7px;right:7px;display:flex;justify-content:space-between}.tag{background:#09080e;border:2px solid #eee9d8;padding:5px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.small{font-size:10px;font-weight:400;display:block;margin-top:3px;color:#aaa}.log{min-height:46px;display:flex;align-items:center}.flash{animation:flash .28s steps(3)}.shake{animation:shake .28s steps(3)}@keyframes flash{0%,100%{filter:none}25%{filter:brightness(2)}50%{filter:brightness(.35)}75%{filter:brightness(1.8)}}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,1px)}}.record{border:2px solid #777;padding:9px;margin:7px 0;font-size:11px;line-height:1.6}</style></head><body><main id="app"></main><script>(function(){'use strict';var app=document.getElementById('app');var monsterNames=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var spells=[{name:'影炎流',power:2,light:false,desc:'影を炎へ変える。'},{name:'白燐',power:3,light:true,desc:'光属性。闇属性に1.5倍。'},{name:'月鉛の棘',power:4,light:false,desc:'重い棘を撃つ。'},{name:'虚無の眼',power:5,light:false,desc:'虚無の視線。'},{name:'黒雨',power:6,light:false,desc:'黒い雨を降らせる。'},{name:'黎明針',power:7,light:true,desc:'光属性。闇属性に1.5倍。'},{name:'冥灯',power:8,light:false,desc:'冥い灯火。'},{name:'白骸光',power:9,light:true,desc:'光属性。闇属性に1.5倍。'},{name:'夜葬',power:10,light:false,desc:'夜を凝縮する。'},{name:'灰界',power:12,light:true,desc:'光属性。闇属性に1.5倍。'}];var skillDefs=[{name:'裂骨打',cost:5,kind:'double',desc:'攻撃力依存の2連攻撃。'},{name:'影縫い',cost:6,kind:'guard',desc:'次の敵攻撃を無効化し、攻撃力×1.5。'},{name:'喉断ち',cost:7,mult:1.7,desc:'攻撃力×1.7。'},{name:'連環裂',cost:8,kind:'doublePower',mult:1.25,desc:'攻撃力×1.25を2連撃。'},{name:'空葬',cost:9,kind:'guard',desc:'次の敵攻撃を無効化し、攻撃力×1.5。'},{name:'反転構え',cost:10,mult:2,desc:'攻撃力×2。'},{name:'硬化突き',cost:11,mult:1.8,desc:'攻撃力×1.8。'},{name:'瞬歩殺',cost:12,kind:'double',desc:'攻撃力依存の2連攻撃。'},{name:'崩し刃',cost:13,mult:2.2,desc:'攻撃力×2.2。'},{name:'星砕き',cost:14,kind:'guard',desc:'次の敵攻撃を無効化し、攻撃力×1.5。'}];var P={name:'',stage:1,attack:6,magicAttack:6,hp:30,maxHp:30,speed:5,defence:2,critical:5,mp:20,maxMp:20,magic:[],skill:null,enemy:null,guard:false,potions:3};function title(){app.innerHTML='<h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button>';document.getElementById('start').onclick=setup;document.getElementById('records').onclick=records}function setup(){app.innerHTML='<h1>ABILITY SET</h1><div class="box"><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランス</p><div id="balance"></div><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定してバトルスタート</button></div>';shuffle();document.getElementById('shuffle').onclick=shuffle;document.getElementById('go').onclick=function(){var n=document.getElementById('name').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}P.name=n;P.stage=1;P.hp=P.maxHp=30;P.speed=5;P.defence=2;P.critical=5;P.mp=P.maxMp=20;P.magic=[];P.skill=null;P.potions=3;battle()}}function shuffle(){P.attack=1+Math.floor(Math.random()*11);P.magicAttack=12-P.attack;var b=document.getElementById('balance');if(b)b.innerHTML='<div class="stats"><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div></div>'}function battle(){var n=P.stage,boss=n%5===0,base=12+n*3+(boss?n*5:0);P.enemy={name:monsterNames[n-1],boss:boss,shadow:n%2===0,hp:base,maxHp:base,atk:2+Math.floor(n*.7)+(boss?4:0),def:Math.floor(n/5)+(boss?3:0),sprite:String(n).padStart(2,'0')};renderBattle(''+(boss?'★ 強敵 ★ ':'')+P.enemy.name+' が あらわれた！')}function renderBattle(message){var e=P.enemy;app.innerHTML='<h2>戦闘 '+P.stage+' / 20</h2><div class="battlefield" id="field"><div class="enemy-info"><span class="tag">'+e.name+'</span><span class="tag">HP '+e.hp+' / '+e.maxHp+'</span></div><img id="monster" class="monster" src="assets/monsters/'+e.sprite+'.svg" alt="'+e.name+'"></div><div class="stats"><div class="stat">HP <b>'+P.hp+'/'+P.maxHp+'</b></div><div class="stat">SPEED <b>'+P.speed+'</b></div><div class="stat">DEFENCE <b>'+P.defence+'</b></div><div class="stat">CRITICAL <b>'+P.critical+'%</b></div><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div><div class="stat">MP <b>'+P.mp+'/'+P.maxMp+'</b></div></div><div class="box log" id="log">'+message+'</div><div id="commands"><button id="attack">▶ こうげき</button><button id="magic">▶ まほう</button><button id="skill">▶ スキル</button><button id="item">▶ アイテム</button></div>';document.getElementById('attack').onclick=attack;document.getElementById('magic').onclick=magicMenu;document.getElementById('skill').onclick=skillMenu;document.getElementById('item').onclick=item}function enemyDamage(){if(P.guard){P.guard=false;return 0}return Math.max(1,P.enemy.atk-P.defence)}function takeEnemyTurn(){var d=enemyDamage();P.hp=Math.max(0,P.hp-d);var f=document.getElementById('field');f.classList.remove('shake','flash');void f.offsetWidth;f.classList.add('shake','flash');if(P.hp<=0){setTimeout(function(){finish(false)},280);return false}return true}function playerHit(d){P.enemy.hp=Math.max(0,P.enemy.hp-d);var m=document.getElementById('monster');m.classList.remove('shake','flash');void m.offsetWidth;m.classList.add('shake','flash')}function afterAction(message){if(P.enemy.hp<=0){setTimeout(clearStage,280);return}renderBattle(message);setTimeout(function(){if(takeEnemyTurn())renderBattle(P.enemy.name+' の攻撃！ '+Math.max(0,P.enemy.atk-P.defence)+' ダメージ！')},300)}function attack(){var d=Math.max(1,P.attack-P.enemy.def);if(Math.random()*100<P.critical)d*=2;playerHit(d);afterAction('こうげき！ '+d+' ダメージ！')}function magicMenu(){if(!P.magic.length){P.magic.push(makeMagic(0))}app.innerHTML='<h2>まほう</h2><div class="box"><p>魔法を選択すると説明が表示され、もう一度選択すると発動。</p><div class="choices">'+P.magic.map(function(s,i){return '<button data-i="'+i+'">'+s.name+'<span class="small">MP '+s.cost+' / 威力 '+s.power+(s.light?' / 光属性':'')+'<br>'+s.desc+'</span></button>'}).join('')+'</div><button id="back">▶ 戻る</button></div>';app.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var s=P.magic[+b.dataset.i];app.querySelectorAll('[data-i]').forEach(function(x){x.disabled=true});b.disabled=false;b.onclick=function(){castMagic(s)};b.innerHTML=s.name+'<span class="small">もう一度選択して発動</span>'}});document.getElementById('back').onclick=renderBattle.bind(null,'戻った。')}function makeMagic(i){var s=spells[i%spells.length];return{name:s.name,power:s.power+Math.floor((P.stage-1)/3),light:s.light,desc:s.desc,cost:2+Math.floor(P.stage/4)}}function castMagic(s){if(P.mp<s.cost){alert('MPが足りない。');return}P.mp-=s.cost;var d=P.magicAttack*s.power;if(s.light&&P.enemy.shadow)d=Math.floor(d*1.5);playerHit(d);afterAction(s.name+'！ '+d+' ダメージ！')}function skillMenu(){if(!P.skill)P.skill=makeSkill((P.stage-1)%skillDefs.length);var k=P.skill;app.innerHTML='<h2>スキル</h2><div class="box"><button id="skillChoice">'+k.name+'<span class="small">MP '+k.cost+'<br>'+k.desc+'<br>もう一度選択すると発動</span></button><button id="back">▶ 戻る</button></div>';document.getElementById('skillChoice').onclick=function(){useSkill(k)};document.getElementById('back').onclick=renderBattle.bind(null,'戻った。')}function makeSkill(i){return Object.assign({},skillDefs[i])}function useSkill(k){if(P.mp<k.cost){alert('MPが足りない。');return}P.mp-=k.cost;var d=0;if(k.kind==='double'){var x=Math.max(1,P.attack-P.enemy.def);d=x*2}else if(k.kind==='doublePower'){var y=Math.max(1,Math.floor(P.attack*k.mult)-P.enemy.def);d=y*2}else if(k.kind==='guard'){d=Math.max(1,Math.floor(P.attack*1.5)-P.enemy.def);P.guard=true}else d=Math.max(1,Math.floor(P.attack*k.mult)-P.enemy.def);playerHit(d);afterAction(k.name+'！ '+d+' ダメージ！')}function item(){if(P.potions<=0){alert('回復薬がない。');return}P.potions--;P.hp=Math.min(P.maxHp,P.hp+10);afterAction('回復薬でHPが10回復した。')}function clearStage(){var n=P.stage;P.hp=P.maxHp;P.mp=P.maxMp;P.maxHp+=n;P.hp=P.maxHp;P.speed+=n;P.defence+=n;P.critical+=n;P.attack+=n;P.magicAttack+=n;P.maxMp+=n;P.mp=P.maxMp;var nm=makeMagic(n-1);if(P.magic.length<4)P.magic.push(nm);else{if(confirm('新しい魔法「'+nm.name+'」を残しますか？')){var idx=P.magic.findIndex(function(x){return x.name===nm.name});P.magic[idx<0?0:idx]=nm}}var ns=makeSkill((n-1)%skillDefs.length);if(!P.skill)P.skill=ns;else if(confirm('新しいスキル「'+ns.name+'」に入れ替えますか？'))P.skill=ns;if(n>=20)finish(true);else{P.stage++;battle()}}function finish(clear){var rec={name:P.name,result:clear?'CLEAR':'失格',stage:P.stage,magic:P.magic.map(function(x){return x.name}),skill:P.skill?P.skill.name:'なし',stats:{hp:P.hp,speed:P.speed,defence:P.defence,critical:P.critical,attack:P.attack,magicAttack:P.magicAttack}};if(confirm((clear?'20戦クリア！':'失格…')+' 記録に残しますか？')){var r=JSON.parse(localStorage.getItem('vmqRecords')||'[]');r.push(rec);localStorage.setItem('vmqRecords',JSON.stringify(r))}title()}function records(){var r=JSON.parse(localStorage.getItem('vmqRecords')||'[]');app.innerHTML='<h2>これまでの記録</h2>'+(r.length?r.map(function(x){return '<div class="record"><b>'+x.name+'</b>　'+x.result+'<br>到達戦：'+x.stage+'<br>魔法：'+x.magic.join(' / ')+'<br>スキル：'+x.skill+'<br>HP '+x.stats.hp+' / SPEED '+x.stats.speed+' / DEFENCE '+x.stats.defence+' / CRITICAL '+x.stats.critical+' / ATTACK '+x.stats.attack+' / MAGIC ATTACK '+x.stats.magicAttack+'</div>'}).join(''):'<p>まだ記録はありません。</p>')+'<button id="back">▶ 戻る</button>';document.getElementById('back').onclick=title}title()})();</script></body></html>
