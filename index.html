<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DOT MONSTER QUEST</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#10131a;color:#eee6c8;font-family:"Courier New",monospace}body{display:flex;justify-content:center}.game{width:min(100vw,620px);min-height:100vh;background:#181c25;border:4px solid #303644;display:flex;flex-direction:column}.top{padding:9px;text-align:center;border-bottom:4px solid #303644;background:#222733;font-weight:900}.battle{padding:9px;display:flex;flex-direction:column;gap:8px;flex:1}.scene{height:280px;position:relative;border:4px solid #e8dfb9;background:#52694d;overflow:hidden}.scene:before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(10,20,15,.18) 50%,transparent 50%),linear-gradient(rgba(10,20,15,.18) 50%,transparent 50%);background-size:12px 12px;image-rendering:pixelated}.name,.ehp{position:absolute;top:8px;background:#111620;border:3px solid #e8dfb9;padding:5px 7px;z-index:3;font-size:12px}.name{left:8px}.ehp{right:8px}.sprite{position:absolute;width:192px;height:192px;left:50%;top:54%;transform:translate(-50%,-50%);z-index:2;image-rendering:pixelated}.sprite canvas{width:100%;height:100%;image-rendering:pixelated}.status{position:absolute;right:6px;bottom:6px;z-index:4;width:118px;display:flex;flex-direction:column;gap:3px}.stat{background:#111620dd;border:2px solid #aaa486;padding:3px 6px;font-size:10px;display:flex;justify-content:space-between}.stat b{font-size:11px}.box{background:#10151e;border:4px solid #e8dfb9;padding:9px;min-height:68px;font-size:12px;line-height:1.6}.commands{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cmd,.choice{background:#252c39;color:#eee6c8;border:3px solid #687081;padding:11px 7px;font:700 13px "Courier New",monospace;text-align:left}.cmd:disabled{opacity:.35}.panel{display:none}.panel.open{display:block}.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.choice small{display:block;color:#aaa895;font-size:9px;margin-top:4px}.overlay{position:fixed;inset:0;background:#080a0ee8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{width:min(520px,100%);background:#181d27;border:5px solid #e8dfb9;padding:16px}.modal h1,.modal h2{margin:0 0 9px}.modal p{font-size:11px;line-height:1.7}.modal button{width:100%;margin-top:6px;background:#293140;color:#eee6c8;border:3px solid #747c8b;padding:11px;font:700 12px "Courier New",monospace}.hidden{display:none!important}.flash-hit{animation:hit .28s steps(2,end)}@keyframes hit{0%,100%{transform:translate(0,0);filter:none}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.55)}75%{transform:translate(-3px,1px);filter:brightness(1.7)}}.enemy-hit{animation:enemyHit .28s steps(3,end)}@keyframes enemyHit{0%,100%{transform:translate(-50%,-50%);filter:none}20%{transform:translate(calc(-50% - 7px),-50%);filter:brightness(2)}45%{transform:translate(calc(-50% + 7px),-50%);filter:brightness(.6)}70%{transform:translate(calc(-50% - 3px),-50%);filter:brightness(1.7)}}.footer{font-size:8px;text-align:center;color:#777e8d;padding:6px;border-top:3px solid #303644}</style></head><body><div class="game"><header class="top">DOT MONSTER QUEST</header><main class="battle"><section class="scene" id="scene"><div class="name" id="enemyName"></div><div class="ehp" id="enemyHp"></div><div class="sprite" id="sprite"><canvas width="32" height="32" id="canvas"></canvas></div><div class="status" id="stats"></div></section><section class="box" id="message"></section><section class="commands"><button class="cmd" onclick="attack()">▶ こうげき</button><button class="cmd" onclick="magic()">▶ まほう</button><button class="cmd" onclick="skill()">▶ スキル</button><button class="cmd" onclick="item()">▶ アイテム</button></section><section class="panel" id="panel"></section></main><footer class="footer">20 BATTLES / NO TIME LIMIT / DOT ART</footer></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><script>
const $=id=>document.getElementById(id);
const P=['00000000000000000000000000000000','00000000000011111100000000000000','00000000001112222110000000000000','00000000111222222211100000000000','00000001112222222222110000000000','00000011122222222222211100000000','00000111222222222222221110000000','00001112222222222222222111000000','00001112222222222222222211100000','00011122222222222222222221110000','00111222222222222222222222111000','01112222222222222222222222211100','01112222222222222222222222211100','01112222222222222222222222211100','00111222222222222222222222111000','00011122222222222222222221110000','00001112222222222222222111000000','00000111222222222222221110000000','00000011122222222222211100000000','00000001112222222222110000000000','00000000111222222211100000000000','00000000001112222110000000000000','00000000000011111100000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000'];
const names=['ミズゴロ','コゲツムリ','ハネガサ','モリノワ','イワツブテラ','ヨルネコ','ツノカゲ','アワムシ','カゼノメ','ヌマグマ','ホシクイ','クロカブリ','シロツチ','ミミズバコ','カゲボウシ','アカネグモ','ソラノクチ','ネムリバナ','ガラクタマ','オオトビラ'];
const magicNames=['ルミナ','ヴェイル','グレイズ','ノクス','リフレア','ゼノン','ミストラ','オルタ','フロストル','エクリア'];
const skillNames=['裂光打','影縫い','轟き返し','空断ち','反転構え','連環撃','硬化突き','瞬歩撃','崩し刃','星砕き'];
let s={battle:1,enemy:null,enemyHp:0,turn:true,stats:{hp:30,max:30,speed:5,defence:2,critical:5,magicattack:3},magic:[],skill:null,potions:3,guard:false,log:''};
function enemy(){let boss=s.battle%5===0;let n=s.battle;return{name:names[n-1],hp:10+n*2+(boss?n*5:0),atk:2+Math.floor(n*.65)+(boss?3:0),def:1+Math.floor(n/6)+(boss?2:0),crit:4+n+(boss?5:0),boss,reward:{hp:1+(boss?3:1),speed:boss?1:0,defence:boss?1:0,critical:boss?1:0,magicattack:boss?1:0},magic:{name:magicNames[(n-1)%magicNames.length],power:5+Math.floor(n/2)+(boss?4:0),desc:'魔力で '+(5+Math.floor(n/2)+(boss?4:0))+' ダメージ。'},skill:{name:skillNames[(n-1)%skillNames.length],power:4+n+(boss?5:0),desc:'攻撃力 '+(4+n+(boss?5:0))+' の特殊攻撃。'}}
function setup(){s.enemy=enemy();s.enemyHp=s.enemy.hp;s.turn=true;s.guard=false;s.log=s.enemy.boss?'強敵 '+s.enemy.name+' が あらわれた！':' '+s.enemy.name+' が あらわれた！';render()}
function render(){let e=s.enemy;if(!e)return;$('enemyName').textContent=(e.boss?'★ 強敵 ★ ':'')+e.name;$('enemyHp').textContent='HP '+s.enemyHp+' / '+e.hp;$('message').textContent=s.log;$('stats').innerHTML=[['HP',s.stats.hp+'/'+s.stats.max],['SPEED',s.stats.speed],['DEFENCE',s.stats.defence],['CRITICAL',s.stats.critical+'%'],['MAGIC ATK',s.stats.magicattack]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');document.querySelectorAll('.cmd').forEach(b=>b.disabled=!s.turn||s.enemyHp<=0);draw()}
function draw(){let c=$('canvas'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,32,32);P.forEach((r,y)=>[...r].forEach((v,i)=>{if(v!=='0'){x.fillStyle=v==='1'?'#17201b':'#d9e6ad';x.fillRect(i,y,1,1)}}))}
function effect(kind){let el=kind==='enemy'?$('sprite'):$('scene');el.classList.remove(kind==='enemy'?'enemy-hit':'flash-hit');void el.offsetWidth;el.classList.add(kind==='enemy'?'enemy-hit':'flash-hit');setTimeout(()=>el.classList.remove(kind==='enemy'?'enemy-hit':'flash-hit'),280)}
function dmgEnemy(n){s.enemyHp=Math.max(0,s.enemyHp-n);effect('enemy')}
function attack(){if(!s.turn)return;close();let d=Math.max(1,5+Math.floor(Math.random()*4)+Math.floor(s.stats.speed/3)-s.enemy.def);let crit=Math.random()*100<s.stats.critical;if(crit)d*=2;dmgEnemy(d);s.log=crit?'会心の一撃！ '+d+' ダメージ！':'こうげき！ '+d+' ダメージ！';afterPlayer()}
function magic(){if(!s.magic.length){s.log='覚えている魔法は ない。';render();return}showPanel('まほうを選ぶ',s.magic.map((m,i)=>({name:m.name,desc:m.desc,fn:()=>magicConfirm(i)})))}
function magicConfirm(i){let m=s.magic[i];showPanel('もう一度選択すると発動', [{name:m.name,desc:m.desc,fn:()=>{close();dmgEnemy(Math.max(1,m.power+s.stats.magicattack-Math.floor(s.enemy.def/2)));s.log=m.name+'を 発動！';afterPlayer()}}])}
function skill(){if(!s.skill){s.log='覚えているスキルは ない。';render();return}showPanel('スキルを選ぶ',[{name:s.skill.name,desc:s.skill.desc,fn:()=>{close();dmgEnemy(Math.max(1,s.skill.power+Math.floor(s.stats.speed/3)-s.enemy.def));s.log=s.skill.name+'！';afterPlayer()}}])}
function item(){showPanel('アイテム',[{name:'回復薬',desc:'HPを 8 回復 / 残り '+s.potions,fn:()=>{if(!s.potions){s.log='回復薬が ない。';render();return}s.potions--;s.stats.hp=Math.min(s.stats.max,s.stats.hp+8);close();s.log='回復薬を 使った！';afterPlayer()}},{name:'守勢',desc:'次に受けるダメージを半減',fn:()=>{close();s.guard=true;s.log='守りを固めた。';afterPlayer()}}])}
function showPanel(t,a){let p=$('panel');p.className='panel open';p.innerHTML='<div class="box"><b>'+t+'</b><div class="choices">'+a.map((q,i)=>'<button class="choice" data-i="'+i+'">'+q.name+'<small>'+q.desc+'</small></button>').join('')+'</div></div>';p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>a[+b.dataset.i].fn())}
function close(){$('panel').className='panel';$('panel').innerHTML=''}
function afterPlayer(){render();if(s.enemyHp<=0){setTimeout(reward,300);return}s.turn=false;render();setTimeout(enemyTurn,420)}
function enemyTurn(){let d=Math.max(1,s.enemy.atk+Math.floor(Math.random()*3)-s.stats.defence);if(s.guard)d=Math.ceil(d/2);if(Math.random()*100<s.enemy.crit)d*=2;s.stats.hp=Math.max(0,s.stats.hp-d);effect('screen');s.guard=false;s.log=s.enemy.name+'の攻撃！ '+d+' ダメージ！';if(s.stats.hp<=0){lose();return}s.turn=true;render()}
function reward(){s.turn=false;let r=s.enemy.reward;Object.keys(r).forEach(k=>{s.stats[k]+=r[k]});s.stats.max+=r.hp;s.stats.hp=Math.min(s.stats.max,s.stats.hp+4);let m=s.enemy.magic,k=s.enemy.skill;$('overlay').classList.remove('hidden');$('modal').innerHTML='<h2>'+s.enemy.name+'を たおした！</h2><p>ステータス上昇：HP +'+r.hp+' / SPEED +'+r.speed+' / DEFENCE +'+r.defence+' / CRITICAL +'+r.critical+' / MAGIC ATK +'+r.magicattack+'</p><p>新しい魔法「'+m.name+'」とスキル「'+k.name+'」のどちらかを選択。</p><button id="rm">魔法「'+m.name+'」</button><button id="rs">スキル「'+k.name+'」</button>';$('rm').onclick=()=>getMagic(m);$('rs').onclick=()=>getSkill(k)}
function getMagic(m){if(s.magic.length>=4){chooseReplace('魔法',s.magic,m,'magic');return}s.magic.push(m);next('魔法「'+m.name+'」を覚えた！')}
function getSkill(k){if(s.skill){chooseReplace('スキル',[s.skill],k,'skill');return}s.skill=k;next('スキル「'+k.name+'」を覚えた！')}
function chooseReplace(t,arr,n,type){$('modal').innerHTML='<h2>'+t+'がいっぱいだ！</h2><p>残すものを選択。</p>'+arr.map((x,i)=>'<button data-i="'+i+'">「'+x.name+'」を残す</button>').join('')+'<button data-i="new">新しい「'+n.name+'」を残す</button>';$('modal').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.i==='new'){if(type==='magic')s.magic=[...s.magic.slice(0,3),n];else s.skill=n}next('選択した '+t+'を残した！')})}
function next(msg){$('overlay').classList.add('hidden');s.log=msg;s.battle++;if(s.battle>20){win();return}setup()}
function win(){$('overlay').classList.remove('hidden');$('modal').innerHTML='<h1>QUEST COMPLETE</h1><p>20戦突破！最終ステータスを確認しよう。</p><button onclick="location.reload()">もう一度</button>';s.over=true}
function lose(){$('overlay').classList.remove('hidden');$('modal').innerHTML='<h1>GAME OVER</h1><p>戦闘不能になった……。</p><button onclick="location.reload()">もう一度</button>';s.over=true}
function intro(){$('modal').innerHTML='<h1>DOT MONSTER QUEST</h1><p>全20戦。5戦ごとに強敵が出現。<br>敵を倒すたびに5ステータスが固定値で上昇し、魔法またはスキルを獲得。<br>魔法は4個、スキルは1個まで。</p><button id="start">ぼうけんを はじめる</button>';$('start').onclick=()=>{$('overlay').classList.add('hidden');setup()}}
intro();
</script></body></html>
