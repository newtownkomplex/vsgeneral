<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;background:#05050a;color:#eee;font-family:monospace;touch-action:manipulation;-webkit-user-select:none;user-select:none}#app{width:min(720px,100%);min-height:100vh;margin:auto;background:#09090d;padding:10px}.title{text-align:center;padding:60px 8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{width:100%;min-height:58px;background:#07070a;color:#eee;border:2px solid #ddd;padding:9px;font:700 14px monospace;touch-action:manipulation}button:disabled{opacity:.45}.stage{border:2px solid #ddd;padding:6px;display:flex;justify-content:space-between}.message,.info,.compare{border:2px solid #ddd;background:#07070a;padding:10px;margin:7px 0}.battle{border:2px solid #ddd;background:#17152e;position:relative;min-height:440px;overflow:hidden}.playerPanel{position:absolute;left:7px;top:7px;width:132px;border:2px solid #ddd;background:#05050ae8;padding:7px;z-index:3}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #555;padding:3px 0;font-size:10px}.enemy{position:absolute;left:50%;top:52%;transform:translate(-10%,-50%);width:290px;height:290px;object-fit:contain;image-rendering:pixelated;z-index:2}.enemyTag{position:absolute;right:7px;top:7px;border:2px solid #ddd;background:#05050ae8;padding:6px;z-index:3}.commandArea{position:relative;margin-top:6px}.commandOverlay{position:absolute;left:0;right:0;bottom:0;background:#09090d;border:2px solid #ddd;padding:7px;z-index:20}.detail{border:2px solid #777;padding:8px;min-height:62px;margin-bottom:6px;font-size:11px;line-height:1.5}.small{display:block;font-size:10px;color:#bbb;margin-top:3px}.hit-enemy{animation:enemyShake .28s steps(3)}.hit-player{animation:screenShake .28s steps(3)}@keyframes enemyShake{0%,100%{transform:translate(-10%,-50%)}25%{transform:translate(-18%,-48%)}50%{transform:translate(-2%,-52%)}75%{transform:translate(-14%,-49%)}}@keyframes screenShake{0%,100%{transform:translate(0)}25%{transform:translate(-7px,2px)}50%{transform:translate(7px,-2px)}75%{transform:translate(-4px,1px)}}</style><script>document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});</script></head><body><main id="app"></main><script>(function(){'use strict';const app=document.getElementById('app');const names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];const spellDefs=[['影炎流',2,2,'影を炎へ変える。',false],['白燐',3,3,'光属性。闇属性に1.5倍。',true],['月鉛の棘',4,4,'重い棘を撃つ。',false],['虚無の眼',5,5,'虚無の視線。',false],['黒雨',6,6,'黒い雨を降らせる。',false],['黎明針',7,7,'光属性。闇属性に1.5倍。',true],['冥灯',8,8,'冥い灯火。',false],['白骸光',9,9,'光属性。闇属性に1.5倍。',true],['夜葬',10,10,'夜を凝縮する。',false],['灰界',12,12,'光属性。闇属性に1.5倍。',true]];const skillDefs=[['裂骨打',5,'攻撃力×2。2連攻撃。'],['影縫い',6,'次の敵攻撃を無効化し、攻撃力×1.5。'],['喉断ち',7,'攻撃力×1.7。'],['連環裂',8,'攻撃力×1.25を2連撃。'],['空葬',9,'次の敵攻撃を無効化し、攻撃力×1.5。'],['反転構え',10,'攻撃力×2。'],['硬化突き',11,'攻撃力×1.8。'],['瞬歩殺',12,'攻撃力×2。2連攻撃。'],['崩し刃',13,'攻撃力×2.2。'],['星砕き',14,'次の敵攻撃を無効化し、攻撃力×1.5。']];let P={stage:1,attack:10,magicAttack:10,hp:30,maxHp:30,speed:5,defence:2,critical:5,mp:20,maxMp:20,enemy:null,magic:[],skill:null};function title(){app.innerHTML='<div class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div>';document.getElementById('start').onclick=startGame;document.getElementById('records').onclick=records}function startGame(){P.stage=1;P.attack=10;P.magicAttack=10;P.hp=P.maxHp=30;P.mp=P.maxMp=20;P.speed=5;P.defence=2;P.critical=5;P.magic=[];P.skill=null;battle()}function battle(){let n=P.stage;P.enemy={name:names[n-1],hp:12+n*3,maxHp:12+n*3,def:Math.floor(n/5),atk:2+Math.floor(n*.7),sprite:String(n).padStart(2,'0')};renderMessage(P.enemy.name+' が あらわれた！')}function render(msg){let e=P.enemy;app.innerHTML='<div class="stage"><span>STAGE '+P.stage+'/20</span><span>VOID MONSTER QUEST</span></div><div class="message" id="message">'+msg+'</div><div class="battle" id="battle"><div class="playerPanel"><div class="stat">HP <b>'+P.hp+'/'+P.maxHp+'</b></div><div class="stat">MP <b>'+P.mp+'/'+P.maxMp+'</b></div><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div><div class="stat">DEFENCE <b>'+P.defence+'</b></div><div class="stat">SPEED <b>'+P.speed+'</b></div><div class="stat">CRITICAL <b>'+P.critical+'%</b></div></div><div class="enemyTag">'+e.name+'<br>HP '+e.hp+'/'+e.maxHp+'</div><img id="monster" class="enemy" src="assets/monsters/'+e.sprite+'.svg"></div><div id="commandArea" class="commandArea"><div id="commands" class="grid2"><button id="attack">⚔ こうげき</button><button id="magic">◆ まほう</button><button id="skill">✦ スキル</button><button id="item">▣ アイテム</button></div></div>'}function renderMessage(msg){render(msg)}function showMessage(msg,done){const el=document.getElementById('message');if(!el)return done&&done();el.textContent='';let i=0;const chars=[...msg];const step=500/chars.length;function tick(){if(i<chars.length){el.textContent+=chars[i++];setTimeout(tick,Math.max(12,step))}else if(done)setTimeout(done,500)}tick()}function damage(d){P.enemy.hp=Math.max(0,P.enemy.hp-d);let m=document.getElementById('monster');if(m){m.classList.remove('hit-enemy');void m.offsetWidth;m.classList.add('hit-enemy')}if(P.enemy.hp<=0)return setTimeout(reward,280);showMessage(d+' ダメージ！',()=>{let x=Math.max(1,P.enemy.atk-P.defence);P.hp=Math.max(0,P.hp-x);let b=document.getElementById('battle');if(b){b.classList.remove('hit-player');void b.offsetWidth;b.classList.add('hit-player')}showMessage(P.enemy.name+' の攻撃！ '+x+' ダメージ！')})}function attack(){damage(Math.max(1,P.attack-P.enemy.def))}function makeSpell(i){let s=spellDefs[i%spellDefs.length];return{name:s[0],cost:s[1],power:s[2]+Math.floor((P.stage-1)/3),desc:s[3],light:s[4]}}function makeSkill(i){let s=skillDefs[i%skillDefs.length];return{name:s[0],cost:s[1],desc:s[2]}}function magicMenu(){if(!P.magic.length)return;overlay('まほう',P.magic.map((s,i)=>'<button data-i="'+i+'">'+s.name+'<span class="small">MP '+s.cost+' / 威力 '+s.power+'</span></button>').join(''),i=>{let s=P.magic[i];if(P.mp<s.cost)return alert('MPが足りない。');P.mp-=s.cost;let d=P.magicAttack*s.power;if(s.light&&P.enemy.name==='終冥王')d=Math.floor(d*1.5);damage(d)})}function skillMenu(){if(!P.skill)return;let s=P.skill;overlay('スキル','<button data-skill="1">'+s.name+'<span class="small">MP '+s.cost+'</span></button>',()=>{if(P.mp<s.cost)return alert('MPが足りない。');P.mp-=s.cost;let m=(s.desc.match(/×([0-9.]+)/)||[])[1]||1;damage(Math.max(1,Math.floor(P.attack*parseFloat(m))-P.enemy.def))})}function overlay(t,buttons,use){let a=document.getElementById('commandArea'),g=document.getElementById('commands');g.style.visibility='hidden';let o=document.createElement('div');o.className='commandOverlay';o.innerHTML='<b>'+t+'</b><div id="detail" class="detail">技を選択してください。</div><div class="grid2">'+buttons+'</div><button id="close">▶ 戻る</button>';a.appendChild(o);o.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let s=P.magic[+b.dataset.i];document.getElementById('detail').innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 '+s.power+(s.light?' / 光属性':'')+'<br>'+s.desc+'<br><b>この魔法を使う</b>';b.onclick=()=>use(+b.dataset.i)});let sb=o.querySelector('[data-skill]');if(sb)sb.onclick=()=>{let s=P.skill;document.getElementById('detail').innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+'<br>'+s.desc+'<br><b>このスキルを使う</b>';sb.onclick=()=>use()};document.getElementById('close').onclick=()=>{o.remove();g.style.visibility='visible'}}function reward(){let n=P.stage*P.stage;P.maxHp+=n;P.hp=P.maxHp;P.speed+=n;P.defence+=n;P.critical+=n;P.attack+=n;P.magicAttack+=n;P.maxMp+=n;P.mp=P.maxMp;let newSpell=makeSpell(P.stage-1),newSkill=makeSkill(P.stage-1);let oldSpell=null,oldSkill=P.skill;app.innerHTML='<h2>戦闘終了</h2><div class="info">HP・MP全回復<br>全ステータス <b>+'+n+'</b> を自動反映。</div><div class="compare"><b>新しい魔法</b><br>'+newSpell.name+'<br>MP消費：'+newSpell.cost<br>威力：'+newSpell.power+'<br>効果：'+newSpell.desc+'</div><div class="compare"><b>新しいスキル</b><br>'+newSkill.name+'<br>MP消費：'+newSkill.cost+'<br>効果：'+newSkill.desc+'</div>';const process=()=>{if(!oldSpell&&P.magic.length<4){P.magic.push(newSpell);magicDone()}else if(!oldSpell)chooseSpell();else chooseSkill()};const magicDone=()=>{oldSpell=newSpell;chooseSkill()};const chooseSpell=()=>{if(P.magic.length===0){P.magic.push(newSpell);oldSpell=newSpell;return chooseSkill()}oldSpell=P.magic[0];app.innerHTML='<h2>魔法を選択</h2><div class="grid2"><button id="keepM">'+oldSpell.name+'<span class="small">MP '+oldSpell.cost+' / 威力 '+oldSpell.power+'<br>'+oldSpell.desc+'</span></button><button id="newM">'+newSpell.name+'<span class="small">MP '+newSpell.cost+' / 威力 '+newSpell.power+'<br>'+newSpell.desc+'</span></button></div>';document.getElementById('keepM').onclick=()=>chooseSkill();document.getElementById('newM').onclick=()=>{if(P.magic.length<4)P.magic.push(newSpell);else P.magic[0]=newSpell;chooseSkill()};};const chooseSkill=()=>{if(!P.skill){P.skill=newSkill;finish();return}app.innerHTML='<h2>スキルを比較</h2><div class="grid2"><button id="keepS">'+P.skill.name+'<span class="small">MP '+P.skill.cost+'<br>'+P.skill.desc+'</span></button><button id="newS">'+newSkill.name+'<span class="small">MP '+newSkill.cost+'<br>'+newSkill.desc+'</span></button></div>';document.getElementById('keepS').onclick=finish;document.getElementById('newS').onclick=()=>{P.skill=newSkill;finish()}};const finish=()=>{app.innerHTML='<h2>戦闘終了</h2><div class="info">報酬を獲得しました。<br>全ステータス +'+n+' を自動反映。</div><button id="next">▶ 次の戦闘へ</button>';document.getElementById('next').onclick=()=>{if(P.stage>=20)title();else{P.stage++;battle()}}};if(P.magic.length===0){P.magic.push(newSpell);chooseSkill()}else chooseSpell()}function records(){app.innerHTML='<h2>これまでの記録</h2><p>現在の記録機能は準備中です。</p><button onclick="location.reload()">▶ 戻る</button>}title()})();</script></body></html>
