<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>html,body{margin:0;background:#08070b;color:#eee;font-family:monospace}#app{max-width:720px;min-height:100vh;margin:auto;padding:16px;background:#11101a;border:4px solid #eee;box-sizing:border-box}.title{text-align:center;padding:30px 10px}button,input{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;background:#09080d;color:#eee;border:3px solid #eee;font:700 15px monospace}.box{border:3px solid #eee;padding:12px;margin:10px 0}.bar{margin:14px 0}.head{display:flex;justify-content:space-between}.track{height:18px;border:2px solid #eee}.fill{height:100%;background:#a46bd8}</style></head><body><main id="app"><section class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><button onclick="beginGame()">▶ ぼうけんを はじめる</button><button onclick="showRecords()">▶ これまでの記録</button></section></main><script>function beginGame(){document.getElementById('app').innerHTML='<section class="title"><h2>ABILITY SET</h2><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力の初期値を決める</p><div class="box"><div class="bar"><div class="head"><b>ATTACK</b><b id="a">6</b></div><div class="track"><div id="af" class="fill" style="width:50%"></div></div></div><div class="bar"><div class="head"><b>MAGIC ATTACK</b><b id="m">6</b></div><div class="track"><div id="mf" class="fill" style="width:50%"></div></div></div></div><button onclick="shuffle()">▶ バランスを シャッフル</button><button onclick="startBattle()">▶ 確定して バトルスタート</button></section>';window.attack=6;window.magic=6}function shuffle(){window.attack=1+Math.floor(Math.random()*11);window.magic=12-window.attack;document.getElementById('a').textContent=attack;document.getElementById('m').textContent=magic;document.getElementById('af').style.width=(attack/12*100)+'%';document.getElementById('mf').style.width=(magic/12*100)+'%'}function startBattle(){var n=document.getElementById('name').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}document.getElementById('app').innerHTML='<section class="title"><h2>戦闘準備完了</h2><p>'+n+'　ATTACK '+attack+' / MAGIC ATTACK '+magic+'</p><p>1 / 20 戦</p><button onclick="alert(\'バトル本体を再接続します\')">▶ 戦闘開始</button></section>'}function showRecords(){var r=localStorage.getItem('vmqRecords');document.getElementById('app').innerHTML='<section class="title"><h2>これまでの記録</h2><p>'+(r?'記録があります。':'まだ記録はありません。')+'</p><button onclick="location.reload()">▶ 戻る</button></section>'}</script></body></html>
