<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;background:#05050a;color:#eee;font-family:monospace;touch-action:manipulation;-webkit-user-select:none;user-select:none}#app{width:min(720px,100%);min-height:100vh;margin:auto;background:#09090d;padding:10px}.title{text-align:center;padding:60px 8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}button,input{font:700 14px monospace}button{width:100%;min-height:58px;background:#07070a;color:#eee;border:2px solid #ddd;padding:9px;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(2px)}input{width:100%;padding:12px;background:#07070a;color:#eee;border:2px solid #ddd;touch-action:manipulation}.box,.info{border:2px solid #ddd;background:#07070a;padding:10px;margin:7px 0}.stage{height:32px;border:2px solid #ddd;padding:6px;display:flex;justify-content:space-between}.message{border:2px solid #ddd;padding:12px;min-height:54px;margin-top:6px}.battle{border:2px solid #ddd;background:#17152e;position:relative;min-height:440px;overflow:hidden}.playerPanel{position:absolute;left:7px;top:7px;width:132px;border:2px solid #ddd;background:#05050ae8;padding:7px;z-index:3}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #555;padding:3px 0;font-size:10px}.enemy{position:absolute;left:50%;top:52%;transform:translate(-10%,-50%);width:290px;height:290px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;z-index:2}.enemyTag{position:absolute;right:7px;top:7px;border:2px solid #ddd;background:#05050ae8;padding:6px;z-index:3}.commandArea{position:relative;margin-top:6px}.commandOverlay{position:absolute;left:0;right:0;bottom:0;background:#09090d;border:2px solid #ddd;padding:7px;z-index:20}.detail{border:2px solid #777;padding:8px;min-height:62px;margin-bottom:6px;font-size:11px;line-height:1.5}.small{display:block;font-size:10px;font-weight:400;color:#bbb;margin-top:3px}.selected{background:#eee;color:#07070a}.record{border:2px solid #777;padding:8px;margin:6px 0;font-size:10px}.hit-enemy{animation:enemyShake .28s steps(3)}.hit-player{animation:screenShake .28s steps(3)}@keyframes enemyShake{0%,100%{transform:translate(-10%,-50%)}25%{transform:translate(calc(-10% - 8px),calc(-50% + 2px))}50%{transform:translate(calc(-10% + 8px),calc(-50% - 2px))}75%{transform:translate(calc(-10% - 4px),calc(-50% + 1px))}}@keyframes screenShake{0%,100%{transform:translate(0)}25%{transform:translate(-7px,2px)}50%{transform:translate(7px,-2px)}75%{transform:translate(-4px,1px)}}</style><script>document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false});document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});</script></head><body><main id="app"></main><script>(function(){'use strict';var app=document.getElementById('app');var names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var P={name:'',stage:1,attack:6,magicAttack:6,hp:30,maxHp:30,speed:5,defence:2,critical:5,mp:20,maxMp:20,enemy:null};function title(){app.innerHTML='<div class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="grid2"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div></div>';document.getElementById('start').onclick=setup;document.getElementById('records').onclick=records}function setup(){app.innerHTML='<div class="title"><h2>ABILITY SET</h2><div class="box"><input id="playerName" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランス</p><div id="bal"></div><div class="grid2"><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定してスタート</button></div></div></div>';document.getElementById('shuffle').onclick=shuffle;document.getElementById('go').onclick=function(){var n=document.getElementById('playerName').value.trim();if(!n)return alert('プレイヤー名を入力してください。');P.name=n;P.stage=1;P.hp=P.maxHp=30;P.mp=P.maxMp=20;battle()};shuffle()}function shuffle(){P.attack=1+Math.floor(Math.random()*11);P.magicAttack=12-P.attack;document.getElementById('bal').innerHTML='<div class="grid2"><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div></div>'}function battle(){var n=P.stage;P.enemy={name:names[n-1],hp:12+n*3,maxHp:12+n*3,def:Math.floor(n/5),atk:2+Math.floor(n*.7),sprite:String(n).padStart(2,'0')};renderBattle(P.enemy.name+' が あらわれた！')}function renderBattle(msg){var e=P.enemy;app.innerHTML='<div class="stage"><span>STAGE '+P.stage+'/20</span><span>VOID MONSTER QUEST</span></div><div class="message">'+msg+'</div><div class="battle" id="battle"><div class="playerPanel"><b>'+P.name+'</b><div class="stat">HP <b>'+P.hp+'/'+P.maxHp+'</b></div><div class="stat">MP <b>'+P.mp+'/'+P.maxMp+'</b></div><div class="stat">ATK <b>'+P.attack+'</b></div><div class="stat">MAT <b>'+P.magicAttack+'</b></div><div class="stat">DEF <b>'+P.defence+'</b></div><div class="stat">SPD <b>'+P.speed+'</b></div><div class="stat">CRT <b>'+P.critical+'%</b></div></div><div class="enemyTag">'+e.name+'<br>HP '+e.hp+'/'+e.maxHp+'</div><img id="monster" class="enemy" src="assets/monsters/'+e.sprite+'.svg"></div><div id="commandArea" class="commandArea"><div id="commandGrid" class="grid2"><button id="attack">⚔ こうげき</button><button id="magic">◆ まほう</button><button id="skill">✦ スキル</button><button id="item">▣ アイテム</button></div></div>';document.getElementById('attack').onclick=attack;document.getElementById('magic').onclick=magic;document.getElementById('skill').onclick=skill;document.getElementById('item').onclick=item}function enemyShake(){var m=document.getElementById('monster');if(m){m.classList.remove('hit-enemy');void m.offsetWidth;m.classList.add('hit-enemy')}}function playerShake(){var b=document.getElementById('battle');if(b){b.classList.remove('hit-player');void b.offsetWidth;b.classList.add('hit-player')}}function damage(d){P.enemy.hp=Math.max(0,P.enemy.hp-d);enemyShake();if(P.enemy.hp<=0){setTimeout(function(){P.hp=P.maxHp;P.mp=P.maxMp;reward()},280);return}renderBattle(d+' ダメージ！');setTimeout(function(){var x=Math.max(1,P.enemy.atk-P.defence);P.hp=Math.max(0,P.hp-x);playerShake();setTimeout(function(){renderBattle(P.enemy.name+' の攻撃！ '+x+' ダメージ！')},280)},300)}function attack(){damage(Math.max(1,P.attack-P.enemy.def))}function magic(){damage(P.magicAttack*2)}function skill(){damage(Math.max(1,P.attack-P.enemy.def)*2)}function item(){P.hp=Math.min(P.maxHp,P.hp+10);renderBattle('アイテムでHPが10回復した。')}function reward(){var n=P.stage*P.stage;app.innerHTML='<h2>戦闘終了</h2><div class="info">HP・MPが全回復した。</div><button id="up">全ステータス +'+n+'</button><button id="next">次の戦闘へ</button>';document.getElementById('up').onclick=function(){var x=P.stage*P.stage;P.maxHp+=x;P.hp=P.maxHp;P.speed+=x;P.defence+=x;P.critical+=x;P.attack+=x;P.magicAttack+=x;P.maxMp+=x;P.mp=P.maxMp;reward()};document.getElementById('next').onclick=function(){if(P.stage>=20){title()}else{P.stage++;battle()}}}function records(){app.innerHTML='<h2>これまでの記録</h2><p>記録は端末内に保存されます。</p><button id="back">▶ 戻る</button>';document.getElementById('back').onclick=title}title()})();</script></body></html>
