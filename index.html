<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08070d;color:#eee9d8;font-family:monospace}#app{width:min(720px,100%);min-height:100vh;margin:auto;padding:14px;background:#0d0b14;border:4px solid #eee9d8}h1{text-align:center;margin:60px 0 16px;font-size:28px}h2{margin:10px 0}p{text-align:center}button,input{font:700 15px monospace}button{width:100%;padding:13px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8;cursor:pointer;min-height:62px}button:disabled{opacity:.45}input{width:100%;padding:13px;background:#09080e;color:#eee9d8;border:3px solid #eee9d8}.box{border:3px solid #eee9d8;padding:12px;margin:10px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border:2px solid #777;padding:6px;display:flex;justify-content:space-between;font-size:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px}.battlefield{height:330px;border:3px solid #eee9d8;background:#171020;display:flex;align-items:center;justify-content:center;position:relative}.monster{width:250px;height:250px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}.enemy-info{position:absolute;top:7px;left:7px;right:7px;display:flex;justify-content:space-between}.tag{background:#09080e;border:2px solid #eee9d8;padding:5px}.log{min-height:46px;display:flex;align-items:center}.info{border:3px solid #eee9d8;padding:12px;margin-bottom:9px;min-height:72px}.small{font-size:10px;font-weight:400;display:block;margin-top:4px;color:#aaa;line-height:1.45}.flash{animation:flash .28s steps(3)}.shake{animation:shake .28s steps(3)}@keyframes flash{0%,100%{filter:none}25%{filter:brightness(2)}50%{filter:brightness(.35)}75%{filter:brightness(1.8)}}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,1px)}}.record{border:2px solid #777;padding:9px;margin:7px 0;font-size:11px;line-height:1.6}</style></head><body><main id="app"></main><script>(function(){'use strict';var app=document.getElementById('app');var names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var spellDefs=[['影炎流',2,false,'影を炎へ変える。'],['白燐',3,true,'光属性。闇属性に1.5倍。'],['月鉛の棘',4,false,'重い棘を撃つ。'],['虚無の眼',5,false,'虚無の視線。'],['黒雨',6,false,'黒い雨を降らせる。'],['黎明針',7,true,'光属性。闇属性に1.5倍。'],['冥灯',8,false,'冥い灯火。'],['白骸光',9,true,'光属性。闇属性に1.5倍。'],['夜葬',10,false,'夜を凝縮する。'],['灰界',12,true,'光属性。闇属性に1.5倍。']];var skillDefs=[['裂骨打',5,'double','攻撃力依存の2連攻撃。'],['影縫い',6,'guard','次の敵攻撃を無効化し、攻撃力×1.5。'],['喉断ち',7,'power',1.7,'攻撃力×1.7。'],['連環裂',8,'doublePower',1.25,'攻撃力×1.25を2連撃。'],['空葬',9,'guard','次の敵攻撃を無効化し、攻撃力×1.5。'],['反転構え',10,'power',2,'攻撃力×2。'],['硬化突き',11,'power',1.8,'攻撃力×1.8。'],['瞬歩殺',12,'double','攻撃力依存の2連攻撃。'],['崩し刃',13,'power',2.2,'攻撃力×2.2。'],['星砕き',14,'guard','次の敵攻撃を無効化し、攻撃力×1.5。']];var P={name:'',stage:1,attack:6,magicAttack:6,hp:30,maxHp:30,speed:5,defence:2,critical:5,mp:20,maxMp:20,magic:[],skill:null,enemy:null,guard:false,potions:3};function title(){app.innerHTML='<h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="grid2"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div>';document.getElementById('start').onclick=setup;document.getElementById('records').onclick=records}function setup(){app.innerHTML='<h1>ABILITY SET</h1><div class="box"><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランス</p><div id="bal"></div><div class="grid2"><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定してスタート</button></div></div>';shuffle();document.getElementById('shuffle').onclick=shuffle;document.getElementById('go').onclick=function(){var n=document.getElementById('name').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}P.name=n;P.stage=1;P.attack=6;P.magicAttack=6;P.hp=P.maxHp=30;P.speed=5;P.defence=2;P.critical=5;P.mp=P.maxMp=20;P.magic=[];P.skill=null;P.potions=3;shuffle();battle()}}function shuffle(){P.attack=1+Math.floor(Math.random()*11);P.magicAttack=12-P.attack;var b=document.getElementById('bal');if(b)b.innerHTML='<div class="stats"><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div></div>'}function makeMagic(i){var d=spellDefs[i%spellDefs.length];return{name:d[0],power:d[1]+Math.floor((P.stage-1)/3),light:d[2],desc:d[3],cost:2+Math.floor(P.stage/4)}}function makeSkill(i){var d=skillDefs[i%skillDefs.length];return{name:d[0],cost:d[1],kind:d[2],mult:typeof d[3]==='number'?d[3]:null,desc:typeof d[3]==='string'?d[3]:d[4]}}function battle(){var n=P.stage,boss=n%5===0,base=12+n*3+(boss?n*5:0);P.enemy={name:names[n-1],boss:boss,shadow:n%2===0,hp:base,maxHp:base,atk:2+Math.floor(n*.7)+(boss?4:0),def:Math.floor(n/5)+(boss?3:0),sprite:String(n).padStart(2,'0')};renderBattle((boss?'★ 強敵 ★ ':'')+P.enemy.name+' が あらわれた！')}function stats(){return '<div class="stats"><div class="stat">HP <b>'+P.hp+'/'+P.maxHp+'</b></div><div class="stat">SPEED <b>'+P.speed+'</b></div><div class="stat">DEFENCE <b>'+P.defence+'</b></div><div class="stat">CRITICAL <b>'+P.critical+'%</b></div><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div><div class="stat">MP <b>'+P.mp+'/'+P.maxMp+'</b></div></div>'}function renderBattle(msg){var e=P.enemy;app.innerHTML='<h2>戦闘 '+P.stage+' / 20</h2><div class="battlefield" id="field"><div class="enemy-info"><span class="tag">'+e.name+'</span><span class="tag">HP '+e.hp+' / '+e.maxHp+'</span></div><img id="monster" class="monster" src="assets/monsters/'+e.sprite+'.svg"></div>'+stats()+'<div class="box log">'+msg+'</div><div class="grid2"><button id="attack">▶ こうげき</button><button id="magic">▶ まほう</button><button id="skill">▶ スキル</button><button id="item">▶ アイテム</button></div>';document.getElementById('attack').onclick=attack;document.getElementById('magic').onclick=magicMenu;document.getElementById('skill').onclick=skillMenu;document.getElementById('item').onclick=item}function playerHit(d){P.enemy.hp=Math.max(0,P.enemy.hp-d);var m=document.getElementById('monster');if(m){m.classList.remove('shake','flash');void m.offsetWidth;m.classList.add('shake','flash')}}function enemyTurn(){if(P.guard){P.guard=false;return 0}var d=Math.max(1,P.enemy.atk-P.defence);P.hp=Math.max(0,P.hp-d);var f=document.getElementById('field');if(f){f.classList.remove('shake','flash');void f.offsetWidth;f.classList.add('shake','flash')}return d}function afterAction(msg){if(P.enemy.hp<=0){setTimeout(rewardScreen,280);return}renderBattle(msg);setTimeout(function(){var d=enemyTurn();if(P.hp<=0){setTimeout(function(){finish(false)},280);return}renderBattle(P.enemy.name+' の攻撃！ '+d+' ダメージ！')},300)}function attack(){var d=Math.max(1,P.attack-P.enemy.def);if(Math.random()*100<P.critical)d*=2;playerHit(d);afterAction('こうげき！ '+d+' ダメージ！')}function item(){if(P.potions<=0){alert('回復薬がない。');return}P.potions--;P.hp=Math.min(P.maxHp,P.hp+10);afterAction('回復薬でHPが10回復した。')}function magicMenu(){if(!P.magic.length)P.magic.push(makeMagic(0));var selected=null;app.innerHTML='<h2>まほう</h2><div id="detail" class="info">魔法を1回タップすると、ここに説明・威力が表示されます。</div><div class="grid2">'+P.magic.map(function(s,i){return '<button data-i="'+i+'">'+s.name+'<span class="small">MP '+s.cost+'</span></button>'}).join('')+'</div><button id="back">▶ 戻る</button>';app.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var s=P.magic[+b.dataset.i];if(selected===s){castMagic(s);return}selected=s;document.getElementById('detail').innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 '+s.power+(s.light?' / 光属性':'')+'<br>'+s.desc+'<br><strong>もう一度タップで使用</strong>';app.querySelectorAll('[data-i]').forEach(function(x){x.style.borderColor=x===b?'#eee9d8':'#777'})}});document.getElementById('back').onclick=function(){renderBattle('戻った。')}}function castMagic(s){if(P.mp<s.cost){alert('MPが足りない。');return}P.mp-=s.cost;var d=P.magicAttack*s.power;if(s.light&&P.enemy.shadow)d=Math.floor(d*1.5);playerHit(d);afterAction(s.name+'！ '+d+' ダメージ！')}function skillMenu(){var s=P.skill||makeSkill((P.stage-1)%skillDefs.length);if(!P.skill)P.skill=s;var selected=false;app.innerHTML='<h2>スキル</h2><div id="detail" class="info">スキルを1回タップすると、ここに説明・威力が表示されます。</div><div class="grid2"><button id="skillBtn">'+s.name+'<span class="small">MP '+s.cost+'</span></button><button id="back">▶ 戻る</button></div>';document.getElementById('skillBtn').onclick=function(){if(selected){useSkill(s);return}selected=true;var power=s.kind==='double'?'攻撃力×1を2回':s.kind==='doublePower'?'攻撃力×'+s.mult+'を2回':s.kind==='guard'?'攻撃力×1.5 + 次の攻撃無効':'攻撃力×'+s.mult;document.getElementById('detail').innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 '+power+'<br>'+s.desc+'<br><strong>もう一度タップで使用</strong>'};document.getElementById('back').onclick=function(){renderBattle('戻った。')}}function useSkill(s){if(P.mp<s.cost){alert('MPが足りない。');return}P.mp-=s.cost;var d;if(s.kind==='double')d=Math.max(1,P.attack-P.enemy.def)*2;else if(s.kind==='doublePower')d=Math.max(1,Math.floor(P.attack*s.mult)-P.enemy.def)*2;else if(s.kind==='guard'){d=Math.max(1,Math.floor(P.attack*1.5)-P.enemy.def);P.guard=true}else d=Math.max(1,Math.floor(P.attack*s.mult)-P.enemy.def);playerHit(d);afterAction(s.name+'！ '+d+' ダメージ！')}function rewardScreen(){var n=P.stage,nm=makeMagic(n-1),ns=makeSkill(n-1);P.hp=P.maxHp;P.mp=P.maxMp;app.innerHTML='<h2>戦闘終了</h2><div class="box"><b>'+P.enemy.name+'を倒した！</b><br>HP・MPが全回復した。</div><div class="info">今回の獲得候補<br>魔法：'+nm.name+'　威力 '+nm.power+'　MP '+nm.cost+(nm.light?'　光属性':'')+'<br>スキル：'+ns.name+'　MP '+ns.cost+'　'+ns.desc+'</div><div class="grid2"><button id="getMagic">◆ 魔法を確認</button><button id="getSkill">◆ スキルを確認</button><button id="status">◆ ステータス +'+n+'</button><button id="next">◆ 次の戦闘へ</button></div>';document.getElementById('getMagic').onclick=function(){rewardMagic(nm)};document.getElementById('getSkill').onclick=function(){rewardSkill(ns)};document.getElementById('status').onclick=function(){levelUp(n);rewardScreen()};document.getElementById('next').onclick=function(){P.stage++;if(n>=20)finish(true);else battle()}}function rewardMagic(m){var detail='魔法「'+m.name+'」<br>MP '+m.cost+' / 威力 '+m.power+(m.light?' / 光属性':'')+'<br>'+m.desc;if(P.magic.some(function(x){return x.name===m.name})){showRewardMessage(detail+'<br>すでに所持しています。')}else if(P.magic.length<4){P.magic.push(m);showRewardMessage(detail+'<br><b>獲得しました。</b>')}else{app.innerHTML='<h2>魔法を残す</h2><div class="info">新魔法：'+detail+'<br>残す魔法を1回タップしてください。</div><div class="grid2">'+P.magic.map(function(x,i){return '<button data-i="'+i+'">'+x.name+'<span class="small">威力 '+x.power+' / MP '+x.cost+'</span></button>'}).join('')+'</div><button id="cancel">▶ 戻る</button>';app.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){P.magic[+b.dataset.i]=m;rewardScreen()}});document.getElementById('cancel').onclick=rewardScreen}}function rewardSkill(s){var detail='スキル「'+s.name+'」<br>MP '+s.cost+' / '+s.desc;if(!P.skill){P.skill=s;showRewardMessage(detail+'<br><b>獲得しました。</b>')}else{app.innerHTML='<h2>スキルを残す</h2><div class="info">新スキル：'+detail+'<br>残すスキルを選択してください。</div><div class="grid2"><button id="old">現在のスキル<br>'+P.skill.name+'<span class="small">'+P.skill.desc+'</span></button><button id="new">新しいスキル<br>'+s.name+'<span class="small">'+s.desc+'</span></button></div><button id="cancel">▶ 戻る</button>';document.getElementById('old').onclick=rewardScreen;document.getElementById('new').onclick=function(){P.skill=s;rewardScreen()};document.getElementById('cancel').onclick=rewardScreen}}function showRewardMessage(t){app.innerHTML='<h2>獲得結果</h2><div class="info">'+t+'</div><button id="back">▶ 報酬画面へ戻る</button>';document.getElementById('back').onclick=rewardScreen}function levelUp(n){P.maxHp+=n;P.hp=P.maxHp;P.speed+=n;P.defence+=n;P.critical+=n;P.attack+=n;P.magicAttack+=n;P.maxMp+=n;P.mp=P.maxMp}function finish(clear){var rec={name:P.name,result:clear?'CLEAR':'失格',stage:P.stage,magic:P.magic.map(function(x){return x.name}),skill:P.skill?P.skill.name:'なし',stats:{hp:P.hp,speed:P.speed,defence:P.defence,critical:P.critical,attack:P.attack,magicAttack:P.magicAttack}};app.innerHTML='<h1>'+ (clear?'CLEAR':'失格') +'</h1><div class="info">到達戦：'+P.stage+'<br>記録に残しますか？</div><div class="grid2"><button id="save">記録する</button><button id="nosave">記録しない</button></div>';document.getElementById('save').onclick=function(){var r=JSON.parse(localStorage.getItem('vmqRecords')||'[]');r.push(rec);localStorage.setItem('vmqRecords',JSON.stringify(r));title()};document.getElementById('nosave').onclick=title}function records(){var r=JSON.parse(localStorage.getItem('vmqRecords')||'[]');app.innerHTML='<h2>これまでの記録</h2>'+(r.length?r.map(function(x){return '<div class="record"><b>'+x.name+'</b>　'+x.result+'<br>到達戦：'+x.stage+'<br>魔法：'+x.magic.join(' / ')+'<br>スキル：'+x.skill+'<br>HP '+x.stats.hp+' / SPEED '+x.stats.speed+' / DEFENCE '+x.stats.defence+' / CRITICAL '+x.stats.critical+' / ATTACK '+x.stats.attack+' / MAGIC ATTACK '+x.stats.magicAttack+'</div>'}).join(''):'<p>まだ記録はありません。</p>')+'<button id="back">▶ 戻る</button>';document.getElementById('back').onclick=title}title()})();</script></body></html>
