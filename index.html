<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090d12">
  <title>VS GENERAL</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#090d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    body{display:flex;align-items:center;justify-content:center;overflow:hidden}
    .game-shell{width:100%;height:80vh;max-width:520px;background:#10151d;border:1px solid #29313c;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8da8c8}
    .reset-screen{width:100%;text-align:center}
    .reset-screen h1{margin:0 0 12px;font-size:26px;letter-spacing:.12em;color:#e7e9ed}
    .reset-screen p{margin:0;font-size:13px;color:#7e8997}
  </style>
</head>
<body>
  <main class="game-shell">
    <div class="reset-screen">
      <h1>VS GENERAL</h1>
      <p>GAME RESET</p>
    </div>
  </main>
</body>
</html>
