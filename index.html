<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>VS CARD BATTLE</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#101218;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}button{border:0;border-radius:9px;padding:10px;font:inherit;color:inherit;background:#303541}#app{max-width:560px;height:100vh;margin:auto;display:flex;flex-direction:column;background:#171a22}header{text-align:center;padding:13px;border-bottom:1px solid #303440;font-weight:900}#board{flex:1;min-height:0;display:flex;flex-direction:column;padding:9px;gap:8px}.player{padding:9px;border:1px solid #393e4b;border-radius:11px;background:#1d212b}.active{border-color:#e6bd54}.row{display:flex;justify-content:space-between;align-items:center}.hp{font-size:22px;font-weight:900}.small{font-size:11px;color:#aeb3c0}.field{font-size:11px;color:#aeb3c0;margin-top:4px}.token{font-size:16px}.off{opacity:.25;filter:grayscale(1)}#center{flex:1;min-height:100px;display:flex;flex-direction:column;justify-content:center;gap:7px}.info{text-align:center;font-size:12px;color:#aeb3c0}#log{background:#101218;border-radius:8px;padding:7px;font-size:11px;line-height:1.45;max-height:70px;overflow:auto}#hand{height:180px;display:flex;gap:7px;overflow-x:auto;padding:3px}.card{min-width:105px;text-align:left;background:#252a36;border:1px solid #464c5a;display:flex;flex-direction:column}.card h3{font-size:13px;margin:0 0 5px}.card p{font-size:10px;color:#c7cad2;line-height:1.35;margin:0}.card small{margin-top:auto;color:#8f96a5}#controls{display:grid;grid-template-columns:1fr 1.5fr;gap:7px;padding:8px;border-top:1px solid #303440}.primary{background:#ddb447;color:#111;font-weight:900}#start,#modal{position:fixed;inset:0;background:rgba(8,9,13,.94);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.box{width:min(420px,100%);background:#1d212b;border:1px solid #454a57;border-radius:14px;padding:20px;text-align:center}.box h1{margin:0 0 8px}.box p{font-size:13px;color:#b8bdc7;line-height:1.55}.dice{font-size:42px;margin:18px}.box button{background:#ddb447;color:#111;font-weight:900}.hidden{display:none!important}</style></head><body><main id="app"><header>VS CARD BATTLE</header><section id="board"><div class="player" id="p2"><div class="row"><b>PLAYER 2</b><span class="hp" id="hp2">5</span></div><div class="field" id="f2"></div><div class="token" id="t2">🏹</div></div><div id="center"><div class="info">共通山札 <b id="deck">0</b>　墓地 <b id="grave">0</b></div><div id="log"></div></div><div class="player" id="p1"><div class="row"><b>PLAYER 1</b><span class="hp" id="hp1">5</span></div><div class="field" id="f1"></div><div class="token" id="t1">🏹</div></div><div id="hand"></div></section><div id="controls"><button id="end">ターンエンド</button><button class="primary" id="count" disabled>2枚まで使用できます</button></div></main><div id="start"><div class="box"><h1>VS CARD BATTLE</h1><p>HP 5 / 最大6<br>お互いに破魔矢トークン1個<br>共通山札から毎ターン1枚ドロー</p><div class="dice">🎲 🎲</div><button id="begin">ダイスを振って開始</button></div></div><div id="modal" class="hidden"><div class="box"><h2 id="mt"></h2><p id="mx"></p><div id="ma"></div></div></div><script>
const C={egg:['卵の中身','場に残る。毎ターン初めにHPを1回復。','場'],slash:['刃の切りつけ','相手HP-1。','即時'],censor:['検閲','相手の手札を見て1枚山札へ戻す。','即時'],rainbow:['虹色の芽','場に出し、次の自分のターン終了まで無傷なら勝利。','勝利'],expose:['曝露','自分の手札を全公開し、1枚ドロー。','即時'],chop:['ごっすんチョップ','場に出し、次の自分のターン終了時に墓地へ送り2ダメージ。','遅延'],gather:['漁り手','山札の一番下を手札へ。このターンのみ使用可。','一時'],stone:['ダイヤモン砥石','刃の切りつけと同時に使うと2回発動。','連携']};
let pattern=['egg','slash','slash','censor','rainbow','expose','chop','gather','stone','slash','egg','slash','censor','rainbow','expose','chop','gather','stone','slash','egg','slash','censor','rainbow','expose','chop','gather','stone','slash','egg','slash','censor','rainbow','expose','chop','gather','stone'];
let deck=[],grave=[],hand=[[],[]],hp=[5,5],field=[[],[]],arrow=[1,1],use=[0,0],turn=0,started=false,turnNo=0,logs=[],rain=[null,null],temp=[[],[]];
const $=x=>document.getElementById(x);function sh(a){for(let i=a.length-1;i;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}function log(x){logs.unshift(x);logs=logs.slice(0,7);$('log').innerHTML=logs.map(x=>'<div>・'+x+'</div>').join('')}function refill(){if(!deck.length&&grave.length){deck=sh(grave.splice(0));log('墓地をシャッフルして新しい山札にしました。')}}function draw(p,bottom=false){refill();if(!deck.length)return null;let c=bottom?deck.pop():deck.shift();hand[p].push(c);return c}function modal(t,x,bs){$('mt').textContent=t;$('mx').textContent=x;let a=$('ma');a.innerHTML='';bs.forEach(q=>{let b=document.createElement('button');b.textContent=q[0];b.onclick=()=>{close();q[1]()};a.appendChild(b)});$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}function render(){for(let p=0;p<2;p++){$('hp'+(p+1)).textContent=hp[p];$('p'+(p+1)).classList.toggle('active',started&&turn===p);$('f'+(p+1)).textContent='場：'+(field[p].map(x=>C[x.c][0]).join(' / ')||'なし');$('t'+(p+1)).className='token '+(arrow[p]?'':'off')}$('deck').textContent=deck.length;$('grave').textContent=grave.length;let h=$('hand');h.innerHTML='';hand[0].forEach((c,i)=>{let b=document.createElement('button');b.className='card';b.disabled=!started||turn!==0||use[0]>=2;b.innerHTML='<h3>'+C[c][0]+'</h3><p>'+C[c][1]+'</p><small>'+C[c][2]+'</small>';b.onclick=()=>play(i);h.appendChild(b)});$('count').textContent=turn===0?'使用回数 '+use[0]+' / 2':'相手ターン';$('end').disabled=!started||turn!==0}
function damage(p,n){hp[p]=Math.max(0,hp[p]-n);if(rain[p]){grave.push('rainbow');field[p]=field[p].filter(x=>x.c!=='rainbow');rain[p]=null;log('虹色の芽はダメージを受けて墓地へ。')}log('PLAYER '+(p+1)+' に '+n+'ダメージ');if(hp[p]<=0)win(p^1)}function heal(p){hp[p]=Math.min(6,hp[p]+1)}function negate(p,i,fn){if(!arrow[p])return fn();modal('破魔矢','PLAYER '+(p+1)+' はこのカードの発動を無効にしますか？',[['使わない',fn],['破魔矢を使う',()=>{arrow[p]=0;grave.push(hand[turn].splice(i,1)[0]);log('破魔矢で発動を無効化！');render()}]])}
function play(i){if(turn||use[0]>=2)return;let c=hand[0][i];if(c==='stone'){modal('ダイヤモン砥石','「刃の切りつけ」と同時に使用するカードです。刃の切りつけを選んでください。',[['OK',()=>{}]]);return}negate(1,i,()=>resolve(i))}
function resolve(i){let c=hand[0].splice(i,1)[0];use[0]++;if(c==='egg'){field[0].push({c});log('卵の中身を場に出した')}else if(c==='slash'){damage(1,1)}else if(c==='rainbow'){field[0].push({c});rain[0]=turnNo+1;log('虹色の芽を場に出した')}else if(c==='chop'){field[0].push({c,end:turnNo+1});log('ごっすんチョップを準備')}else if(c==='expose'){log('曝露：手札公開「'+hand[0].map(x=>C[x][0]).join('、')+'」');draw(0)}else if(c==='gather'){let x=draw(0,true);if(x){temp[0].push(x);log('漁り手で「'+C[x][0]+'」を獲得')}}else if(c==='censor'){if(!hand[1].length)log('検閲：相手の手札なし');else modal('検閲','戻すカードを選択',hand[1].map((x,j)=>[C[x][0],()=>{let y=hand[1].splice(j,1)[0];deck.splice(Math.random()*(deck.length+1)|0,0,y);log('検閲で山札へ戻した')}]))}else if(c==='stone'){}else grave.push(c);render();if(use[0]>=2)setTimeout(endTurn,150)}
function endTurn(){if(!started||turn)return;temp[0].forEach(c=>{let i=hand[0].indexOf(c);if(i>=0){hand[0].splice(i,1);grave.push(c)}});temp[0]=[];field[0]=field[0].filter(f=>{if(f.c==='chop'&&f.end===turnNo){grave.push('chop');damage(1,2);return false}return true});if(rain[0]===turnNo){win(0);return}use[0]=0;turn=1;turnNo++;draw(1);render();setTimeout(ai,450)}
function ai(){if(!started)return;for(let k=0;k<2&&hand[1].length;k++){let i=hand[1].indexOf('slash');if(i<0)i=hand[1].indexOf('chop');if(i<0)i=hand[1].indexOf('egg');if(i<0)i=0;let c=hand[1].splice(i,1)[0];use[1]++;if(c==='slash'){if(arrow[0]&&Math.random()<.3){arrow[0]=0;grave.push(c);log('PLAYER 1 が破魔矢で無効化')}else{grave.push(c);damage(0,1)}}else if(c==='egg')field[1].push({c});else if(c==='chop')field[1].push({c,end:turnNo+1});else if(c==='rainbow'){field[1].push({c});rain[1]=turnNo+1}else grave.push(c);if(hp[0]<=0)return}if(rain[1]===turnNo){win(1);return}temp[1].forEach(c=>{let i=hand[1].indexOf(c);if(i>=0){hand[1].splice(i,1);grave.push(c)}});temp[1]=[];use[1]=0;turn=0;turnNo++;draw(0);field[0].forEach(f=>f.c==='egg'&&heal(0));field[1].forEach(f=>f.c==='egg'&&heal(1));log('PLAYER 1 のターン。1枚ドロー');render()}
function win(p){started=false;modal('勝敗','PLAYER '+(p+1)+' の勝利！',[['もう一度',()=>location.reload()]]);render()}function roll(){return Math.random()*6|0+1}function beginGame(){let a=Math.floor(Math.random()*6)+1,b=Math.floor(Math.random()*6)+1;if(a===b){modal('振り直し','同じ出目でした。',[['もう一度振る',beginGame]]);return}let first=a>b?0:1;modal('先攻決定','PLAYER 1：'+a+' / PLAYER 2：'+b,[['PLAYER '+(first+1)+' が先攻',()=>start(first)]])}function start(first){close();$('start').classList.add('hidden');started=true;deck=sh(pattern.slice());sh(deck);grave=[];hand=[[],[]];field=[[],[]];hp=[5,5];arrow=[1,1];use=[0,0];turn=first;turnNo=1;logs=[];draw(first);if(first===1)setTimeout(ai,450);else log('PLAYER 1 のターン。1枚ドロー');render()}$('begin').onclick=beginGame;$('end').onclick=endTurn;render();</script></body></html>
