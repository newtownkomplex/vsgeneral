<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;background:#05050a;color:#eee;font-family:monospace;touch-action:manipulation;-webkit-user-select:none;user-select:none}#app{width:min(720px,100%);min-height:100vh;margin:auto;background:#09090d;padding:10px}.title{text-align:center;padding:60px 8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}button,input{font:700 14px monospace}button{width:100%;min-height:58px;background:#07070a;color:#eee;border:2px solid #ddd;padding:9px;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(2px)}button:disabled{opacity:.45}input{width:100%;padding:12px;background:#07070a;color:#eee;border:2px solid #ddd;touch-action:manipulation}.box,.info{border:2px solid #ddd;background:#07070a;padding:10px;margin:7px 0}.stage{height:32px;border:2px solid #ddd;padding:6px;display:flex;justify-content:space-between}.message{border:2px solid #ddd;padding:12px;min-height:54px;margin-top:6px}.battle{border:2px solid #ddd;background:#17152e;position:relative;min-height:440px;overflow:hidden}.playerPanel{position:absolute;left:7px;top:7px;width:132px;border:2px solid #ddd;background:#05050ae8;padding:7px;z-index:3}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #555;padding:3px 0;font-size:10px}.enemy{position:absolute;left:50%;top:52%;transform:translate(-10%,-50%);width:290px;height:290px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;z-index:2}.enemyTag{position:absolute;right:7px;top:7px;border:2px solid #ddd;background:#05050ae8;padding:6px;z-index:3}.commandArea{position:relative;margin-top:6px}.commandOverlay{position:absolute;left:0;right:0;bottom:0;background:#09090d;border:2px solid #ddd;padding:7px;z-index:20}.detail{border:2px solid #777;padding:8px;min-height:62px;margin-bottom:6px;font-size:11px;line-height:1.5}.small{display:block;font-size:10px;font-weight:400;color:#bbb;margin-top:3px}.record{border:2px solid #777;padding:8px;margin:6px 0;font-size:10px}.hit-enemy{animation:enemyShake .28s steps(3)}.hit-player{animation:screenShake .28s steps(3)}@keyframes enemyShake{0%,100%{transform:translate(-10%,-50%)}25%{transform:translate(calc(-10% - 8px),calc(-50% + 2px))}50%{transform:translate(calc(-10% + 8px),calc(-50% - 2px))}75%{transform:translate(calc(-10% - 4px),calc(-50% + 1px))}}@keyframes screenShake{0%,100%{transform:translate(0)}25%{transform:translate(-7px,2px)}50%{transform:translate(7px,-2px)}75%{transform:translate(-4px,1px)}}</style><script>document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false});document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});</script></head><body><main id="app"></main><script>(function(){'use strict';var app=document.getElementById('app');var names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var spellDefs=[['影炎流',2,2,'影を炎へ変える。',false],['白燐',3,3,'光属性。闇属性に1.5倍。',true],['月鉛の棘',4,4,'重い棘を撃つ。',false],['虚無の眼',5,5,'虚無の視線。',false],['黒雨',6,6,'黒い雨を降らせる。',false],['黎明針',7,7,'光属性。闇属性に1.5倍。',true],['冥灯',8,8,'冥い灯火。',false],['白骸光',9,9,'光属性。闇属性に1.5倍。',true],['夜葬',10,10,'夜を凝縮する。',false],['灰界',12,12,'光属性。闇属性に1.5倍。',true]];var skillDefs=[['裂骨打',5,'2連攻撃。'],['影縫い',6,'次の敵攻撃を無効化し、攻撃力×1.5。'],['喉断ち',7,'攻撃力×1.7。'],['連環裂',8,'攻撃力×1.25を2連撃。'],['空葬',9,'次の敵攻撃を無効化し、攻撃力×1.5。'],['反転構え',10,'攻撃力×2。'],['硬化突き',11,'攻撃力×1.8。'],['瞬歩殺',12,'2連攻撃。'],['崩し刃',13,'攻撃力×2.2。'],['星砕き',14,'次の敵攻撃を無効化し、攻撃力×1.5。']];var P={name:'',stage:1,attack:6,magicAttack:6,hp:30,maxHp:30,speed:5,defence:2,critical:5,mp:20,maxMp:20,enemy:null,magic:[],skill:null};function title(){app.innerHTML='<div class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="grid2"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div></div>';document.getElementById('start').onclick=setup;document.getElementById('records').onclick=records}function setup(){app.innerHTML='<div class="title"><h2>ABILITY SET</h2><div class="box"><input id="playerName" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランス</p><div id="bal"></div><div class="grid2"><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定してスタート</button></div></div></div>';document.getElementById('shuffle').onclick=shuffle;document.getElementById('go').onclick=function(){var n=document.getElementById('playerName').value.trim();if(!n)return alert('プレイヤー名を入力してください。');P.name=n;P.stage=1;P.hp=P.maxHp=30;P.mp=P.maxMp=20;P.magic=[];P.skill=null;battle()};shuffle()}function shuffle(){P.attack=1+Math.floor(Math.random()*11);P.magicAttack=12-P.attack;document.getElementById('bal').innerHTML='<div class="grid2"><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div></div>'}function battle(){var n=P.stage;P.enemy={name:names[n-1],hp:12+n*3,maxHp:12+n*3,def:Math.floor(n/5),atk:2+Math.floor(n*.7),sprite:String(n).padStart(2,'0')};renderBattle(P.enemy.name+' が あらわれた！')}function renderBattle(msg){var e=P.enemy;app.innerHTML='<div class="stage"><span>STAGE '+P.stage+'/20</span><span>VOID MONSTER QUEST</span></div><div class="message">'+msg+'</div><div class="battle" id="battle"><div class="playerPanel"><b>'+P.name+'</b><div class="stat">HP <b>'+P.hp+'/'+P.maxHp+'</b></div><div class="stat">MP <b>'+P.mp+'/'+P.maxMp+'</b></div><div class="stat">ATK <b>'+P.attack+'</b></div><div class="stat">MAT <b>'+P.magicAttack+'</b></div><div class="stat">DEF <b>'+P.defence+'</b></div><div class="stat">SPD <b>'+P.speed+'</b></div><div class="stat">CRT <b>'+P.critical+'%</b></div></div><div class="enemyTag">'+e.name+'<br>HP '+e.hp+'/'+e.maxHp+'</div><img id="monster" class="enemy" src="assets/monsters/'+e.sprite+'.svg"></div><div id="commandArea" class="commandArea"><div id="commandGrid" class="grid2"><button id="attack">⚔ こうげき</button><button id="magic">◆ まほう</button><button id="skill">✦ スキル</button><button id="item">▣ アイテム</button></div></div>';document.getElementById('attack').onclick=attack;document.getElementById('magic').onclick=magicMenu;document.getElementById('skill').onclick=skillMenu;document.getElementById('item').onclick=item}function enemyShake(){var m=document.getElementById('monster');if(m){m.classList.remove('hit-enemy');void m.offsetWidth;m.classList.add('hit-enemy')}}function playerShake(){var b=document.getElementById('battle');if(b){b.classList.remove('hit-player');void b.offsetWidth;b.classList.add('hit-player')}}function damage(d){P.enemy.hp=Math.max(0,P.enemy.hp-d);enemyShake();if(P.enemy.hp<=0){setTimeout(function(){P.hp=P.maxHp;P.mp=P.maxMp;reward()},280);return}renderBattle(d+' ダメージ！');setTimeout(function(){var x=Math.max(1,P.enemy.atk-P.defence);P.hp=Math.max(0,P.hp-x);playerShake();setTimeout(function(){renderBattle(P.enemy.name+' の攻撃！ '+x+' ダメージ！')},280)},300)}function attack(){damage(Math.max(1,P.attack-P.enemy.def))}function makeSpell(i){var s=spellDefs[i%spellDefs.length];return{name:s[0],power:s[1]+Math.floor((P.stage-1)/3),cost:s[2],desc:s[3],light:s[4]}}function makeSkill(i){var s=skillDefs[i%skillDefs.length];return{name:s[0],cost:s[1],desc:s[2]}}function magicMenu(){if(!P.magic.length)P.magic.push(makeSpell(0));var buttons=P.magic.map(function(s,i){return '<button data-i="'+i+'">'+s.name+'<span class="small">MP '+s.cost+' / 威力 '+s.power+'</span></button>'}).join('');overlay('まほう',buttons,function(i){castSpell(P.magic[i])})}function skillMenu(){if(!P.skill)P.skill=makeSkill((P.stage-1)%skillDefs.length);var k=P.skill;overlay('スキル','<button data-skill="1">'+k.name+'<span class="small">MP '+k.cost+'<br>'+k.desc+'</span></button>',function(){useSkill(k)})}function overlay(title,buttons,use){var a=document.getElementById('commandArea'),g=document.getElementById('commandGrid');g.style.visibility='hidden';var o=document.createElement('div');o.className='commandOverlay';o.innerHTML='<b>'+title+'</b><div id="detail" class="detail">1回タップ：説明・威力表示<br>2回タップ：使用</div><div class="grid2">'+buttons+'</div><button id="close">▶ 戻る</button>';a.appendChild(o);o.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var i=+b.dataset.i;if(b.dataset.selected){use(i);return}b.dataset.selected='1';var s=P.magic[i];document.getElementById('detail').innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 '+s.power+(s.light?' / 光属性':'')+'<br>'+s.desc+'<br>もう一度タップで使用'}});var sb=o.querySelector('[data-skill]');if(sb)sb.onclick=function(){if(sb.dataset.selected){use();return}sb.dataset.selected='1';var k=P.skill;document.getElementById('detail').innerHTML='<b>'+k.name+'</b><br>MP '+k.cost+'<br>'+k.desc+'<br>もう一度タップで使用'};document.getElementById('close').onclick=function(){o.remove();g.style.visibility='visible'}}function castSpell(s){if(P.mp<s.cost)return alert('MPが足りない。');P.mp-=s.cost;var d=P.magicAttack*s.power;if(s.light&&P.stage%2===0)d=Math.floor(d*1.5);damage(d)}function useSkill(k){if(P.mp<k.cost)return alert('MPが足りない。');P.mp-=k.cost;var d;if(k.name==='裂骨打'||k.name==='瞬歩殺')d=Math.max(1,P.attack-P.enemy.def)*2;else if(k.desc.indexOf('無効化')>=0){d=Math.max(1,Math.floor(P.attack*1.5)-P.enemy.def);P.guard=true}else{var m=(k.desc.match(/×([0-9.]+)/)||[])[1]||1;d=Math.max(1,Math.floor(P.attack*parseFloat(m))-P.enemy.def)}damage(d)}function item(){P.hp=Math.min(P.maxHp,P.hp+10);renderBattle('アイテムでHPが10回復した。')}function reward(){var n=P.stage*P.stage;P.maxHp+=n;P.hp=P.maxHp;P.speed+=n;P.defence+=n;P.critical+=n;P.attack+=n;P.magicAttack+=n;P.maxMp+=n;P.mp=P.maxMp;var newSpell=makeSpell(P.stage-1),newSkill=makeSkill(P.stage-1);app.innerHTML='<h2>戦闘終了</h2><div class="info">HP・MPが全回復した。<br>全ステータス <b>+'+n+'</b> を自動反映。</div><div class="info"><b>新しい魔法</b><br>'+newSpell.name+'　MP '+newSpell.cost+' / 威力 '+newSpell.power+'<br>'+newSpell.desc+'</div><div class="info"><b>新しいスキル</b><br>'+newSkill.name+'　MP '+newSkill.cost+'<br>'+newSkill.desc+'</div><div class="grid2"><button id="magicGet">◆ 魔法を獲得</button><button id="skillGet">✦ スキルを獲得</button></div><button id="next" disabled>▶ 次の戦闘へ</button>';var gotM=false,gotS=false;document.getElementById('magicGet').onclick=function(){if(P.magic.length<4){P.magic.push(newSpell);gotM=true;this.textContent='✓ 魔法を獲得';check()}else{replaceMagic(newSpell,function(){gotM=true;check()})}};document.getElementById('skillGet').onclick=function(){if(!P.skill){P.skill=newSkill;gotS=true;this.textContent='✓ スキルを獲得';check()}else{replaceSkill(newSkill,function(){gotS=true;check()})}};function check(){if(gotM&&gotS){document.getElementById('next').disabled=false}}document.getElementById('next').onclick=function(){if(P.stage>=20){title()}else{P.stage++;battle()}}}function replaceMagic(s,done){app.innerHTML='<h2>魔法を入れ替える</h2><div class="info">新しい魔法：<b>'+s.name+'</b><br>残す魔法を選択してください。</div><div class="grid2">'+P.magic.map(function(x,i){return '<button data-i="'+i+'">'+x.name+'<span class="small">MP '+x.cost+' / 威力 '+x.power+'</span></button>'}).join('')+'</div>';app.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){P.magic[+b.dataset.i]=s;rewardReturn(done)}})}function replaceSkill(s,done){app.innerHTML='<h2>スキルを入れ替える</h2><div class="info">新しいスキル：<b>'+s.name+'</b><br>現在のスキルと入れ替える場合は選択してください。</div><div class="grid2"><button id="yes">▶ 入れ替える</button><button id="no">▶ 入れ替えない</button></div>';document.getElementById('yes').onclick=function(){P.skill=s;rewardReturn(done)};document.getElementById('no').onclick=function(){rewardReturn(done)}}function rewardReturn(done){done();reward()}function records(){app.innerHTML='<h2>これまでの記録</h2><p>記録は端末内に保存されます。</p><button id="back">▶ 戻る</button>';document.getElementById('back').onclick=title}title()})();</script></body></html>
