<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;background:#05050a;color:#eee;font-family:monospace}#app{width:min(720px,100%);min-height:100vh;margin:auto;background:#09090d;padding:10px}button,input{font:700 14px monospace}button{width:100%;min-height:58px;background:#07070a;color:#eee;border:2px solid #ddd;padding:9px;cursor:pointer}button:active{transform:translateY(2px)}input{width:100%;padding:12px;background:#07070a;color:#eee;border:2px solid #ddd}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.box,.info{border:2px solid #ddd;background:#07070a;padding:10px;margin:7px 0}.title{text-align:center;padding:60px 8px}.stage{height:32px;border:2px solid #ddd;padding:6px;background:#05050a;display:flex;justify-content:space-between}.message{border:2px solid #ddd;background:#05050a;padding:12px;min-height:54px;margin-top:6px}.battle{border:2px solid #ddd;background:radial-gradient(circle at 75% 45%,#312a58 0,#17152e 28%,#0b0c19 67%,#05050b 100%);position:relative;min-height:440px;overflow:hidden}.playerPanel{position:absolute;left:7px;top:7px;width:132px;border:2px solid #ddd;background:#05050ae8;padding:7px;z-index:3}.playerPanel b{font-size:12px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #555;padding:3px 0;font-size:10px}.playerSprite{height:115px;position:relative}.hood{position:absolute;left:43px;top:8px;width:43px;height:45px;background:#20202b;border:5px solid #d5a628;border-radius:45% 45% 25% 25%}.body{position:absolute;left:35px;top:47px;width:60px;height:55px;background:#15151c;border:5px solid #d5a628}.sword{position:absolute;left:22px;top:30px;width:9px;height:75px;background:#ddd;transform:rotate(25deg);border:2px solid #555}.shield{position:absolute;right:17px;top:58px;width:24px;height:30px;background:#182d63;border:3px solid #d5a628;border-radius:5px}.enemy{position:absolute;left:50%;top:52%;transform:translate(-10%,-50%);width:290px;height:290px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;z-index:2}.enemyTag{position:absolute;right:7px;top:7px;border:2px solid #ddd;background:#05050ae8;padding:6px;z-index:3}.commandArea{position:relative;margin-top:6px}.commandOverlay{position:absolute;left:0;right:0;bottom:0;background:#09090d;border:2px solid #ddd;padding:7px;z-index:20;box-shadow:0 -8px 18px #000}.detail{border:2px solid #777;padding:8px;min-height:62px;margin-bottom:6px;font-size:11px;line-height:1.5}.small{display:block;font-size:10px;font-weight:400;color:#bbb;margin-top:3px}.selected{background:#eee;color:#07070a}.record{border:2px solid #777;padding:8px;margin:6px 0;font-size:10px;line-height:1.55}.hit-enemy{animation:enemyShake .28s steps(3)}.hit-player{animation:screenShake .28s steps(3)}@keyframes enemyShake{0%,100%{transform:translate(-10%,-50%)}25%{transform:translate(calc(-10% - 8px),calc(-50% + 2px))}50%{transform:translate(calc(-10% + 8px),calc(-50% - 2px))}75%{transform:translate(calc(-10% - 4px),calc(-50% + 1px))}}@keyframes screenShake{0%,100%{transform:translate(0)}25%{transform:translate(-7px,2px)}50%{transform:translate(7px,-2px)}75%{transform:translate(-4px,1px)}}</style></head><body><main id="app"></main><script>(function(){'use strict';var app=document.getElementById('app');var names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var spells=[['影炎流',2,0,'影を炎へ変える。'],['白燐',3,1,'光属性。闇属性に1.5倍。'],['月鉛の棘',4,0,'重い棘を撃つ。'],['虚無の眼',5,0,'虚無の視線。'],['黒雨',6,0,'黒い雨を降らせる。'],['黎明針',7,1,'光属性。闇属性に1.5倍。']];var skills=[['裂骨打',5,'double',1,'攻撃力依存の2連攻撃。'],['影縫い',6,'guard',1.5,'次の敵攻撃を無効化し、攻撃力×1.5。'],['喉断ち',7,'power',1.7,'攻撃力×1.7。']];var P={name:'',stage:1,attack:6,magicAttack:6,hp:30,maxHp:30,speed:5,defence:2,critical:5,mp:20,maxMp:20,magic:[],skill:null,enemy:null,guard:false,potions:3};function title(){app.innerHTML='<div class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="grid2"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div></div>';start.onclick=setup;records.onclick=showRecords}function setup(){app.innerHTML='<div class="title"><h2>ABILITY SET</h2><div class="box"><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランス</p><div id="bal"></div><div class="grid2"><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定してスタート</button></div></div></div>';shuffle.onclick=shuffle;go.onclick=function(){if(!name.value.trim()){alert('プレイヤー名を入力してください。');return}P.name=name.value.trim();P.stage=1;P.hp=P.maxHp=30;P.magic=[];P.skill=null;P.mp=P.maxMp=20;battle()};shuffle()}function shuffle(){P.attack=1+Math.floor(Math.random()*11);P.magicAttack=12-P.attack;if(bal)bal.innerHTML='<div class="grid2"><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div></div>'}function battle(){var n=P.stage,boss=n%5===0,base=12+n*3+(boss?n*5:0);P.enemy={name:names[n-1],boss:boss,shadow:n%2===0,hp:base,maxHp:base,atk:2+Math.floor(n*.7)+(boss?4:0),def:Math.floor(n/5)+(boss?3:0),sprite:String(n).padStart(2,'0')};renderBattle((boss?'★ 強敵 ★ ':'')+P.enemy.name+' が あらわれた！')}function stats(){return '<div class="stat">HP <b>'+P.hp+'/'+P.maxHp+'</b></div><div class="stat">MP <b>'+P.mp+'/'+P.maxMp+'</b></div><div class="stat">ATK <b>'+P.attack+'</b></div><div class="stat">MAT <b>'+P.magicAttack+'</b></div><div class="stat">DEF <b>'+P.defence+'</b></div><div class="stat">SPD <b>'+P.speed+'</b></div><div class="stat">CRT <b>'+P.critical+'%</b></div>'}function renderBattle(msg){var e=P.enemy;app.innerHTML='<div class="stage"><span>STAGE '+P.stage+'/20</span><span>VOID MONSTER QUEST</span></div><div class="message">'+msg+'</div><div class="battle" id="battle"><div class="playerPanel"><b>'+P.name+'</b><div class="playerSprite"><div class="sword"></div><div class="hood"></div><div class="body"></div><div class="shield"></div></div>'+stats()+'</div><div class="enemyTag">'+e.name+'<br>HP '+e.hp+'/'+e.maxHp+'</div><img id="monster" class="enemy" src="assets/monsters/'+e.sprite+'.svg"></div><div id="commandArea" class="commandArea"><div id="commandGrid" class="grid2"><button id="attack">⚔ こうげき</button><button id="magic">◆ まほう</button><button id="skill">✦ スキル</button><button id="item">▣ アイテム</button></div></div>';attack.onclick=doAttack;magic.onclick=magicMenu;skill.onclick=skillMenu;item.onclick=useItem}function enemyHitAnimation(){var m=document.getElementById('monster');if(!m)return;m.classList.remove('hit-enemy');void m.offsetWidth;m.classList.add('hit-enemy')}function playerHitAnimation(){var b=document.getElementById('battle');if(!b)return;b.classList.remove('hit-player');void b.offsetWidth;b.classList.add('hit-player')}function damageEnemy(d){P.enemy.hp=Math.max(0,P.enemy.hp-d);enemyHitAnimation()}function enemyTurn(){if(P.guard){P.guard=false;return 0}var d=Math.max(1,P.enemy.atk-P.defence);P.hp=Math.max(0,P.hp-d);playerHitAnimation();return d}function afterPlayerAction(msg){setTimeout(function(){if(P.enemy.hp<=0){rewardScreen();return}renderBattle(msg);setTimeout(function(){var d=enemyTurn();setTimeout(function(){if(P.hp<=0){finish(false);return}renderBattle(P.enemy.name+' の攻撃！ '+d+' ダメージ！')},280)},20)},280)}function doAttack(){var d=Math.max(1,P.attack-P.enemy.def);if(Math.random()*100<P.critical)d*=2;damageEnemy(d);afterPlayerAction('こうげき！ '+d+' ダメージ！')}function useItem(){if(P.potions<=0){renderBattle('回復薬がない。');return}P.potions--;P.hp=Math.min(P.maxHp,P.hp+10);afterPlayerAction('回復薬でHPが10回復した。')}function openOverlay(t,d,buttons){var a=document.getElementById('commandArea'),g=document.getElementById('commandGrid');g.style.visibility='hidden';var o=document.createElement('div');o.id='commandOverlay';o.className='commandOverlay';o.innerHTML='<b>'+t+'</b><div id="detail" class="detail">'+d+'</div><div class="grid2">'+buttons+'</div><button id="close">▶ 戻る</button>';a.appendChild(o);close.onclick=function(){o.remove();g.style.visibility='visible'}}function magicMenu(){if(!P.magic.length)P.magic.push({name:'影炎流',power:2,cost:2,light:false,desc:'影を炎へ変える。'});var selected=null;openOverlay('まほう','1回タップ：説明・威力表示／2回タップ：使用',P.magic.map(function(s,i){return '<button data-m="'+i+'">'+s.name+'<span class="small">MP '+s.cost+'</span></button>'}).join(''));document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){var s=P.magic[+b.dataset.m];if(selected===s){close.click();var d=P.magicAttack*s.power;P.mp-=s.cost;damageEnemy(d);afterPlayerAction(s.name+'！ '+d+' ダメージ！');return}selected=s;detail.innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 '+s.power+'<br>'+s.desc+'<br>もう一度タップで使用';b.classList.add('selected')}})}function skillMenu(){var s=P.skill||{name:'裂骨打',cost:5,kind:'double',mult:1,desc:'攻撃力依存の2連攻撃。'};P.skill=s;var selected=false;openOverlay('スキル','1回タップ：説明・威力表示／2回タップ：使用','<button id="sk">'+s.name+'<span class="small">MP '+s.cost+'</span></button>');sk.onclick=function(){if(selected){close.click();P.mp-=s.cost;var d=Math.max(1,P.attack-P.enemy.def)*2;damageEnemy(d);afterPlayerAction(s.name+'！ '+d+' ダメージ！');return}selected=true;detail.innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 攻撃力×1を2回<br>'+s.desc+'<br>もう一度タップで使用';sk.classList.add('selected')}}function rewardScreen(){P.hp=P.maxHp;P.mp=P.maxMp;app.innerHTML='<h2>戦闘終了</h2><div class="info"><b>'+P.enemy.name+'を倒した！</b><br>HP・MPが全回復した。</div><div class="grid2"><button id="up">全ステータス +'+P.stage+'</button><button id="next">次の戦闘へ</button></div>';up.onclick=function(){var n=P.stage;P.maxHp+=n;P.hp=P.maxHp;P.speed+=n;P.defence+=n;P.critical+=n;P.attack+=n;P.magicAttack+=n;P.maxMp+=n;P.mp=P.maxMp;rewardScreen()};next.onclick=function(){if(P.stage>=20)finish(true);else{P.stage++;battle()}}}function finish(clear){app.innerHTML='<div class="title"><h1>'+ (clear?'CLEAR':'失格')+'</h1><div class="info">到達戦：'+P.stage+'</div><button id="home">▶ タイトルへ</button></div>';home.onclick=title}function showRecords(){app.innerHTML='<h2>これまでの記録</h2><p>記録画面</p><button id="back">▶ 戻る</button>';back.onclick=title}title()})();</script></body></html>
