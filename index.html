<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;background:#05050a;color:#eee;font-family:monospace}#app{width:min(720px,100%);min-height:100vh;margin:auto;background:#09090d;padding:10px}button,input{font:700 14px monospace}button{width:100%;min-height:58px;background:#07070a;color:#eee;border:2px solid #ddd;padding:9px;cursor:pointer}button:active{transform:translateY(2px)}input{width:100%;padding:12px;background:#07070a;color:#eee;border:2px solid #ddd}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.box,.info{border:2px solid #ddd;background:#07070a;padding:10px;margin:7px 0}.small{display:block;font-size:10px;font-weight:400;color:#bbb;line-height:1.45;margin-top:3px}.title{text-align:center;padding:60px 8px}.battle{border:2px solid #ddd;background:radial-gradient(circle at 75% 45%,#312a58 0,#17152e 28%,#0b0c19 67%,#05050b 100%);position:relative;min-height:440px;overflow:hidden}.battle:before,.battle:after{content:'';position:absolute;bottom:0;width:100px;height:130px;background:#15152a;opacity:.8;clip-path:polygon(0 100%,0 55%,15% 42%,24% 63%,34% 28%,46% 58%,55% 15%,66% 48%,76% 30%,87% 62%,100% 44%,100% 100%)}.battle:before{left:0}.battle:after{right:0;transform:scaleX(-1)}.stage{height:32px;border:2px solid #ddd;padding:6px;background:#05050a;display:flex;justify-content:space-between}.message{border:2px solid #ddd;background:#05050a;padding:12px;min-height:54px;margin-top:6px;font-size:13px}.playerPanel{position:absolute;left:7px;top:48px;width:132px;border:2px solid #ddd;background:#05050ae8;padding:7px;z-index:3}.playerPanel b{font-size:12px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #555;padding:3px 0;font-size:10px}.playerSprite{height:115px;position:relative;margin:3px auto}.hood{position:absolute;left:43px;top:8px;width:43px;height:45px;background:#20202b;border:5px solid #d5a628;border-radius:45% 45% 25% 25%}.body{position:absolute;left:35px;top:47px;width:60px;height:55px;background:#15151c;border:5px solid #d5a628}.sword{position:absolute;left:22px;top:30px;width:9px;height:75px;background:#ddd;transform:rotate(25deg);border:2px solid #555}.shield{position:absolute;right:17px;top:58px;width:24px;height:30px;background:#182d63;border:3px solid #d5a628;border-radius:5px}.enemy{position:absolute;left:50%;top:52%;transform:translate(-10%,-50%);width:290px;height:290px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;z-index:2}.enemyTag{position:absolute;right:7px;top:48px;border:2px solid #ddd;background:#05050ae8;padding:6px;z-index:3}.commands{margin-top:6px}.commandArea{position:relative}.commandOverlay{position:absolute;left:0;right:0;bottom:0;background:#09090d;border:2px solid #ddd;padding:7px;z-index:20;box-shadow:0 -8px 18px #000}.detail{border:2px solid #777;padding:8px;min-height:62px;margin-bottom:6px;font-size:11px;line-height:1.5}.selected{background:#eee;color:#07070a}.reward{text-align:center}.shake{animation:shake .28s steps(3)}.flash{animation:flash .28s steps(3)}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-7px,2px)}50%{transform:translate(7px,-2px)}75%{transform:translate(-4px,1px)}}@keyframes flash{0%,100%{filter:none}25%{filter:brightness(2)}50%{filter:brightness(.35)}75%{filter:brightness(1.8)}}.record{border:2px solid #777;padding:8px;margin:6px 0;font-size:10px;line-height:1.55}</style></head><body><main id="app"></main><script>(function(){'use strict';var app=document.getElementById('app');var names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];var spellDefs=[['影炎流',2,false,'影を炎へ変える。'],['白燐',3,true,'光属性。闇属性に1.5倍。'],['月鉛の棘',4,false,'重い棘を撃つ。'],['虚無の眼',5,false,'虚無の視線。'],['黒雨',6,false,'黒い雨を降らせる。'],['黎明針',7,true,'光属性。闇属性に1.5倍。'],['冥灯',8,false,'冥い灯火。'],['白骸光',9,true,'光属性。闇属性に1.5倍。'],['夜葬',10,false,'夜を凝縮する。'],['灰界',12,true,'光属性。闇属性に1.5倍。']];var skillDefs=[['裂骨打',5,'double','攻撃力依存の2連攻撃。'],['影縫い',6,'guard','次の敵攻撃を無効化し、攻撃力×1.5。'],['喉断ち',7,'power',1.7,'攻撃力×1.7。'],['連環裂',8,'doublePower',1.25,'攻撃力×1.25を2連撃。'],['空葬',9,'guard','次の敵攻撃を無効化し、攻撃力×1.5。'],['反転構え',10,'power',2,'攻撃力×2。'],['硬化突き',11,'power',1.8,'攻撃力×1.8。'],['瞬歩殺',12,'double','攻撃力依存の2連攻撃。'],['崩し刃',13,'power',2.2,'攻撃力×2.2。'],['星砕き',14,'guard','次の敵攻撃を無効化し、攻撃力×1.5。']];var P={name:'',stage:1,attack:6,magicAttack:6,hp:30,maxHp:30,speed:5,defence:2,critical:5,mp:20,maxMp:20,magic:[],skill:null,enemy:null,guard:false,potions:3};function title(){app.innerHTML='<div class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="grid2"><button id="start">▶ ぼうけんを はじめる</button><button id="records">▶ これまでの記録</button></div></div>';document.getElementById('start').onclick=setup;document.getElementById('records').onclick=records}function setup(){app.innerHTML='<div class="title"><h2>ABILITY SET</h2><div class="box"><input id="name" maxlength="12" placeholder="プレイヤー名を入力"><p>攻撃と魔力のバランス</p><div id="bal"></div><div class="grid2"><button id="shuffle">▶ シャッフル</button><button id="go">▶ 確定してスタート</button></div></div></div>';shuffle();document.getElementById('shuffle').onclick=shuffle;document.getElementById('go').onclick=function(){var n=document.getElementById('name').value.trim();if(!n){alert('プレイヤー名を入力してください。');return}P.name=n;P.stage=1;P.hp=P.maxHp=30;P.speed=5;P.defence=2;P.critical=5;P.mp=P.maxMp=20;P.magic=[];P.skill=null;P.potions=3;battle()}}function shuffle(){P.attack=1+Math.floor(Math.random()*11);P.magicAttack=12-P.attack;var b=document.getElementById('bal');if(b)b.innerHTML='<div class="grid2"><div class="stat">ATTACK <b>'+P.attack+'</b></div><div class="stat">MAGIC ATTACK <b>'+P.magicAttack+'</b></div></div>'}function makeMagic(i){var d=spellDefs[i%spellDefs.length];return{name:d[0],power:d[1]+Math.floor((P.stage-1)/3),light:d[2],desc:d[3],cost:2+Math.floor(P.stage/4)}}function makeSkill(i){var d=skillDefs[i%skillDefs.length];return{name:d[0],cost:d[1],kind:d[2],mult:typeof d[3]==='number'?d[3]:null,desc:typeof d[3]==='string'?d[3]:d[4]}}function battle(){var n=P.stage,boss=n%5===0,base=12+n*3+(boss?n*5:0);P.enemy={name:names[n-1],boss:boss,shadow:n%2===0,hp:base,maxHp:base,atk:2+Math.floor(n*.7)+(boss?4:0),def:Math.floor(n/5)+(boss?3:0),sprite:String(n).padStart(2,'0')};renderBattle((boss?'★ 強敵 ★ ':'')+P.enemy.name+' が あらわれた！')}function statHTML(){return '<div class="stat">HP <b>'+P.hp+'/'+P.maxHp+'</b></div><div class="stat">MP <b>'+P.mp+'/'+P.maxMp+'</b></div><div class="stat">ATK <b>'+P.attack+'</b></div><div class="stat">MAT <b>'+P.magicAttack+'</b></div><div class="stat">DEF <b>'+P.defence+'</b></div><div class="stat">SPD <b>'+P.speed+'</b></div><div class="stat">CRT <b>'+P.critical+'%</b></div>'}function renderBattle(msg){var e=P.enemy;app.innerHTML='<div class="stage"><span>STAGE '+P.stage+'/20</span><span>VOID MONSTER QUEST</span></div><div class="message">'+msg+'</div><div class="battle" id="battle"><div class="playerPanel"><b>'+P.name+'</b><div class="playerSprite"><div class="sword"></div><div class="hood"></div><div class="body"></div><div class="shield"></div></div>'+statHTML()+'</div><div class="enemyTag">'+e.name+'<br>HP '+e.hp+'/'+e.maxHp+(e.boss?'<br>★ 強敵 ★':'')+'</div><img id="monster" class="enemy" src="assets/monsters/'+e.sprite+'.svg" alt="'+e.name+'"></div><div id="commandArea" class="commandArea"><div id="commandGrid" class="grid2 commands"><button id="attack">⚔ こうげき</button><button id="magic">◆ まほう</button><button id="skill">✦ スキル</button><button id="item">▣ アイテム</button></div></div>';document.getElementById('attack').onclick=attack;document.getElementById('magic').onclick=magicMenu;document.getElementById('skill').onclick=skillMenu;document.getElementById('item').onclick=item}function playerHit(d){P.enemy.hp=Math.max(0,P.enemy.hp-d);var m=document.getElementById('monster');if(m){m.classList.remove('shake','flash');void m.offsetWidth;m.classList.add('shake','flash')}}function enemyTurn(){if(P.guard){P.guard=false;return 0}var d=Math.max(1,P.enemy.atk-P.defence);P.hp=Math.max(0,P.hp-d);var b=document.getElementById('battle');if(b){b.classList.remove('shake','flash');void b.offsetWidth;b.classList.add('shake','flash')}return d}function afterAction(msg){if(P.enemy.hp<=0){setTimeout(rewardScreen,280);return}renderBattle(msg);setTimeout(function(){var d=enemyTurn();if(P.hp<=0){setTimeout(function(){finish(false)},280);return}renderBattle(P.enemy.name+' の攻撃！ '+d+' ダメージ！')},300)}function attack(){var d=Math.max(1,P.attack-P.enemy.def);if(Math.random()*100<P.critical)d*=2;playerHit(d);afterAction('こうげき！ '+d+' ダメージ！')}function item(){if(P.potions<=0){alert('回復薬がない。');return}P.potions--;P.hp=Math.min(P.maxHp,P.hp+10);afterAction('回復薬でHPが10回復した。')}function closeOverlay(){var o=document.getElementById('commandOverlay');if(o)o.remove();var g=document.getElementById('commandGrid');if(g)g.style.visibility='visible'}function openOverlay(t,d,buttons){closeOverlay();var a=document.getElementById('commandArea'),g=document.getElementById('commandGrid');g.style.visibility='hidden';var o=document.createElement('div');o.id='commandOverlay';o.className='commandOverlay';o.innerHTML='<div><b>'+t+'</b></div><div id="detail" class="detail">'+d+'</div><div class="grid2">'+buttons+'</div><button id="close">▶ 戻る</button>';a.appendChild(o);document.getElementById('close').onclick=closeOverlay}function magicMenu(){if(!P.magic.length)P.magic.push(makeMagic(0));var selected=null;openOverlay('まほう','1回タップ：説明・威力表示／2回タップ：使用',P.magic.map(function(s,i){return '<button data-m="'+i+'">'+s.name+'<span class="small">MP '+s.cost+'</span></button>'}).join(''));document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){var s=P.magic[+b.dataset.m];if(selected===s){closeOverlay();castMagic(s);return}selected=s;document.getElementById('detail').innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 '+s.power+(s.light?' / 光属性':'')+'<br>'+s.desc+'<br>もう一度タップで使用';b.classList.add('selected')}})}function castMagic(s){if(P.mp<s.cost){document.getElementById('detail').innerHTML+='\<br>MPが足りない。';return}P.mp-=s.cost;var d=P.magicAttack*s.power;if(s.light&&P.enemy.shadow)d=Math.floor(d*1.5);playerHit(d);afterAction(s.name+'！ '+d+' ダメージ！')}function skillMenu(){var s=P.skill||makeSkill((P.stage-1)%skillDefs.length);P.skill=s;var selected=false;openOverlay('スキル','1回タップ：説明・威力表示／2回タップ：使用','<button id="sk">'+s.name+'<span class="small">MP '+s.cost+'</span></button>');document.getElementById('sk').onclick=function(){if(selected){closeOverlay();useSkill(s);return}selected=true;var p=s.kind==='double'?'攻撃力×1を2回':s.kind==='guard'?'攻撃力×1.5＋次の攻撃無効':s.mult?'攻撃力×'+s.mult:'攻撃';document.getElementById('detail').innerHTML='<b>'+s.name+'</b><br>MP '+s.cost+' / 威力 '+p+'<br>'+s.desc+'<br>もう一度タップで使用';this.classList.add('selected')}}function useSkill(s){if(P.mp<s.cost){renderBattle('MPが足りない。');return}P.mp-=s.cost;var d;if(s.kind==='double')d=Math.max(1,P.attack-P.enemy.def)*2;else if(s.kind==='guard'){d=Math.max(1,Math.floor(P.attack*1.5)-P.enemy.def);P.guard=true}else if(s.kind==='doublePower')d=Math.max(1,Math.floor(P.attack*s.mult)-P.enemy.def)*2;else d=Math.max(1,Math.floor(P.attack*s.mult)-P.enemy.def);playerHit(d);afterAction(s.name+'！ '+d+' ダメージ！')}function rewardScreen(){var n=P.stage,m=makeMagic(n-1),s=makeSkill(n-1);P.hp=P.maxHp;P.mp=P.maxMp;app.innerHTML='<div class="stage"><span>STAGE '+n+' CLEAR</span><span>REWARD</span></div><div class="reward box"><h2>戦闘終了</h2><p>'+P.enemy.name+'を倒した！</p><p>HP・MP全回復</p><div class="grid2"><button id="gm">◆ 魔法<br><span class="small">'+m.name+' / 威力 '+m.power+' / MP '+m.cost+'</span></button><button id="gs">◆ スキル<br><span class="small">'+s.name+' / MP '+s.cost+'</span></button><button id="lv">◆ 成長<br><span class="small">全ステータス +'+n+'</span></button><button id="nx">◆ 次へ</button></div></div>';document.getElementById('gm').onclick=function(){if(P.magic.length<4)P.magic.push(m);rewardScreen()};document.getElementById('gs').onclick=function(){P.skill=s;rewardScreen()};document.getElementById('lv').onclick=function(){levelUp(n);rewardScreen()};document.getElementById('nx').onclick=function(){if(n>=20)finish(true);else{P.stage++;battle()}}}function levelUp(n){P.maxHp+=n;P.hp=P.maxHp;P.speed+=n;P.defence+=n;P.critical+=n;P.attack+=n;P.magicAttack+=n;P.maxMp+=n;P.mp=P.maxMp}function finish(clear){var r={name:P.name,result:clear?'CLEAR':'失格',stage:P.stage,magic:P.magic.map(function(x){return x.name}),skill:P.skill?P.skill.name:'なし',stats:{hp:P.hp,speed:P.speed,defence:P.defence,critical:P.critical,attack:P.attack,magicAttack:P.magicAttack}};app.innerHTML='<div class="title"><h1>'+r.result+'</h1><div class="info">到達戦：'+r.stage+'<br>記録に残しますか？</div><div class="grid2"><button id="save">記録する</button><button id="no">記録しない</button></div></div>';document.getElementById('save').onclick=function(){var a=JSON.parse(localStorage.getItem('vmqRecords')||'[]');a.push(r);localStorage.setItem('vmqRecords',JSON.stringify(a));title()};document.getElementById('no').onclick=title}function records(){var r=JSON.parse(localStorage.getItem('vmqRecords')||'[]');app.innerHTML='<h2>これまでの記録</h2>'+(r.length?r.map(function(x){return '<div class="record"><b>'+x.name+'</b> '+x.result+'<br>到達戦 '+x.stage+'<br>魔法 '+x.magic.join(' / ')+'<br>スキル '+x.skill+'<br>HP '+x.stats.hp+' / SPEED '+x.stats.speed+' / DEFENCE '+x.stats.defence+' / CRITICAL '+x.stats.critical+' / ATTACK '+x.stats.attack+' / MAGIC ATTACK '+x.stats.magicAttack+'</div>'}).join(''):'<p>まだ記録はありません。</p>')+'<button id="back">▶ 戻る</button>';document.getElementById('back').onclick=title}title()})();</script></body></html>
