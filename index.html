<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DOT MONSTER QUEST</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#11131a;color:#f4f0dc;font-family:"Courier New",monospace}body{display:flex;justify-content:center}.game{width:min(100vw,620px);min-height:100vh;background:#171a22;display:flex;flex-direction:column;border-left:4px solid #303443;border-right:4px solid #303443}.top{padding:10px 12px;border-bottom:4px solid #303443;background:#202430;text-align:center;font-weight:900;letter-spacing:2px}.screen{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}.scene{position:relative;height:285px;border:4px solid #ddd5b5;background:#697d54;overflow:hidden;image-rendering:pixelated}.scene:before,.scene:after{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(20,35,24,.15) 50%,transparent 50%),linear-gradient(rgba(20,35,24,.15) 50%,transparent 50%);background-size:12px 12px;opacity:.45}.scene:after{background-size:36px 36px;opacity:.18}.enemy-name{position:absolute;left:12px;top:10px;z-index:2;background:#111722;border:3px solid #eee7c7;padding:5px 8px;font-size:14px}.enemy-hp{position:absolute;right:12px;top:10px;z-index:2;background:#111722;border:3px solid #eee7c7;padding:5px 8px;font-size:12px}.sprite{position:absolute;z-index:2;left:50%;top:54%;transform:translate(-50%,-50%);width:192px;height:192px;image-rendering:pixelated}.sprite canvas{width:100%;height:100%;image-rendering:pixelated}.status{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.stat{background:#202430;border:3px solid #4a5060;padding:5px 2px;text-align:center;font-size:10px}.stat b{display:block;font-size:13px;margin-top:3px}.box{background:#111722;border:4px solid #e8e0bd;padding:10px;line-height:1.5}.message{min-height:72px;font-size:13px}.commands{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cmd{background:#242a37;color:#f4f0dc;border:3px solid #666d7d;padding:12px 8px;text-align:left;font:700 14px "Courier New",monospace;min-height:48px}.cmd:active{transform:translate(2px,2px)}.cmd:disabled{opacity:.35}.panel{display:none}.panel.open{display:block}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{background:#252b38;border:3px solid #6d7380;color:#f4f0dc;padding:10px 7px;text-align:left;font:700 12px "Courier New",monospace}.choice small{display:block;color:#b9b5a2;margin-top:4px;font-size:10px}.overlay{position:fixed;inset:0;background:rgba(8,9,12,.9);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{width:min(520px,100%);background:#171b25;border:5px solid #eee7c7;padding:18px}.modal h1,.modal h2{margin:0 0 12px;font-size:20px}.modal p{font-size:12px;line-height:1.7;color:#d0ccb8}.modal button{width:100%;margin-top:7px;background:#29303d;border:3px solid #7b8290;color:#fff;padding:12px;font:700 13px "Courier New",monospace}.hidden{display:none!important}.reward{display:grid;gap:6px;margin-top:10px}.reward button{margin:0}.tag{color:#9fd39a}.footer{padding:7px 10px;color:#858b99;font-size:9px;text-align:center;border-top:3px solid #303443}
</style>
</head>
<body>
<div class="game">
<header class="top">DOT MONSTER QUEST</header>
<main class="screen">
<section class="scene"><div class="enemy-name" id="enemyName">スライム</div><div class="enemy-hp" id="enemyHp">HP 12 / 12</div><div class="sprite"><canvas id="sprite" width="32" height="32"></canvas></div></section>
<section class="status" id="stats"></section>
<section class="box message" id="message">モンスターが あらわれた！</section>
<section class="commands" id="commands"><button class="cmd" data-cmd="attack">▶ こうげき</button><button class="cmd" data-cmd="magic">▶ まほう</button><button class="cmd" data-cmd="skill">▶ スキル</button><button class="cmd" data-cmd="item">▶ アイテム</button></section>
<section class="panel" id="panel"></section>
</main>
<footer class="footer">NO TIME LIMIT / TURN BATTLE / DOT ART</footer>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
const $=id=>document.getElementById(id);
const monsters=[
{name:'スライム',hp:12,atk:3,def:1,spd:4,crit:4,reward:{hp:3,speed:1,defence:1,critical:0,magicattack:0},magic:{name:'メラ',power:7},skill:{name:'れんぞくぎり',power:5,bonus:'attackTwice'},pattern:['00000000000000000000000000000000','00000000000011111100000000000000','00000000001112222110000000000000','00000000111222222211100000000000','00000001112222222222110000000000','00000011122222222222211100000000','00000111222222222222221110000000','00001112222222222222222111000000','00001112222222222222222211100000','00011122222222222222222221110000','00011122222222222222222221110000','00111222222222222222222222111000','00111222222222222222222222111000','01112222222222222222222222211100','01112222222222222222222222211100','01112222222222222222222222211100','01112222222222222222222222211100','00111222222222222222222222111000','00111222222222222222222222111000','00011122222222222222222221110000','00011122222222222222222221110000','00001112222222222222222111000000','00001112222222222222222211100000','00000111222222222222221110000000','00000011122222222222211100000000','00000001112222222222110000000000','00000000111222222211100000000000','00000000001112222110000000000000','00000000000011111100000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000']},
{name:'おおきづち',hp:18,atk:5,def:2,spd:2,crit:6,reward:{hp:5,speed:0,defence:2,critical:1,magicattack:0},magic:{name:'ホイミ',power:-8},skill:{name:'ぶんまわし',power:8,bonus:'heavy'},pattern:['00000000000000000000000000000000','00000000000000003330000000000000','00000000000000033333300000000000','0000000000000333333333000000000','00000000000033333333333000000000','00000000000333333333333300000000','00000000003333333333333330000000','00000000033333333333333333000000','00000000333333333333333333300000','00000003333333333333333333330000','00000033333333333333333333333000','00000333333333333333333333333300','00003333333333333333333333333330','00033333333333333333333333333333','00333333333333333333333333333330','00333333333333333333333333333330','00033333333333333333333333333333','00003333333333333333333333333330','00000333333333333333333333333300','00000033333333333333333333333000','00000003333333333333333333330000','00000000333333333333333333300000','00000000033333333333333333000000','00000000003333333333333330000000','00000000000333333333333300000000','00000000000033333333333000000000','00000000000003333333330000000000','00000000000000033333300000000000','00000000000000003330000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000']},
{name:'まどうし',hp:15,atk:4,def:1,spd:6,crit:8,reward:{hp:2,speed:2,defence:0,critical:1,magicattack:3},magic:{name:'ギラ',power:10},skill:{name:'みかわし',power:0,bonus:'evade'},pattern:['00000000000000000000000000000000','00000000000000444400000000000000','0000000000000444444000000000000','0000000000004444444440000000000','00000000000444444444444000000000','00000000004444444444444400000000','00000000044444444444444440000000','00000000444444444444444444400000','00000004444444444444444444440000','00000044444444444444444444444000','00000444444444444444444444444400','00004444444444444444444444444440','00044444444444444444444444444444','00444444444444444444444444444440','00444444444444444444444444444440','00044444444444444444444444444444','00004444444444444444444444444440','00000444444444444444444444444400','00000044444444444444444444444000','00000004444444444444444444440000','00000000444444444444444444400000','00000000044444444444444440000000','00000000004444444444444400000000','00000000000444444444444000000000','0000000000004444444440000000000','0000000000000444444000000000000','00000000000000444400000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000','00000000000000000000000000000000']},
{name:'ドラゴン',hp:26,atk:7,def:3,spd:5,crit:10,reward:{hp:7,speed:1,defence:2,critical:2,magicattack:2},magic:{name:'ベギラマ',power:14},skill:{name:'かえん斬り',power:11,bonus:'fire'},pattern:['00000000000000000000000000000000','00000000000000001100000000000000','00000000000000011110000000000000','00000000000000111111000000000000','00000000000001111111100000000000','00000000000011111111110000000000','00000000000111111111111000000000','00000000001111111111111100000000','00000000011111111111111110000000','00000000111111111111111111000000','00000001111111111111111111100000','00000011111111111111111111110000','00000111111111111111111111111000','00001111111111111111111111111100','00011111111111111111111111111110','00111111111111111111111111111111','00111111111111111111111111111111','00011111111111111111111111111110','00001111111111111111111111111100','00000111111111111111111111111000','00000011111111111111111111110000','00000001111111111111111111100000','00000000111111111111111111000000','00000000011111111111111110000000','00000000001111111111111100000000','00000000000111111111111000000000','00000000000011111111110000000000','00000000000001111111100000000000','00000000000000111111000000000000','00000000000000011110000000000000','00000000000000001100000000000000','00000000000000000000000000000000']}
];
let state={stage:0,enemy:null,turn:'player',enemyHp:0,stats:{hp:30,hpMax:30,speed:5,defence:2,critical:5,magicattack:3},magic:[],skill:null,potions:3,guard:false,over:false,log:'モンスターが あらわれた！'};
function makeMagic(m){return{name:m.name,power:m.power}}
function setup(){state.enemy=monsters[state.stage];state.enemyHp=state.enemy.hp;state.turn='player';state.guard=false;state.log=state.enemy.name+' が あらわれた！';render()}
function render(){const e=state.enemy;if(!e)return;$('enemyName').textContent=e.name;$('enemyHp').textContent='HP '+Math.max(0,state.enemyHp)+' / '+e.hp;$('message').textContent=state.log;$('stats').innerHTML=Object.entries({HP:state.stats.hp+'/'+state.stats.hpMax,SPEED:state.stats.speed,DEFENCE:state.stats.defence,CRITICAL:state.stats.critical+'%',MAGIC:state.stats.magicattack}).map(([k,v])=>'<div class="stat">'+k+'<b>'+v+'</b></div>').join('');drawSprite(e.pattern);document.querySelectorAll('.cmd').forEach(b=>b.disabled=state.turn!=='player'||state.over)}
function drawSprite(pattern){const c=$('sprite'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,32,32);const pal={'0':null,'1':'#17251d','2':'#dce9b4','3':'#6c3f26','4':'#513c78'};pattern.forEach((row,y)=>[...row].forEach((v,xx)=>{if(pal[v]){x.fillStyle=pal[v];x.fillRect(xx,y,1,1)}}))}
function showPanel(title,items){const p=$('panel');p.className='panel open';p.innerHTML='<div class="box"><b>'+title+'</b><div class="choices">'+items.map((it,i)=>'<button class="choice" data-i="'+i+'">'+it.name+'<small>'+it.desc+'</small></button>').join('')+'</div></div>';p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>items[+b.dataset.i].fn())}
function closePanel(){$('panel').className='panel';$('panel').innerHTML=''}
function statLine(r){return Object.entries(r).filter(([,v])=>v).map(([k,v])=>k.toUpperCase()+' +'+v).join(' / ')}
function attack(){closePanel();let dmg=rollDamage(5);state.enemyHp=Math.max(0,state.enemyHp-dmg);state.log='こうげき！ '+dmg+' ダメージ！';afterPlayer()}
function rollDamage(base){let crit=Math.random()*100<state.stats.critical;let dmg=Math.max(1,base+Math.floor(Math.random()*4)+Math.floor(state.stats.speed/3)-state.enemy.def);if(crit)dmg*=2;return dmg}
function magic(){const items=state.magic.map((m,i)=>({name:m.name,desc:'威力 '+m.power+(m.power<0?' / 回復':' / 魔法攻撃補正あり'),fn:()=>castMagic(i)}));if(!items.length){state.log='覚えている まほうは ない。';render();return}showPanel('まほう',items)}
function castMagic(i){closePanel();const m=state.magic[i];if(m.power<0){state.stats.hp=Math.min(state.stats.hpMax,state.stats.hp+Math.abs(m.power));state.log=m.name+'！ HPが '+Math.abs(m.power)+' 回復した！';afterPlayer();return}let dmg=Math.max(1,m.power+state.stats.magicattack-Math.floor(state.enemy.def/2));state.enemyHp=Math.max(0,state.enemyHp-dmg);state.log=m.name+'！ '+dmg+' ダメージ！';afterPlayer()}
function skill(){if(!state.skill){state.log='覚えている スキルは ない。';render();return}showPanel('スキル',[{name:state.skill.name,desc:state.skill.desc,fn:useSkill}])}
function useSkill(){closePanel();let s=state.skill;if(s.bonus==='evade'){state.guard=true;state.log='みかわし！ 次の攻撃を かわしやすくする！';afterPlayer();return}let dmg=Math.max(1,s.power+Math.floor(state.stats.speed/4)-state.enemy.def);if(s.bonus==='attackTwice')dmg+=Math.max(1,s.power+Math.floor(state.stats.speed/4)-state.enemy.def);if(s.bonus==='fire')dmg+=state.stats.magicattack;state.enemyHp=Math.max(0,state.enemyHp-dmg);state.log=s.name+'！ '+dmg+' ダメージ！';afterPlayer()}
function item(){showPanel('アイテム',[{name:'やくそう',desc:'HPを 8 回復 / 残り '+state.potions+'個',fn:()=>{if(state.potions<=0){state.log='やくそうが ない！';render();return}closePanel();state.potions--;state.stats.hp=Math.min(state.stats.hpMax,state.stats.hp+8);state.log='やくそうを 使った！';afterPlayer()}},{name:'ぼうぎょ',desc:'次の攻撃のダメージを半減',fn:()=>{closePanel();state.guard=true;state.log='身を守っている。';afterPlayer()}}])}
function afterPlayer(){render();if(state.enemyHp<=0){setTimeout(reward,300);return}state.turn='enemy';render();setTimeout(enemyTurn,500)}
function enemyTurn(){let dmg=Math.max(1,state.enemy.atk+Math.floor(Math.random()*3)-state.stats.defence);if(state.guard)dmg=Math.ceil(dmg/2);if(Math.random()*100<state.enemy.crit)dmg*=2;state.stats.hp=Math.max(0,state.stats.hp-dmg);state.guard=false;state.log=state.enemy.name+' の攻撃！ '+dmg+' ダメージ！';if(state.stats.hp<=0){lose();return}state.turn='player';render()}
function reward(){state.turn='none';const r=state.enemy.reward;for(const k in r)state.stats[k]+=r[k];state.stats.hp=state.stats.hpMax;state.stats.hpMax+=r.hp;$('overlay').classList.remove('hidden');const m=makeMagic(state.enemy.magic),s=state.enemy.skill;$('modal').innerHTML='<h2>'+state.enemy.name+' を たおした！</h2><p><span class="tag">ステータス上昇</span><br>'+statLine(r)+'<br>HPが全回復した！</p><div class="reward"><button id="getMagic">まほう「'+m.name+'」を手に入れる</button><button id="getSkill">スキル「'+s.name+'」を手に入れる</button></div><p>どちらか1つを選択。魔法は最大4つ、スキルは最大1つ。</p>';$('getMagic').onclick=()=>chooseReward('magic',m);$('getSkill').onclick=()=>chooseReward('skill',s)}
function chooseReward(type,val){if(type==='magic'){if(state.magic.length>=4){chooseReplacement('魔法',state.magic,val,'magic');return}state.magic.push(val);continueGame('まほう「'+val.name+'」を覚えた！')}else{if(state.skill){chooseReplacement('スキル',[state.skill],val,'skill');return}state.skill={name:val.name,power:val.power,bonus:val.bonus,desc:skillDesc(val)};continueGame('スキル「'+val.name+'」を覚えた！')}}
function skillDesc(s){return s.bonus==='evade'?'次の攻撃を回避しやすくする':s.bonus==='attackTwice'?'2回攻撃する':s.bonus==='fire'?'魔法攻撃力が追加される':'強力な攻撃'}
function chooseReplacement(label,current,val,type){$('modal').innerHTML='<h2>'+label+'がいっぱいだ！</h2><p>残すものを選んでください。</p><div class="reward">'+current.map((x,i)=>'<button data-r="'+i+'">残す：'+x.name+'</button>').join('')+'<button data-r="new">新しい「'+val.name+'」を残す</button></div>';$('modal').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.r==='new'){if(type==='magic')state.magic=[...state.magic.slice(0,3),val];else state.skill={name:val.name,power:val.power,bonus:val.bonus,desc:skillDesc(val)}}continueGame((b.dataset.r==='new'?'新しい':'現在の')+label+'を選んだ！')})}
function continueGame(msg){$('overlay').classList.add('hidden');state.log=msg;state.stage++;if(state.stage>=monsters.length){win();return}setup()}
function win(){$('overlay').classList.remove('hidden');$('modal').innerHTML='<h1>QUEST COMPLETE!</h1><p>すべてのモンスターを たおした！<br><br>'+Object.entries(state.stats).filter(([k])=>k!=='hpMax').map(([k,v])=>k+' : '+v).join('<br>')+'</p><button onclick="location.reload()">もう一度あそぶ</button>';state.over=true;render()}
function lose(){$('overlay').classList.remove('hidden');$('modal').innerHTML='<h1>GAME OVER</h1><p>力尽きてしまった……</p><button onclick="location.reload()">もう一度あそぶ</button>';state.over=true;render()}
function intro(){ $('modal').innerHTML='<h1>DOT MONSTER QUEST</h1><p>モンスターを1体ずつたおして進め。<br>敵を倒すたびに5ステータスが固定値で上昇し、まほう or スキルを1つ獲得する。<br><br>まほうは最大4つ、スキルは最大1つ。制限時間はない。</p><button id="start">ぼうけんを はじめる</button>';$('start').onclick=()=>{$('overlay').classList.add('hidden');setup()}}
intro();
for(const b of document.querySelectorAll('.cmd'))b.onclick=()=>({attack,magic,skill,item}[b.dataset.cmd])();
</script>
</body>
</html>
