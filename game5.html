<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#08070d;color:#eee9d8;font-family:monospace}#game{width:min(720px,100%);min-height:100vh;margin:auto;background:#0d0b14;border:4px solid #eee9d8;padding:10px}.title{text-align:center;padding:55px 12px}.title h1{font-size:28px;letter-spacing:3px}.menu{display:grid;gap:10px;margin-top:28px}button{width:100%;min-height:48px;background:#0a0910;color:#eee9d8;border:3px solid #eee9d8;padding:10px;font:700 13px monospace;box-shadow:4px 4px #302039}.balance{border:3px solid #eee9d8;background:#09080e;padding:16px;margin:20px 0}.bar{margin:16px 0}.bar label{display:flex;justify-content:space-between}.track{height:18px;background:#211a29;border:2px solid #eee9d8}.fill{height:100%;background:#8555c5}.scene{height:350px;position:relative;overflow:hidden;border:3px solid #eee9d8;background:#171020}.name,.ehp{position:absolute;top:8px;background:#09080e;border:3px solid #eee9d8;padding:5px 8px;z-index:5}.name{left:8px}.ehp{right:8px}.sprite{position:absolute;width:270px;height:270px;left:42%;top:55%;transform:translate(-50%,-50%);z-index:4}.sprite canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:7px;bottom:7px;width:142px;z-index:7}.stat{display:flex;justify-content:space-between;background:#09080eee;border:2px solid #9f96ad;padding:5px;font-size:10px;margin:2px}.box{margin-top:8px;background:#09080e;border:3px solid #eee9d8;padding:11px;min-height:64px;line-height:1.65}.commands,.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.panel{display:none}.panel.open{display:block}.panel small{display:block;color:#aaa3b8;font-size:9px;margin-top:4px}.overlay{position:fixed;inset:0;background:#030207ee;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{width:min(540px,100%);background:#0d0b14;border:4px solid #eee9d8;padding:18px}.hidden{display:none!important}.enemy-hit{animation:eh .28s steps(3,end)}.scene-hit{animation:sh .28s steps(3,end)}@keyframes eh{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 8px),-50%);filter:brightness(.35)}75%{transform:translate(calc(-50% - 4px),-50%);filter:brightness(1.8)}}@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.45)}75%{transform:translate(-3px,1px);filter:brightness(1.8)}}</style></head><body><main id="game"></main><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>"use strict";(()=>{const G=document.getElementById('game'),O=document.getElementById('overlay'),M=document.getElementById('modal');const names=['壊し魔','勅蝋','夜哭公','腐泥','骸王','視穢','死招使','縫骸','骸灯','裂面','禍核','喰影','穢鏡','怨垂','冥府卿','晶喰','呪稲','餓獄犬','骨喰虫','終冥王'];const magic=['影炎流','摩謔弾','月鉛の棘','虚無の眼','黒雨','蝕火','冥灯','骨煙','夜葬','灰界'];const skills=['裂骨打','影縫い','喉断ち','空葬','反転構え','連環裂','硬化突き','瞬歩殺','崩し刃','星砕き'];const S={battle:1,enemy:null,enemyHP:0,turn:false,stats:{hp:30,max:30,speed:5,defence:2,critical:5,attack:0,magicattack:0},magic:[],skill:null,potions:3,guard:false};const el=id=>document.getElementById(id);function start(){G.innerHTML='<section class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。</p><div class="menu"><button id="begin">▶ ぼうけんを はじめる</button></div></section>';el('begin').onclick=balance}function balance(){G.innerHTML='<section class="title"><h1>ABILITY SET</h1><p>攻撃と魔力のバランスを決めよう。</p><div class="balance"><div class="bar"><label>ATTACK <b id="av"></b></label><div class="track"><div id="af" class="fill"></div></div></div><div class="bar"><label>MAGIC ATTACK <b id="mv"></b></label><div class="track"><div id="mf" class="fill"></div></div></div></div><p>シャッフルで配分を変更。</p><div class="menu"><button id="sh">▶ バランスを シャッフル</button><button id="go">▶ このバランスで バトルスタート</button></div></section>';el('sh').onclick=shuffle;el('go').onclick=battle;shuffle()}function shuffle(){let a=Math.floor(Math.random()*12);S.stats.attack=a;S.stats.magicattack=11-a;el('av').textContent=a;el('mv').textContent=11-a;el('af').style.width=a/11*100+'%';el('mf').style.width=(11-a)/11*100+'%'}function make(){let n=S.battle,b=n%5===0;return{name:names[n-1],boss:b,maxHP:10+n*2+(b?n*5:0),atk:2+Math.floor(n*.65)+(b?3:0),def:1+Math.floor(n/6)+(b?2:0),crit:4+n+(b?5:0),type:n-1,magic:{name:magic[(n-1)%10],power:5+Math.floor(n/2)+(b?4:0),desc:'闇の力でダメージを与える。'},skill:{name:skills[(n-1)%10],power:4+n+(b?5:0),desc:'異形の特殊攻撃。'},reward:{hp:1+(b?3:0),speed:b?1:0,defence:b?1:0,critical:b?1:0,magicattack:b?1:0}}}function battle(){S.enemy=make();S.enemyHP=S.enemy.maxHP;S.turn=true;G.innerHTML='<h3>VOID MONSTER QUEST　戦 '+S.battle+' / 20</h3><section class="scene" id="scene"><div class="name" id="en"></div><div class="ehp" id="hp"></div><div class="sprite" id="spr"><canvas id="cv" width="32" height="32"></canvas></div><div class="stats" id="stats"></div></section><div class="box" id="msg"></div><div class="commands"><button id="a">▶ こうげき</button><button id="m">▶ まほう</button><button id="s">▶ スキル</button><button id="i">▶ アイテム</button></div><div id="panel" class="panel"></div>';el('a').onclick=attack;el('m').onclick=magicMenu;el('s').onclick=skillMenu;el('i').onclick=item;S.msg=(S.enemy.boss?'★ 強敵 ★ ':'')+S.enemy.name+' が あらわれた！';render()}function render(){el('en').textContent=S.enemy.name;el('hp').textContent='HP '+S.enemyHP+' / '+S.enemy.maxHP;el('msg').textContent=S.msg;el('stats').innerHTML=[['HP',S.stats.hp+'/'+S.stats.max],['SPEED',S.stats.speed],['DEFENCE',S.stats.defence],['CRITICAL',S.stats.critical+'%'],['MAGIC ATK',S.stats.magicattack],['ATTACK',S.stats.attack]].map(v=>'<div class="stat"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join('');document.querySelectorAll('.commands button').forEach(b=>b.disabled=!S.turn||S.enemyHP<=0);draw()}function p(x,y,w,h,c){let q=el('cv').getContext('2d');q.fillStyle=c;q.fillRect(x,y,w,h)}function draw(){let q=el('cv').getContext('2d');q.clearRect(0,0,32,32);const B='#050509',W='#eee9d8',D='#39343e',G='#88838d',P='#7540a4',R='#b54a4a',O='#b46a28',C='#c8c2d0',Y='#d1a34b';let t=S.enemy.type;/* twenty distinct silhouettes, deliberately hand-pixeled */if(t===0){p(11,3,10,2,B);p(8,5,16,15,B);p(10,6,12,13,W);p(6,10,3,7,B);p(23,10,3,7,B);p(11,10,2,3,B);p(19,10,2,3,B);p(12,20,3,5,W);p(18,20,3,5,W)}else if(t===1){p(12,2,8,3,B);p(8,5,16,3,B);p(6,8,20,13,B);p(10,7,12,12,D);p(11,9,2,3,B);p(19,9,2,3,B);p(14,14,5,2,O);p(11,21,3,5,B);p(18,21,3,5,B)}else if(t===2){p(13,2,6,4,B);p(9,6,14,8,G);p(4,9,8,10,B);p(20,9,8,10,B);p(10,12,12,12,D);p(12,8,2,3,R);p(18,8,2,3,R);p(13,15,6,3,B);p(11,24,4,4,B);p(17,24,4,4,B)}else if(t===3){p(8,7,16,15,P);p(5,11,22,9,P);p(11,9,10,8,B);p(13,12,6,4,B);p(7,21,5,5,P);p(20,21,5,5,P);p(4,15,4,3,D);p(24,15,4,3,D)}else if(t===4){p(10,3,12,4,Y);p(6,7,20,5,B);p(8,11,16,13,D);p(10,12,3,3,C);p(19,12,3,3,C);p(3,16,5,3,B);p(24,16,5,3,B);p(11,24,4,5,B);p(17,24,4,5,B)}else if(t===5){p(13,2,6,3,C);p(8,5,16,3,G);p(5,9,22,14,D);p(11,10,10,8,C);p(14,11,4,4,P);p(7,13,5,5,G);p(20,13,5,5,G);p(10,23,3,4,B);p(19,23,3,4,B)}else if(t===6){p(14,2,4,5,P);p(8,7,16,14,D);p(5,11,5,9,B);p(22,11,5,9,B);p(11,10,2,3,C);p(19,10,2,3,C);p(13,15,6,3,B);p(11,23,3,5,P);p(18,23,3,5,P)}else if(t===7){p(11,4,10,4,C);p(7,8,18,15,C);p(9,10,14,12,D);p(12,12,2,2,B);p(18,12,2,2,B);p(4,13,4,8,C);p(24,13,4,8,C);p(11,23,3,4,B);p(18,23,3,4,B)}else if(t===8){p(14,2,4,6,O);p(9,7,14,15,B);p(11,10,10,10,D);p(14,11,4,5,P);p(6,13,5,7,B);p(21,13,5,7,B);p(10,22,4,5,B);p(18,22,4,5,B)}else if(t===9){p(12,3,8,4,Y);p(8,7,16,18,B);p(11,9,10,13,D);p(7,12,4,7,B);p(21,12,4,7,B);p(11,10,2,3,R);p(19,10,2,3,R);p(13,16,6,2,O);p(10,24,4,4,B);p(18,24,4,4,B)}else if(t===10){p(14,2,4,5,P);p(8,6,16,5,D);p(5,11,22,11,B);p(10,10,12,12,D);p(12,13,8,5,P);p(3,13,4,6,B);p(25,13,4,6,B);p(10,23,4,5,B);p(18,23,4,5,B)}else if(t===11){p(13,3,6,3,G);p(9,6,14,15,G);p(5,10,6,12,D);p(21,10,6,12,D);p(11,9,3,3,B);p(18,9,3,3,B);p(14,15,5,3,P);p(9,23,5,4,B);p(18,23,5,4,B)}else if(t===12){p(7,4,18,3,P);p(5,7,22,18,B);p(9,9,14,14,G);p(11,12,3,5,B);p(18,12,3,5,B);p(13,17,7,3,P);p(4,16,4,5,D);p(24,16,4,5,D);p(10,24,4,4,B);p(18,24,4,4,B)}else if(t===13){p(13,2,6,4,P);p(8,6,16,4,B);p(6,10,20,14,D);p(10,11,12,10,C);p(12,13,2,3,P);p(18,13,2,3,P);p(13,17,6,3,R);p(8,23,4,4,B);p(20,23,4,4,B)}else if(t===14){p(11,2,10,3,Y);p(7,5,18,4,B);p(5,9,22,16,D);p(9,9,14,12,G);p(12,12,3,3,P);p(18,12,3,3,P);p(13,17,6,3,B);p(6,22,5,5,B);p(21,22,5,5,B)}else if(t===15){p(13,2,6,4,C);p(8,6,16,18,B);p(10,9,12,13,D);p(12,12,3,3,P);p(17,12,3,3,P);p(6,11,4,9,G);p(22,11,4,9,G);p(10,23,4,4,B);p(18,23,4,4,B)}else if(t===16){p(12,2,8,3,O);p(8,5,16,5,Y);p(5,9,22,15,B);p(10,10,12,11,D);p(13,12,6,3,O);p(7,22,5,5,D);p(20,22,5,5,D);p(11,24,3,4,B);p(18,24,3,4,B)}else if(t===17){p(10,3,12,4,D);p(6,7,20,13,G);p(3,10,5,5,B);p(24,10,5,5,B);p(10,10,3,3,R);p(19,10,3,3,R);p(13,15,6,3,B);p(8,21,5,6,D);p(19,21,5,6,D)}else if(t===18){p(12,4,8,3,C);p(8,7,16,15,G);p(5,11,5,8,B);p(22,11,5,8,B);p(11,10,2,3,B);p(19,10,2,3,B);p(13,16,6,3,P);p(9,23,4,5,B);p(19,23,4,5,B)}else{p(12,1,8,4,Y);p(7,5,18,4,B);p(4,9,24,16,D);p(9,8,14,16,G);p(11,11,3,3,P);p(18,11,3,3,P);p(13,16,6,3,R);p(3,14,5,8,P);p(24,14,5,8,P);p(7,23,5,5,B);p(20,23,5,5,B)}}function hit(n){S.enemyHP=Math.max(0,S.enemyHP-n);fx(1)}function fx(enemy){let n=el(enemy?'spr':'scene');n.classList.remove(enemy?'enemy-hit':'scene-hit');void n.offsetWidth;n.classList.add(enemy?'enemy-hit':'scene-hit');setTimeout(()=>n.classList.remove(enemy?'enemy-hit':'scene-hit'),280)}function end(){render();if(S.enemyHP<=0){S.turn=false;setTimeout(reward,300);return}S.turn=false;setTimeout(enemyTurn,420)}function attack(){if(!S.turn)return;let d=Math.max(1,S.stats.attack+Math.floor(Math.random()*4)-S.enemy.def);if(Math.random()*100<S.stats.critical)d*=2;hit(d);S.msg='こうげき！ '+d+' ダメージ！';end()}function magicMenu(){if(!S.magic.length){S.msg='覚えている魔法は ない。';render();return}panel('まほうを選ぶ',S.magic.map(m=>({n:m.name,d:m.desc,fn:()=>panel('もう一度選択すると発動',[{n:m.name,d:'魔力 '+S.stats.magicattack+' を加算',fn:()=>{close();hit(Math.max(1,m.power+S.stats.magicattack-S.enemy.def));S.msg=m.name+'を 発動！';end()}}])})))}function skillMenu(){if(!S.skill){S.msg='覚えているスキルは ない。';render();return}panel('スキルを選ぶ',[{n:S.skill.name,d:S.skill.desc,fn:()=>{close();hit(Math.max(1,S.skill.power+Math.floor(S.stats.speed/3)-S.enemy.def));S.msg=S.skill.name+'！';end()}}])}function item(){panel('アイテム',[{n:'回復薬',d:'HPを8回復 / 残り '+S.potions,fn:()=>{if(!S.potions){S.msg='回復薬が ない。';close();render();return}S.potions--;S.stats.hp=Math.min(S.stats.max,S.stats.hp+8);close();S.msg='回復薬を 使った！';end()}},{n:'守勢',d:'次の被ダメージ半減',fn:()=>{S.guard=true;close();S.msg='守りを固めた。';end()}}])}function panel(title,arr){let p=el('panel');p.className='panel open';p.innerHTML='<div class="box"><b>'+title+'</b><div class="choices">'+arr.map((x,i)=>'<button data-i="'+i+'">'+x.n+'<small>'+x.d+'</small></button>').join('')+'</div></div>';p.querySelectorAll('button').forEach(b=>b.onclick=()=>arr[+b.dataset.i].fn())}function close(){el('panel').className='panel';el('panel').innerHTML=''}function enemyTurn(){let d=Math.max(1,S.enemy.atk+Math.floor(Math.random()*3)-S.stats.defence);if(S.guard)d=Math.ceil(d/2);S.guard=false;S.stats.hp=Math.max(0,S.stats.hp-d);fx(0);S.msg=S.enemy.name+'の攻撃！ '+d+' ダメージ！';if(S.stats.hp<=0)return gameOver();S.turn=true;render()}function reward(){let r=S.enemy.reward;S.stats.max+=r.hp;S.stats.hp=Math.min(S.stats.max,S.stats.hp+4);S.stats.speed+=r.speed;S.stats.defence+=r.defence;S.stats.critical+=r.critical;S.stats.magicattack+=r.magicattack;O.classList.remove('hidden');M.innerHTML='<h2>'+S.enemy.name+'を たおした！</h2><p>HP +'+r.hp+' / SPEED +'+r.speed+' / DEFENCE +'+r.defence+' / CRITICAL +'+r.critical+' / MAGIC ATK +'+r.magicattack+'</p><p>獲得するものを選択。</p><button id="gm">魔法「'+S.enemy.magic.name+'」</button><button id="gs">スキル「'+S.enemy.skill.name+'」</button>';el('gm').onclick=()=>gainMagic(S.enemy.magic);el('gs').onclick=()=>gainSkill(S.enemy.skill)}function gainMagic(m){if(S.magic.length<4){S.magic.push(m);next()}else replace('魔法',m)}function gainSkill(k){if(!S.skill){S.skill=k;next()}else replace('スキル',k)}function replace(type,n){M.innerHTML='<h2>'+type+'がいっぱいだ！</h2><button id="yes">新しい「'+n.name+'」を残す</button><button id="no">今のものを残す</button>';el('yes').onclick=()=>{if(type==='魔法')S.magic=[...S.magic.slice(0,3),n];else S.skill=n;next()};el('no').onclick=next}function next(){O.classList.add('hidden');S.battle++;if(S.battle>20)return complete();battle()}function complete(){O.classList.remove('hidden');M.innerHTML='<h1>QUEST COMPLETE!</h1><p>20戦突破！</p><button onclick="location.reload()">もう一度</button>'}function gameOver(){O.classList.remove('hidden');M.innerHTML='<h1>GAME OVER</h1><button onclick="location.reload()">もう一度</button>'}start()})();</script></body></html>
