<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>DOT MONSTER QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#eee6c8;font-family:monospace}#game{width:min(620px,100%);min-height:100vh;margin:auto;background:#181c25;border:4px solid #303644;padding:12px}.title{text-align:center;padding:35px 10px}.title h1{font-size:27px}.menu{display:grid;gap:10px;margin-top:25px}button{width:100%;min-height:48px;background:#252c39;color:#eee6c8;border:3px solid #687081;padding:10px;font:700 13px monospace}.balance{border:4px solid #e8dfb9;background:#10151e;padding:15px;margin:20px 0}.bar{margin:15px 0}.bar label{display:flex;justify-content:space-between}.track{height:20px;background:#252c39;border:2px solid #687081;margin-top:5px}.fill{height:100%;background:#d9c36a}.note{font-size:11px;line-height:1.7;color:#aaa895}.scene{height:280px;position:relative;border:4px solid #e8dfb9;background:#52694d}.name,.enemyhp{position:absolute;top:8px;background:#111620;border:3px solid #e8dfb9;padding:5px;z-index:2}.name{left:8px}.enemyhp{right:8px}.sprite{position:absolute;width:192px;height:192px;left:50%;top:54%;transform:translate(-50%,-50%)}canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:5px;bottom:5px;width:130px;z-index:3}.stat{display:flex;justify-content:space-between;background:#111620e8;border:2px solid #aaa486;padding:4px;font-size:10px;margin:2px}.box{margin-top:8px;background:#10151e;border:4px solid #e8dfb9;padding:10px;min-height:70px}.commands,.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.panel{display:none}.panel.open{display:block}.panel small{display:block;color:#aaa895;font-size:9px;margin-top:4px}.overlay{position:fixed;inset:0;background:#080a0ee8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{width:min(520px,100%);background:#181d27;border:5px solid #e8dfb9;padding:16px}.hidden{display:none!important}.enemy-hit{animation:eh .28s steps(3,end)}.scene-hit{animation:sh .28s steps(3,end)}@keyframes eh{0%,100%{transform:translate(-50%,-50%);filter:none}25%{transform:translate(calc(-50% - 7px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 7px),-50%);filter:brightness(.5)}75%{transform:translate(calc(-50% - 3px),-50%);filter:brightness(1.8)}}@keyframes sh{0%,100%{transform:translate(0);filter:none}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.5)}75%{transform:translate(-3px,1px);filter:brightness(1.7)}}</style></head><body><main id="game"></main><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>"use strict";(()=>{const G=document.getElementById('game'),O=document.getElementById('overlay'),M=document.getElementById('modal');const monsterNames=['ミズゴロ','コゲツムリ','ハネガサ','モリノワ','イワツブテラ','ヨルネコ','ツノカゲ','アワムシ','カゼノメ','ヌマグマ','ホシクイ','クロカブリ','シロツチ','ミミズバコ','カゲボウシ','アカネグモ','ソラノクチ','ネムリバナ','ガラクタマ','オオトビラ'];const magicNames=['ルミナ','ヴェイル','グレイズ','ノクス','リフレア','ゼノン','ミストラ','オルタ','フロストル','エクリア'];const skillNames=['裂光打','影縫い','轟き返し','空断ち','反転構え','連環撃','硬化突き','瞬歩撃','崩し刃','星砕き'];const S={battle:1,enemy:null,enemyHP:0,turn:false,stats:{hp:30,max:30,speed:5,defence:2,critical:5,attack:0,magicattack:0},magic:[],skill:null,potions:3,guard:false};function startScreen(){G.innerHTML='<section class="title"><h1>DOT MONSTER QUEST</h1><p>20体のモンスターを突破せよ。<br>すべてドットで描かれた世界。</p><div class="menu"><button id="beginButton">▶ ぼうけんを はじめる</button></div></section>';document.getElementById('beginButton').onclick=balanceScreen}function balanceScreen(){G.innerHTML='<section class="title"><h1>ABILITY SET</h1><p>攻撃と魔力のバランスを決めよう。</p><div class="balance"><div class="bar"><label>ATTACK <b id="attackValue"></b></label><div class="track"><div id="attackFill" class="fill"></div></div></div><div class="bar"><label>MAGIC ATTACK <b id="magicValue"></b></label><div class="track"><div id="magicFill" class="fill"></div></div></div></div><p class="note">シャッフルで攻撃と魔力の配分を変更。<br>好きな配分で確定してください。</p><div class="menu"><button id="shuffleButton">▶ バランスを シャッフル</button><button id="confirmButton">▶ このバランスで バトルスタート</button></div></section>';document.getElementById('shuffleButton').onclick=shuffle;document.getElementById('confirmButton').onclick=battle;shuffle()}function shuffle(){const total=11;const attack=Math.floor(Math.random()*(total+1));S.stats.attack=attack;S.stats.magicattack=total-attack;document.getElementById('attackValue').textContent=attack;document.getElementById('magicValue').textContent=total-attack;document.getElementById('attackFill').style.width=(attack/total*100)+'%';document.getElementById('magicFill').style.width=((total-attack)/total*100)+'%'}function makeEnemy(){const n=S.battle,boss=n%5===0;return{name:monsterNames[n-1],boss:boss,maxHP:10+n*2+(boss?n*5:0),atk:2+Math.floor(n*.65)+(boss?3:0),def:1+Math.floor(n/6)+(boss?2:0),crit:4+n+(boss?5:0),magic:{name:magicNames[(n-1)%10],power:5+Math.floor(n/2)+(boss?4:0),desc:'魔力でダメージを与える。'},skill:{name:skillNames[(n-1)%10],power:4+n+(boss?5:0),desc:'強力な特殊攻撃。'},reward:{hp:1+(boss?3:0),speed:boss?1:0,defence:boss?1:0,critical:boss?1:0,magicattack:boss?1:0}}}function battle(){S.enemy=makeEnemy();S.enemyHP=S.enemy.maxHP;S.turn=true;S.guard=false;G.innerHTML='<h3>DOT MONSTER QUEST　戦 '+S.battle+' / 20</h3><section id="scene" class="scene"><div id="enemyName" class="name"></div><div id="enemyHP" class="enemyhp"></div><div id="sprite" class="sprite"><canvas id="monsterCanvas" width="32" height="32"></canvas></div><div id="stats" class="stats"></div></section><div id="message" class="box"></div><div class="commands"><button id="attackButton">▶ こうげき</button><button id="magicButton">▶ まほう</button><button id="skillButton">▶ スキル</button><button id="itemButton">▶ アイテム</button></div><div id="panel" class="panel"></div>';document.getElementById('attackButton').onclick=attack;document.getElementById('magicButton').onclick=magic;document.getElementById('skillButton').onclick=skill;document.getElementById('itemButton').onclick=item;S.message=(S.enemy.boss?'★ 強敵 ★ ':'')+S.enemy.name+' が あらわれた！';render()}function render(){document.getElementById('enemyName').textContent=S.enemy.name;document.getElementById('enemyHP').textContent='HP '+S.enemyHP+' / '+S.enemy.maxHP;document.getElementById('message').textContent=S.message;document.getElementById('stats').innerHTML=[['HP',S.stats.hp+'/'+S.stats.max],['SPEED',S.stats.speed],['DEFENCE',S.stats.defence],['CRITICAL',S.stats.critical+'%'],['MAGIC ATK',S.stats.magicattack],['ATTACK',S.stats.attack]].map(v=>'<div class="stat"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join('');document.querySelectorAll('.commands button').forEach(b=>b.disabled=!S.turn||S.enemyHP<=0);drawMonster()}function drawMonster(){const c=document.getElementById('monsterCanvas'),x=c.getContext('2d');x.clearRect(0,0,32,32);for(let y=6;y<27;y++)for(let i=6;i<27;i++){x.fillStyle=(i+y)%7===0?'#17201b':'#d9e6ad';x.fillRect(i,y,1,1)}}function effect(enemy){const n=document.getElementById(enemy?'sprite':'scene');n.classList.remove(enemy?'enemy-hit':'scene-hit');void n.offsetWidth;n.classList.add(enemy?'enemy-hit':'scene-hit');setTimeout(()=>n.classList.remove(enemy?'enemy-hit':'scene-hit'),280)}function deal(n){S.enemyHP=Math.max(0,S.enemyHP-n);effect(true)}function attack(){if(!S.turn)return;let d=Math.max(1,S.stats.attack+Math.floor(Math.random()*4)-S.enemy.def);if(Math.random()*100<S.stats.critical)d*=2;deal(d);S.message='こうげき！ '+d+' ダメージ！';endPlayerTurn()}function magic(){if(!S.magic.length){S.message='覚えている魔法は ない。';render();return}openPanel('まほうを選ぶ',S.magic.map(m=>({name:m.name,desc:m.desc,action:()=>openPanel('もう一度選択すると発動',[{name:m.name,desc:'魔力 '+S.stats.magicattack+' を加算',action:()=>{closePanel();deal(Math.max(1,m.power+S.stats.magicattack-Math.floor(S.enemy.def/2)));S.message=m.name+'を 発動！';endPlayerTurn()}}])})));}function skill(){if(!S.skill){S.message='覚えているスキルは ない。';render();return}openPanel('スキルを選ぶ',[{name:S.skill.name,desc:S.skill.desc,action:()=>{closePanel();deal(Math.max(1,S.skill.power+Math.floor(S.stats.speed/3)-S.enemy.def));S.message=S.skill.name+'！';endPlayerTurn()}}])}function item(){openPanel('アイテム',[{name:'回復薬',desc:'HPを8回復 / 残り '+S.potions,action:()=>{if(!S.potions){S.message='回復薬が ない。';closePanel();render();return}S.potions--;S.stats.hp=Math.min(S.stats.max,S.stats.hp+8);closePanel();S.message='回復薬を 使った！';endPlayerTurn()}},{name:'守勢',desc:'次の被ダメージ半減',action:()=>{S.guard=true;closePanel();S.message='守りを固めた。';endPlayerTurn()}}])}function openPanel(title,items){const p=document.getElementById('panel');p.className='panel open';p.innerHTML='<div class="box"><b>'+title+'</b><div class="choices">'+items.map((i,n)=>'<button class="choice" data-index="'+n+'">'+i.name+'<small>'+i.desc+'</small></button>').join('')+'</div></div>';p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>items[Number(b.dataset.index)].action())}function closePanel(){const p=document.getElementById('panel');p.className='panel';p.innerHTML=''}function endPlayerTurn(){render();if(S.enemyHP<=0){S.turn=false;setTimeout(reward,300);return}S.turn=false;render();setTimeout(enemyTurn,420)}function enemyTurn(){let d=Math.max(1,S.enemy.atk+Math.floor(Math.random()*3)-S.stats.defence);if(S.guard)d=Math.ceil(d/2);S.guard=false;if(Math.random()*100<S.enemy.crit)d*=2;S.stats.hp=Math.max(0,S.stats.hp-d);effect(false);S.message=S.enemy.name+'の攻撃！ '+d+' ダメージ！';if(S.stats.hp<=0){gameOver();return}S.turn=true;render()}function reward(){const r=S.enemy.reward;S.stats.max+=r.hp;S.stats.hp=Math.min(S.stats.max,S.stats.hp+4);S.stats.speed+=r.speed;S.stats.defence+=r.defence;S.stats.critical+=r.critical;S.stats.magicattack+=r.magicattack;O.classList.remove('hidden');M.innerHTML='<h2>'+S.enemy.name+'を たおした！</h2><p>ステータス上昇：HP +'+r.hp+' / SPEED +'+r.speed+' / DEFENCE +'+r.defence+' / CRITICAL +'+r.critical+' / MAGIC ATK +'+r.magicattack+'</p><p>魔法かスキルを1つ選択。</p><button id="getMagic">魔法「'+S.enemy.magic.name+'」</button><button id="getSkill">スキル「'+S.enemy.skill.name+'」</button>';document.getElementById('getMagic').onclick=()=>gainMagic(S.enemy.magic);document.getElementById('getSkill').onclick=()=>gainSkill(S.enemy.skill)}function gainMagic(m){if(S.magic.length<4){S.magic.push(m);next()}else{M.innerHTML='<h2>魔法がいっぱいだ！</h2><button id="replace">新しい「'+m.name+'」を残す</button><button id="keep">今の魔法を残す</button>';document.getElementById('replace').onclick=()=>{S.magic=[...S.magic.slice(0,3),m];next()};document.getElementById('keep').onclick=next}}function gainSkill(k){if(!S.skill){S.skill=k;next()}else{M.innerHTML='<h2>スキルがいっぱいだ！</h2><button id="replace">新しい「'+k.name+'」を残す</button><button id="keep">今のスキルを残す</button>';document.getElementById('replace').onclick=()=>{S.skill=k;next()};document.getElementById('keep').onclick=next}}function next(){O.classList.add('hidden');S.battle++;if(S.battle>20){complete();return}battle()}function complete(){O.classList.remove('hidden');M.innerHTML='<h1>QUEST COMPLETE!</h1><p>20戦突破！</p><button id="restart">もう一度</button>';document.getElementById('restart').onclick=()=>location.reload()}function gameOver(){O.classList.remove('hidden');M.innerHTML='<h1>GAME OVER</h1><button id="restart">もう一度</button>';document.getElementById('restart').onclick=()=>location.reload()}startScreen()})();</script></body></html>
