<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID MONSTER QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08070d;color:#f1e9d0;font-family:monospace}body{image-rendering:pixelated}#game{width:min(720px,100%);min-height:100vh;margin:auto;background:#0d0b14;border-left:4px solid #eee9d8;border-right:4px solid #eee9d8;padding:10px;box-shadow:0 0 0 2px #27202f}.title{text-align:center;padding:55px 12px}.title h1{font-size:30px;letter-spacing:3px;color:#eee9d8;text-shadow:3px 3px #352246}.title p{line-height:1.9;color:#aaa3b8}.menu{display:grid;gap:10px;margin-top:30px}button{width:100%;min-height:48px;background:#0a0910;color:#eee9d8;border:3px solid #eee9d8;padding:10px;font:700 13px monospace;box-shadow:4px 4px 0 #302039}button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #302039}.balance{border:3px solid #eee9d8;background:#09080e;padding:16px;margin:20px 0;box-shadow:5px 5px 0 #2b1c3b}.bar{margin:16px 0}.bar label{display:flex;justify-content:space-between}.track{height:18px;background:#211a29;border:2px solid #eee9d8;margin-top:6px}.fill{height:100%;background:#8555c5}.note{font-size:11px;line-height:1.8;color:#aaa3b8}.battle-title{margin:4px 0 8px;text-align:center;color:#eee9d8}.scene{height:350px;position:relative;overflow:hidden;border:3px solid #eee9d8;background:#16101e;background-image:linear-gradient(#171020 0 58%,#21172b 58% 59%,#120d18 59%);box-shadow:inset 0 0 0 4px #251a31}.scene:after{content:"";position:absolute;left:0;right:0;bottom:0;height:105px;opacity:.55;background:repeating-linear-gradient(90deg,#30223c 0 38px,#1a1223 38px 42px),repeating-linear-gradient(0deg,transparent 0 24px,#3b2948 24px 27px);mix-blend-mode:screen}.name,.enemyhp{position:absolute;top:8px;background:#09080e;border:3px solid #eee9d8;padding:5px 8px;z-index:5}.name{left:8px}.enemyhp{right:8px}.sprite{position:absolute;width:250px;height:250px;left:42%;top:54%;transform:translate(-50%,-50%);z-index:4}.sprite canvas{width:100%;height:100%;image-rendering:pixelated}.stats{position:absolute;right:7px;bottom:7px;width:142px;z-index:7}.stat{display:flex;justify-content:space-between;background:#09080eee;border:2px solid #9f96ad;padding:5px;font-size:10px;margin:2px}.box{margin-top:8px;background:#09080e;border:3px solid #eee9d8;padding:11px;min-height:64px;line-height:1.65}.commands,.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.panel{display:none}.panel.open{display:block}.panel small{display:block;color:#aaa3b8;font-size:9px;margin-top:4px}.overlay{position:fixed;inset:0;background:#030207ee;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{width:min(540px,100%);background:#0d0b14;border:4px solid #eee9d8;padding:18px;box-shadow:8px 8px 0 #302039}.hidden{display:none!important}.enemy-hit{animation:eh .28s steps(3,end)}.scene-hit{animation:sh .28s steps(3,end)}@keyframes eh{0%,100%{transform:translate(-50%,-50%);filter:none}25%{transform:translate(calc(-50% - 8px),-50%);filter:brightness(2)}50%{transform:translate(calc(-50% + 8px),-50%);filter:brightness(.35)}75%{transform:translate(calc(-50% - 4px),-50%);filter:brightness(1.8)}}@keyframes sh{0%,100%{transform:translate(0);filter:none}25%{transform:translate(-5px,2px);filter:brightness(2)}50%{transform:translate(5px,-2px);filter:brightness(.45)}75%{transform:translate(-3px,1px);filter:brightness(1.8)}}@media(max-width:520px){.scene{height:310px}.sprite{width:210px;height:210px;left:40%}.stats{width:128px}.commands{grid-template-columns:1fr 1fr}.title h1{font-size:24px}}</style></head><body><main id="game"></main><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>"use strict";(()=>{const G=document.getElementById('game'),O=document.getElementById('overlay'),M=document.getElementById('modal');const monsterNames=['壊し魔','勅蝋','夜哭公','骸灯','黒祀','禍殻','喰影','凶殻','亡蝋','裂面','骨喰','影葬','屍鐘','蝕門','喪喰','灰哭','怨牙','腐環','冥鴉','終蝋'];const magicNames=['影炎流','摩謔弾','月鉛の棘','虚無の眼','黒雨','蝕火','冥灯','骨煙','夜葬','灰界'];const skillNames=['裂骨打','影縫い','喉断ち','空葬','反転構え','連環裂','硬化突き','瞬歩殺','崩し刃','星砕き'];const S={battle:1,enemy:null,enemyHP:0,turn:false,stats:{hp:30,max:30,speed:5,defence:2,critical:5,attack:0,magicattack:0},magic:[],skill:null,potions:3,guard:false};function startScreen(){G.innerHTML='<section class="title"><h1>VOID MONSTER QUEST</h1><p>20体の異形を突破せよ。<br>すべてドットで描かれた、暗い世界。</p><div class="menu"><button id="beginButton">▶ ぼうけんを はじめる</button></div></section>';document.getElementById('beginButton').onclick=balanceScreen}function balanceScreen(){G.innerHTML='<section class="title"><h1>ABILITY SET</h1><p>攻撃と魔力のバランスを決めよう。</p><div class="balance"><div class="bar"><label>ATTACK <b id="attackValue"></b></label><div class="track"><div id="attackFill" class="fill"></div></div></div><div class="bar"><label>MAGIC ATTACK <b id="magicValue"></b></label><div class="track"><div id="magicFill" class="fill"></div></div></div></div><p class="note">シャッフルで攻撃と魔力の配分を変更。<br>好きな配分で確定してください。</p><div class="menu"><button id="shuffleButton">▶ バランスを シャッフル</button><button id="confirmButton">▶ このバランスで バトルスタート</button></div></section>';document.getElementById('shuffleButton').onclick=shuffle;document.getElementById('confirmButton').onclick=battle;shuffle()}function shuffle(){const total=11,attack=Math.floor(Math.random()*(total+1));S.stats.attack=attack;S.stats.magicattack=total-attack;document.getElementById('attackValue').textContent=attack;document.getElementById('magicValue').textContent=total-attack;document.getElementById('attackFill').style.width=attack/total*100+'%';document.getElementById('magicFill').style.width=(total-attack)/total*100+'%'}function makeEnemy(){const n=S.battle,boss=n%5===0;return{name:monsterNames[n-1],boss,maxHP:10+n*2+(boss?n*5:0),atk:2+Math.floor(n*.65)+(boss?3:0),def:1+Math.floor(n/6)+(boss?2:0),crit:4+n+(boss?5:0),type:(n-1)%3,magic:{name:magicNames[(n-1)%10],power:5+Math.floor(n/2)+(boss?4:0),desc:'闇の力でダメージを与える。'},skill:{name:skillNames[(n-1)%10],power:4+n+(boss?5:0),desc:'異形の特殊攻撃。'},reward:{hp:1+(boss?3:0),speed:boss?1:0,defence:boss?1:0,critical:boss?1:0,magicattack:boss?1:0}}}function battle(){S.enemy=makeEnemy();S.enemyHP=S.enemy.maxHP;S.turn=true;S.guard=false;G.innerHTML='<h3 class="battle-title">VOID MONSTER QUEST　戦 '+S.battle+' / 20</h3><section id="scene" class="scene"><div id="enemyName" class="name"></div><div id="enemyHP" class="enemyhp"></div><div id="sprite" class="sprite"><canvas id="monsterCanvas" width="32" height="32"></canvas></div><div id="stats" class="stats"></div></section><div id="message" class="box"></div><div class="commands"><button id="attackButton">▶ こうげき</button><button id="magicButton">▶ まほう</button><button id="skillButton">▶ スキル</button><button id="itemButton">▶ アイテム</button></div><div id="panel" class="panel"></div>';document.getElementById('attackButton').onclick=attack;document.getElementById('magicButton').onclick=magic;document.getElementById('skillButton').onclick=skill;document.getElementById('itemButton').onclick=item;S.message=(S.enemy.boss?'★ 強敵 ★ ':'')+S.enemy.name+' が あらわれた！';render()}function render(){document.getElementById('enemyName').textContent=S.enemy.name;document.getElementById('enemyHP').textContent='HP '+S.enemyHP+' / '+S.enemy.maxHP;document.getElementById('message').textContent=S.message;document.getElementById('stats').innerHTML=[['HP',S.stats.hp+'/'+S.stats.max],['SPEED',S.stats.speed],['DEFENCE',S.stats.defence],['CRITICAL',S.stats.critical+'%'],['MAGIC ATK',S.stats.magicattack],['ATTACK',S.stats.attack]].map(v=>'<div class="stat"><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join('');document.querySelectorAll('.commands button').forEach(b=>b.disabled=!S.turn||S.enemyHP<=0);drawMonster()}function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function drawMonster(){const ctx=document.getElementById('monsterCanvas').getContext('2d');ctx.clearRect(0,0,32,32);const t=S.enemy.type,B='#050509';if(t===0){const W='#eee9d8',G='#aaa3ad';px(ctx,11,4,10,2,B);px(ctx,9,6,14,3,B);px(ctx,7,9,18,12,B);px(ctx,9,8,14,13,W);px(ctx,6,11,3,7,B);px(ctx,23,11,3,7,B);px(ctx,8,20,5,5,W);px(ctx,19,20,5,5,W);px(ctx,11,11,2,3,B);px(ctx,19,11,2,3,B);px(ctx,14,15,4,2,G);px(ctx,12,22,2,4,B);px(ctx,18,22,2,4,B)}else if(t===1){const D='#36313d',G='#8d8893',O='#b46a28';px(ctx,12,2,7,3,B);px(ctx,8,5,16,3,B);px(ctx,6,8,20,13,B);px(ctx,9,8,14,12,D);px(ctx,11,7,10,8,G);px(ctx,7,12,4,6,B);px(ctx,21,12,4,6,B);px(ctx,12,10,2,3,B);px(ctx,18,10,2,3,B);px(ctx,14,15,5,2,O);px(ctx,10,20,12,4,D);px(ctx,12,23,3,4,B);px(ctx,18,23,3,4,B)}else{const D='#4a4650',G='#a9a5ad';px(ctx,3,10,8,8,B);px(ctx,0,8,6,5,D);px(ctx,1,13,7,5,G);px(ctx,21,10,8,8,B);px(ctx,26,8,6,5,D);px(ctx,24,13,7,5,G);px(ctx,9,7,14,16,B);px(ctx,11,8,10,15,D);px(ctx,13,7,6,7,G);px(ctx,14,13,4,2,B);px(ctx,12,17,2,4,G);px(ctx,18,17,2,4,G);px(ctx,10,23,4,4,B);px(ctx,18,23,4,4,B)}}function effect(enemy){const n=document.getElementById(enemy?'sprite':'scene');n.classList.remove(enemy?'enemy-hit':'scene-hit');void n.offsetWidth;n.classList.add(enemy?'enemy-hit':'scene-hit');setTimeout(()=>n.classList.remove(enemy?'enemy-hit':'scene-hit'),280)}function deal(n){S.enemyHP=Math.max(0,S.enemyHP-n);effect(true)}function attack(){if(!S.turn)return;let d=Math.max(1,S.stats.attack+Math.floor(Math.random()*4)-S.enemy.def);if(Math.random()*100<S.stats.critical)d*=2;deal(d);S.message=(d>15?'会心の一撃！ ':'こうげき！ ')+d+' ダメージ！';endPlayerTurn()}function magic(){if(!S.magic.length){S.message='覚えている魔法は ない。';render();return}openPanel('まほうを選ぶ',S.magic.map(m=>({name:m.name,desc:m.desc,action:()=>openPanel('もう一度選択すると発動',[{name:m.name,desc:'魔力 '+S.stats.magicattack+' を加算',action:()=>{closePanel();deal(Math.max(1,m.power+S.stats.magicattack-Math.floor(S.enemy.def/2)));S.message=m.name+'を 発動！';endPlayerTurn()}}])})));}function skill(){if(!S.skill){S.message='覚えているスキルは ない。';render();return}openPanel('スキルを選ぶ',[{name:S.skill.name,desc:S.skill.desc,action:()=>{closePanel();deal(Math.max(1,S.skill.power+Math.floor(S.stats.speed/3)-S.enemy.def));S.message=S.skill.name+'！';endPlayerTurn()}}])}function item(){openPanel('アイテム',[{name:'回復薬',desc:'HPを8回復 / 残り '+S.potions,action:()=>{if(!S.potions){S.message='回復薬が ない。';closePanel();render();return}S.potions--;S.stats.hp=Math.min(S.stats.max,S.stats.hp+8);closePanel();S.message='回復薬を 使った！';endPlayerTurn()}},{name:'守勢',desc:'次の被ダメージ半減',action:()=>{S.guard=true;closePanel();S.message='守りを固めた。';endPlayerTurn()}}])}function openPanel(title,items){const p=document.getElementById('panel');p.className='panel open';p.innerHTML='<div class="box"><b>'+title+'</b><div class="choices">'+items.map((i,n)=>'<button class="choice" data-index="'+n+'">'+i.name+'<small>'+i.desc+'</small></button>').join('')+'</div></div>';p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>items[Number(b.dataset.index)].action())}function closePanel(){const p=document.getElementById('panel');p.className='panel';p.innerHTML=''}function endPlayerTurn(){render();if(S.enemyHP<=0){S.turn=false;setTimeout(reward,300);return}S.turn=false;render();setTimeout(enemyTurn,420)}function enemyTurn(){let d=Math.max(1,S.enemy.atk+Math.floor(Math.random()*3)-S.stats.defence);if(S.guard)d=Math.ceil(d/2);S.guard=false;if(Math.random()*100<S.enemy.crit)d*=2;S.stats.hp=Math.max(0,S.stats.hp-d);effect(false);S.message=S.enemy.name+'の攻撃！ '+d+' ダメージ！';if(S.stats.hp<=0){gameOver();return}S.turn=true;render()}function reward(){const r=S.enemy.reward;S.stats.max+=r.hp;S.stats.hp=Math.min(S.stats.max,S.stats.hp+4);S.stats.speed+=r.speed;S.stats.defence+=r.defence;S.stats.critical+=r.critical;S.stats.magicattack+=r.magicattack;O.classList.remove('hidden');M.innerHTML='<h2>'+S.enemy.name+'を たおした！</h2><p>ステータス上昇：HP +'+r.hp+' / SPEED +'+r.speed+' / DEFENCE +'+r.defence+' / CRITICAL +'+r.critical+' / MAGIC ATK +'+r.magicattack+'</p><p>魔法かスキルを1つ選択。</p><button id="getMagic">魔法「'+S.enemy.magic.name+'」</button><button id="getSkill">スキル「'+S.enemy.skill.name+'」</button>';document.getElementById('getMagic').onclick=()=>gainMagic(S.enemy.magic);document.getElementById('getSkill').onclick=()=>gainSkill(S.enemy.skill)}function gainMagic(m){if(S.magic.length<4){S.magic.push(m);next()}else{M.innerHTML='<h2>魔法がいっぱいだ！</h2><button id="replace">新しい「'+m.name+'」を残す</button><button id="keep">今の魔法を残す</button>';document.getElementById('replace').onclick=()=>{S.magic=[...S.magic.slice(0,3),m];next()};document.getElementById('keep').onclick=next}}function gainSkill(k){if(!S.skill){S.skill=k;next()}else{M.innerHTML='<h2>スキルがいっぱいだ！</h2><button id="replace">新しい「'+k.name+'」を残す</button><button id="keep">今のスキルを残す</button>';document.getElementById('replace').onclick=()=>{S.skill=k;next()};document.getElementById('keep').onclick=next}}function next(){O.classList.add('hidden');S.battle++;if(S.battle>20){complete();return}battle()}function complete(){O.classList.remove('hidden');M.innerHTML='<h1>QUEST COMPLETE!</h1><p>20戦突破！</p><button id="restart">もう一度</button>';document.getElementById('restart').onclick=()=>location.reload()}function gameOver(){O.classList.remove('hidden');M.innerHTML='<h1>GAME OVER</h1><button id="restart">もう一度</button>';document.getElementById('restart').onclick=()=>location.reload()}startScreen()})();</script></body></html>
